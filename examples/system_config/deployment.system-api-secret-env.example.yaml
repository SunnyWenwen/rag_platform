# Merge env into the System Runtime container. For split deployments, use only
# the entries for the pipeline enabled in that container.
env:
  - name: INGESTION_API_USERNAME
    valueFrom:
      secretKeyRef:
        name: system-ingestion-api
        key: username
  - name: INGESTION_API_PASSWORD
    valueFrom:
      secretKeyRef:
        name: system-ingestion-api
        key: password
  - name: INFERENCE_API_USERNAME
    valueFrom:
      secretKeyRef:
        name: system-inference-api
        key: username
  - name: INFERENCE_API_PASSWORD
    valueFrom:
      secretKeyRef:
        name: system-inference-api
        key: password
