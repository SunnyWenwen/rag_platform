# Merge this env list into the Runtime container in the Deployment.
env:
  - name: PLED_ES_NUMBER
    valueFrom:
      secretKeyRef:
        name: pled-es-credentials
        key: es-number
  - name: PLED_ES_ACCOUNT
    valueFrom:
      secretKeyRef:
        name: pled-es-credentials
        key: account
  - name: PLED_ES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: pled-es-credentials
        key: password
