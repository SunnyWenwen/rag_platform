# Merge this env list into the runtime container in the Deployment.
# The target namespace must already contain the Secret and ConfigMap.
env:
  - name: PARSER_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: parser-credentials
        key: api-token
  - name: trace_label
    valueFrom:
      configMapKeyRef:
        name: rag-runtime-settings
        key: parser-trace-label
