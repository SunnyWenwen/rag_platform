# Merge this env list into the runtime container in the Deployment.
# The target namespace must already contain the Secret and ConfigMap.
env:
  - name: REMOTE_PARSING_TOKEN
    valueFrom:
      secretKeyRef:
        name: parser-credentials
        key: api-token
  - name: REMOTE_PARSING_URL
    valueFrom:
      configMapKeyRef:
        name: rag-runtime-settings
        key: remote-parsing-url
  - name: REMOTE_PARSING_HEADER_X_TENANT
    valueFrom:
      configMapKeyRef:
        name: rag-runtime-settings
        key: remote-parsing-tenant
  - name: trace_label
    valueFrom:
      configMapKeyRef:
        name: rag-runtime-settings
        key: parser-trace-label
