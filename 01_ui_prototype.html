<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAG Workspace</title>
<style>
:root{--ink:#232738;--muted:#7b8193;--line:#e8eaf0;--accent:#6555d7;--bg:#f8f9fc}*{box-sizing:border-box}body{margin:0;font:14px/1.6 Inter,"Segoe UI","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible{outline:3px solid #b8aef6;outline-offset:3px}.sidebar{width:236px;position:fixed;inset:0 auto 0 0;background:white;border-right:1px solid var(--line);padding:32px 20px}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:750;letter-spacing:-.6px;margin-bottom:50px}.mark{background:var(--accent);color:white;border-radius:10px;padding:4px 12px}.caption{font-size:10px;color:var(--muted);letter-spacing:1.5px;font-weight:700;margin:0 12px 16px}.group{border:0;background:none;color:#687083;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 12px;border-radius:8px;margin:5px 0}.group.active{background:#f0edff;color:#5a49ca;font-weight:650}.group .count{margin-left:auto;font-size:11px}.side-note{position:absolute;bottom:25px;left:32px;font-size:11px;color:#979cad}main{margin-left:236px;padding:0 48px 60px}header{height:104px;display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--line)}.crumb{color:var(--muted);font-size:12px}.btn{background:white;border:1px solid #dddfea;border-radius:8px;padding:10px 16px;color:#535a6e;font-weight:600}.primary{background:var(--accent);border-color:var(--accent);color:white;box-shadow:0 4px 10px #6555d71a}.primary:hover{background:#5747c6}.intro{margin:38px 0 28px}.intro h1{font-size:28px;letter-spacing:-.8px;margin:0 0 5px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:24px;transition:box-shadow .15s}.card:hover{box-shadow:0 6px 24px #32354b09}.cardtop{display:flex;align-items:center;justify-content:space-between}.system-icon{width:48px;height:48px;display:grid;place-items:center;background:#f0edff;color:var(--accent);border-radius:13px;font-size:24px}.status{font-size:10px;color:#7e879b;background:#f6f7fa;border-radius:20px;padding:4px 9px}.status.ready{color:#268472;background:#edf9f5}.card h2{font-size:17px;margin:21px 0 3px;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted)}.actions{display:flex;gap:7px;margin-top:25px}.actions button{flex:1;border:1px solid #e6e7f0;background:white;color:#60677d;border-radius:7px;padding:8px 2px;font-size:11px}.actions button:hover{background:#f5f3ff;color:var(--accent)}.export{background:none;border:0;padding:14px 0 0;color:#9296a4;font-size:11px}.hint{font-size:11px;color:#9a9fb0;margin-top:30px}dialog{border:1px solid var(--line);border-radius:16px;width:min(1200px,94vw);max-height:90vh;padding:0;color:var(--ink);box-shadow:0 24px 100px #18213730}dialog::backdrop{background:#1a203b65;backdrop-filter:blur(3px)}.modalhead{padding:24px 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.modalhead h2{font-size:22px;margin:0}.close{border:0;background:#f5f6fa;border-radius:8px;font-size:22px;color:#7e8594;padding:0 10px}.modalbody{padding:26px 30px;background:#fafbfe}.modalfoot{padding:18px 30px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line)}.label{display:block;font-size:12px;font-weight:600;color:#646c82;margin:12px 0 6px}.control{width:100%;border:1px solid #dfe2eb;border-radius:8px;padding:10px 12px;background:white;color:var(--ink)}.control:focus{outline:2px solid #d5ceff}.builder{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:20px;margin-top:22px}.panel{background:white;border:1px solid var(--line);border-radius:11px;padding:20px}.panel h3{font-size:14px;margin:0 0 15px}.module-line{display:flex;flex-wrap:wrap;gap:8px}.module{border:1px solid #e1e4ed;background:white;border-radius:8px;padding:14px 12px;text-align:left;flex:1;min-width:110px;color:#4d566d}.module strong{font-size:12px;display:block}.module small{display:block;font-size:10px;margin-top:8px;color:#8790a3}.module.selected{border-color:var(--accent);background:#f6f3ff;color:var(--accent)}.pipeline+.pipeline{margin-top:18px}.notice{font-size:12px;padding:12px;border-radius:8px;background:#f2f0ff;color:#64588d;white-space:pre-line;margin-top:18px}.notice.error{background:#fff1ef;color:#af4a3b}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:22px}.upload{border:1px dashed #cfd0e2;background:#faf9ff;padding:28px 20px;border-radius:9px;margin:16px 0}.result{white-space:pre-wrap;background:white;border:1px solid var(--line);padding:20px;border-radius:9px;min-height:170px;font-size:13px}.toast{position:fixed;bottom:25px;right:28px;background:#30334b;color:white;padding:12px 20px;border-radius:10px;display:none;z-index:10}.empty{padding:50px;border:1px dashed #daddE8;border-radius:12px;color:var(--muted)}@media(max-width:1250px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:850px){.sidebar{width:185px;padding:26px 12px}main{margin-left:185px;padding:0 22px}.cards,.builder,.twocol{grid-template-columns:1fr}.modalhead,.modalbody,.modalfoot{padding:20px}.brand{font-size:16px}.side-note{left:20px}}@media(max-width:550px){.sidebar{position:static;width:100%;padding:14px}.brand{margin:0 0 12px}.caption,.side-note{display:none}#groups{display:flex;overflow:auto}.group{white-space:nowrap;margin:0;width:auto}.count{display:none}main{margin:0;padding:0 16px}header{height:85px}.crumb{display:none}.intro{margin-top:24px}.modalhead h2{font-size:18px}}
.control:disabled,.control[readonly]{background:#f0f1f6;color:#858a99;cursor:not-allowed}.control option:disabled{color:#9a9eac}.rule{font-size:11px;color:#817b98;margin:6px 0 10px}.demo-cases{margin-top:18px;font-size:12px;color:#7b8193}.demo-cases button{margin:8px 5px 0 0;border:1px solid #dddbea;background:white;border-radius:6px;padding:6px 10px;color:#64588d}.locked{margin-top:20px;border-top:1px solid var(--line);padding-top:12px}</style></head><body>
<aside class="sidebar"><div class="brand"><span class="mark">r</span> RAG Workspace</div><div class="caption">WORKSPACES</div><nav id="groups" aria-label="Workspace groups"></nav><div class="side-note">UI Prototype · 示意資料<br>重新整理會重設所有操作</div></aside>
<main><header><div class="crumb">Workspaces <span style="padding:0 12px">/</span><span id="crumb"></span></div><button class="btn primary" onclick="openCreate()">＋ Create RAG System</button></header><div class="intro"><h1 id="groupTitle"></h1><div class="muted" id="groupDesc"></div></div><div class="cards" id="cards"></div><p class="hint">選擇 RAG System，進行 Ingest、Inference 或 Evaluation。</p></main>
<dialog id="createDialog" aria-labelledby="createTitle"><div class="modalhead"><div><h2 id="createTitle">Create RAG System</h2><div class="muted" id="createGroup"></div></div><button class="close" aria-label="關閉" onclick="this.closest('dialog').close()">×</button></div><div class="modalbody"><label class="label" for="systemName">RAG System 名稱</label><input class="control" id="systemName" placeholder="例如：Customer Support RAG" maxlength="80"><details class="demo-cases"><summary>卡控示範（套用示例設定）</summary><button onclick="demoCase(1)">1 · 缺少全文索引</button><button onclick="demoCase(2)">2 · 多欄位 Hybrid</button><button onclick="demoCase(3)">3 · Local / Memory</button><button onclick="demoCase(4)">4 · Top-K 限制 Top-N</button><p>會重設此彈窗的模組設定，保留 RAG System 名稱。</p></details><div class="builder"><div><div class="panel pipeline"><h3>Ingestion</h3><div id="ingestnodes" class="module-line"></div></div><div class="panel pipeline"><h3>Inference</h3><div id="querynodes" class="module-line"></div></div></div><div class="panel"><h3 id="modtitle"></h3><div class="muted" id="moddesc" style="font-size:12px"></div><label class="label" for="implementation">Implementation</label><select class="control" id="implementation" onchange="updateImpl(this.value)"></select><div id="dynamicfields"></div></div></div><details class="panel" style="margin-top:18px"><summary>資料契約預覽 · 示意內容</summary><pre id="contractPreview" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></details><div class="notice" id="validation" role="status"></div></div><div class="modalfoot"><button class="btn" onclick="$('createDialog').close()">Cancel</button><button class="btn primary" id="createButton" onclick="createSystem()">Create RAG System</button></div></dialog>
<dialog id="operationDialog" aria-labelledby="operationTitle"><div class="modalhead"><div><h2 id="operationTitle"></h2><div class="muted" id="operationSystem"></div></div><button class="close" aria-label="關閉" onclick="this.closest('dialog').close()">×</button></div><div class="modalbody" id="operationBody"></div></dialog><div id="toast" class="toast" role="status"></div>
<script>
const mods=[
 {id:'import',title:'Data Import',desc:'Input connector, source mode',opts:['Upload / Object Storage','S3 Connector','Database Connector'],fields:[['source','Source URI','text','s3://example-bucket/docs']]},
 {id:'parsing',title:'Parsing',desc:'Document conversion / OCR strategy',opts:['PyMuPDF','Unstructured','OCR Pipeline'],fields:[['ocr','OCR Mode','select',['off','auto','on']]]},
 {id:'chunking',title:'Chunking',desc:'Chunk boundary / overlap policy',opts:['Recursive Text','Sentence-aware','Markdown Header'],fields:[['size','Chunk Size','number',512],['overlap','Chunk Overlap','number',64]]},
 {id:'embedding',title:'Embedding',desc:'Vector embedding backend / dimension',opts:['Enterprise Embedding API','Sentence Transformers','Azure OpenAI Embedding'],fields:[['model','Model ID','text','bge-m3'],['dimension','Vector Dimension','number',1024]]},
 {id:'indexing',title:'Indexing',desc:'Document / vector / search index',opts:['Elasticsearch Hybrid','OpenSearch Hybrid','Qdrant Vector'],fields:[['alias','Index Alias','text','cs-rag-sandbox'],['metric','Similarity','select',['cosine','dot_product']]]},
 {id:'transform',title:'Query Transform',desc:'Rewrite / expansion strategy',opts:['No Rewrite','Query Rewrite LLM','Multi-query'],fields:[['max_queries','Max Queries','number',1]]},
 {id:'retrieval',title:'Retrieval',desc:'Sparse / dense / hybrid retrieval',opts:['Hybrid Search','Dense Vector Search','BM25 Search'],fields:[['top_k','Top-K','number',5],['alpha','Dense Weight (0–1)','number',0.6]]},
 {id:'rerank',title:'Rerank',desc:'Rank retrieved candidates',opts:['Cross Encoder','LLM Reranker','None'],fields:[['top_n','Top-N after Rerank','number',3]]},
 {id:'generation',title:'Generation',desc:'Prompt template / LLM settings',opts:['Enterprise LLM Gateway','Gemini','OpenAI-compatible API'],fields:[['model','Generation Model','text','company-llm'],['temperature','Temperature (0–2)','number',0.2]]}
];
const $=id=>document.getElementById(id), esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
let defaultConfig=()=>Object.fromEntries(mods.map(m=>[m.id,{implementation:m.opts[0],...Object.fromEntries(m.fields.map(f=>[f[0],Array.isArray(f[3])?f[3][0]:f[3]]))}]));
const groups=['Customer Support','Engineering','Operations'];let group=0,selected='chunking',config=defaultConfig(),active=null,nextId=5;
const systems=[{id:1,group:0,name:'Customer Support RAG',docs:12},{id:2,group:0,name:'Product FAQ',docs:8},{id:3,group:0,name:'Service Handbook',docs:0},{id:4,group:1,name:'Engineering Knowledge',docs:0}].map(s=>({...s,config:defaultConfig(),files:[],qa:'',result:'',answer:''}));
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').style.display='none',3000)}
function render(){$('groups').innerHTML=groups.map((g,i)=>`<button class="group ${i===group?'active':''}" onclick="switchGroup(${i})" aria-pressed="${i===group}"><span>▦</span>${esc(g)}<span class="count">${systems.filter(s=>s.group===i).length}</span></button>`).join('');$('crumb').textContent=groups[group];$('groupTitle').textContent=groups[group];const list=systems.filter(s=>s.group===group);$('groupDesc').textContent=list.length+' RAG systems';$('cards').innerHTML=list.length?list.map(s=>`<article class="card"><div class="cardtop"><span class="system-icon">▧</span><span class="status ${s.docs?'ready':''}">${s.docs?'可測試 · Demo':'待匯入資料'}</span></div><h2>${esc(s.name)}</h2><div class="meta">${s.docs} documents · ${esc(s.config.retrieval.implementation)}</div><div class="actions"><button onclick="openOperation(${s.id},'ingest')">↑ Ingest</button><button onclick="openOperation(${s.id},'inference')">◇ Inference</button><button onclick="openOperation(${s.id},'evaluation')">◎ Evaluation</button></div><button class="export" onclick="exportSystem(${s.id})">↗ Export K8s YAML</button></article>`).join(''):'<div class="empty">此 Group 尚無 RAG System。點選右上角 Create RAG System 開始建立。</div>'}
function switchGroup(i){group=i;render()}
function openCreate(){config=defaultConfig();selected='chunking';$('systemName').value='';$('createGroup').textContent=groups[group];selectMod(selected);$('createDialog').showModal()}
function nodes(){for(const [id,items] of [['ingestnodes',mods.slice(0,5)],['querynodes',mods.slice(5)]])$(id).innerHTML=items.map(m=>`<button class="module ${selected===m.id?'selected':''}" onclick="selectMod('${m.id}')"><strong>${m.title}</strong><small>${esc(config[m.id].implementation)}</small></button>`).join('')}
// Demo adapter capabilities; these are not limits of the database products.
const indexCapabilities={
 'Elasticsearch Hybrid':['Dense Vector Search','BM25 Search','Hybrid Search'],
 'OpenSearch Hybrid':['Dense Vector Search','BM25 Search','Hybrid Search'],
 'Qdrant Vector':['Dense Vector Search']
};
function optionReason(id,option){return id==='retrieval'&&!indexCapabilities[config.indexing.implementation].includes(option)?'目前 Index adapter 僅建立 Dense Vector，未提供全文／Sparse 檢索':''}
function inactive(id,key){return (id==='rerank'&&key==='top_n'&&config.rerank.implementation==='None')||(id==='retrieval'&&key==='alpha'&&config.retrieval.implementation!=='Hybrid Search')}
function selectMod(id){selected=id;nodes();const m=mods.find(m=>m.id===id),c=config[id];$('modtitle').textContent=m.title;$('moddesc').textContent=m.desc;
$('implementation').innerHTML=m.opts.map(o=>{const why=optionReason(id,o);return `<option value="${esc(o)}" ${o===c.implementation?'selected':''} ${why?'disabled':''}>${esc(o)}${why?' — 不可用':''}</option>`}).join('');
$('dynamicfields').innerHTML=(id==='retrieval'?m.opts.filter(o=>optionReason(id,o)).map(o=>`<p class="rule">${esc(o)}：${optionReason(id,o)}。</p>`).join(''):'')+m.fields.map(f=>{const off=inactive(id,f[0]);let why=off?(id==='rerank'?'Rerank = None，此參數不參與執行。':'僅 Hybrid Search 使用 Dense Weight。'):'';if(id==='rerank'&&f[0]==='top_n'&&!off)why='上限繼承 Retrieval Top-K = '+config.retrieval.top_k+'；不會自動改寫既有值。';const limits=id==='rerank'&&f[0]==='top_n'?`min="1" max="${config.retrieval.top_k}"`:'';return `<label class="label" for="field-${f[0]}">${f[1]}</label>`+(f[2]==='select'?`<select class="control" id="field-${f[0]}" onchange="field('${id}','${f[0]}',this.value)">${f[3].map(v=>`<option ${v===c[f[0]]?'selected':''}>${v}</option>`).join('')}</select>`:`<input class="control" id="field-${f[0]}" type="${f[2]}" value="${esc(c[f[0]])}" step="${f[0]==='top_n'?'1':'any'}" ${limits} ${off?'disabled':''} oninput="field('${id}','${f[0]}',this.value)">`)+(why?`<p class="rule">${why}</p>`:'')}).join('');
if(id==='retrieval')$('dynamicfields').innerHTML+=`<div class="locked"><strong style="font-size:12px">Query Embedding · 自動繼承</strong><p class="rule">與 Ingestion Embedding 共用設定。修改來源後，此處同步更新；BM25 不使用 Query Embedding。</p><label class="label" for="query-model">Model（唯讀）</label><input class="control" id="query-model" readonly value="${esc(config.embedding.model)}"><label class="label" for="query-dimension">Dimension（唯讀）</label><input class="control" id="query-dimension" readonly value="${config.embedding.dimension}"></div>`;
valid()}
function updateImpl(v){if(optionReason(selected,v))return;config[selected].implementation=v;selectMod(selected)}
function field(id,k,v){if(inactive(id,k))return;config[id][k]=typeof config[id][k]==='number'?(v===''?NaN:Number(v)):v;valid()}
function demoCase(n){config=defaultConfig();if(n===1){config.indexing.implementation='Qdrant Vector';selectMod('retrieval')}if(n===2){config.embedding.model='custom-embedding-demo';config.embedding.dimension=768;selectMod('retrieval')}if(n===3){config.rerank.implementation='None';selectMod('rerank')}if(n===4){config.retrieval.top_k=2;selectMod('rerank')}}
function valid(){const errors=[], c=config;for(const m of mods)for(const f of m.fields){if(inactive(m.id,f[0]))continue;const v=c[m.id][f[0]];if(f[2]==='number'&&!Number.isFinite(v))errors.push(m.title+': '+f[1]+' 必須是數字。');if(f[2]==='text'&&!v.trim())errors.push(m.title+': '+f[1]+' 不可空白。')}
for(const [v,label,min] of [[c.chunking.size,'Chunk Size',1],[c.chunking.overlap,'Chunk Overlap',0],[c.embedding.dimension,'Vector Dimension',1],[c.retrieval.top_k,'Top-K',1],[c.transform.max_queries,'Max Queries',1]])if(!Number.isInteger(v)||v<min)errors.push(label+' 必須是 ≥ '+min+' 的整數。');
if(c.chunking.overlap>=c.chunking.size)errors.push('Chunk Overlap 必須小於 Chunk Size。');
if(optionReason('retrieval',c.retrieval.implementation))errors.push('目前選擇的 '+c.retrieval.implementation+' 已不相容。請前往 Retrieval 改選 Dense Vector Search；原選擇保留，不會自動切換。Qdrant 本身支援 Hybrid，此限制只代表範例 adapter。');
if(c.rerank.implementation!=='None'&&(!Number.isInteger(c.rerank.top_n)||c.rerank.top_n<1||c.rerank.top_n>c.retrieval.top_k))errors.push('啟用 Rerank 時，Top-N 必須是 1 到 Top-K 之間的整數。');
if(c.retrieval.implementation==='Hybrid Search'&&(c.retrieval.alpha<0||c.retrieval.alpha>1))errors.push('Dense Weight 必須介於 0–1。');if(c.generation.temperature<0||c.generation.temperature>2)errors.push('Temperature 必須介於 0–2。');
$('validation').textContent=errors.length?errors.join('\n'):'基本設定檢查通過。此為 UI 模擬；實際模型、Parser 與 Index 相容性需由 Engine 驗證。';$('validation').classList.toggle('error',!!errors.length);$('createButton').disabled=!!errors.length;return !errors.length}
function createSystem(){if(!valid())return;const name=$('systemName').value.trim();if(!name){$('systemName').focus();return}if(systems.some(s=>s.group===group&&s.name===name)){toast('此 Group 已有同名 RAG System');return}systems.push({id:nextId++,group,name,docs:0,config:structuredClone(config),files:[],qa:'',result:'',answer:''});$('createDialog').close();render();toast('RAG System 已建立（模擬）')}
function openOperation(id,type){active=systems.find(s=>s.id===id);$('operationTitle').textContent={ingest:'Ingest',inference:'Inference',evaluation:'Evaluation'}[type];$('operationSystem').textContent=groups[active.group]+' / '+active.name;const note='<p class="muted" style="font-size:12px">UI 模擬：不會上傳文件、呼叫模型或執行真實評估。</p>';let body='';
if(type==='ingest')body=`<div class="twocol"><div><label class="label" for="documents">選擇文件</label><div class="upload"><input id="documents" type="file" multiple accept=".pdf,.pptx,.txt,.md,.csv,.xlsx,.json,.png,.jpg,.jpeg"></div><button class="btn primary" onclick="runIngest()">Run Ingestion</button>${note}</div><div><label class="label">結果</label><div class="result" id="opResult">${esc(active.result||'尚未執行 Ingestion。')}</div></div></div>`;
if(type==='inference')body=`<div class="twocol"><div><label class="label" for="question">問題</label><textarea class="control" id="question" rows="5" placeholder="輸入你想測試的問題"></textarea><button class="btn primary" style="margin-top:16px" onclick="runInference()" ${active.docs?'':'disabled'}>Run Inference</button>${active.docs?'':'<p class="muted">請先透過 Ingest 匯入資料。</p>'}${note}</div><div><label class="label">回答</label><div class="result" id="opResult">${esc(active.answer||'尚未執行 Inference。')}</div></div></div>`;
if(type==='evaluation')body=`<div class="twocol"><div><label class="label" for="qaFile">QA Dataset</label><div class="upload"><input id="qaFile" type="file" accept=".csv,.json,.jsonl"></div><p class="muted" style="font-size:12px">question、expected_answer；Retrieval 評估另需 relevant document IDs。</p><button class="btn primary" onclick="runEvaluation()" ${active.docs?'':'disabled'}>Run Evaluation</button>${active.docs?'':'<p class="muted">請先透過 Ingest 匯入資料。</p>'}${note}</div><div><label class="label">評估結果</label><div class="result" id="opResult">${esc(active.qa||'尚未執行 Evaluation。')}</div></div></div>`;
$('operationBody').innerHTML=body;$('operationDialog').showModal()}
function runIngest(){const files=[...$('documents').files];if(!files.length){$('opResult').textContent='請先選擇文件。';return}active.files.push(...files.map(f=>f.name));active.docs+=files.length;active.answer='';active.qa='';active.result='Ingestion 完成（模擬）\n\n'+files.map(f=>f.name).join('\n')+'\n\nImport → Parse → Chunk → Embed → Index\n文件內容未被讀取或上傳。';$('opResult').textContent=active.result;$('documents').value='';render()}
function runInference(){if(!active.docs)return;const q=$('question').value.trim();if(!q){$('opResult').textContent='請先輸入問題。';return}active.answer='示意回覆（非真實答案）\n\n問題：'+q+'\n\n此處將顯示 '+active.name+' 的回答與來源引用。\n\n'+active.config.retrieval.implementation+' · Top-K '+active.config.retrieval.top_k+' → '+active.config.rerank.implementation+' → '+active.config.generation.model;$('opResult').textContent=active.answer}
function runEvaluation(){if(!active.docs)return;const file=$('qaFile').files[0];if(!file){$('opResult').textContent='請先上傳 QA Dataset。';return}active.qa='Evaluation 完成（模擬）\n\nDataset：'+file.name+'\nRecall@5：0.86\nFaithfulness：0.91\n\n以上為固定示意值，未讀取或測試資料集。';$('opResult').textContent=active.qa}
function effectiveConfig(raw){const c=structuredClone(raw);if(c.rerank.implementation==='None')delete c.rerank.top_n;if(c.retrieval.implementation!=='Hybrid Search')delete c.retrieval.alpha;if(c.retrieval.implementation!=='BM25 Search')c.retrieval.query_embedding={...c.embedding};return c}
function blueprint(){const effective=effectiveConfig(active.config);return {apiVersion:'rag.company/v1',kind:'RAGBlueprint',project:active.name,engineVersion:'1.0.0',pipelines:{ingestion:Object.fromEntries(mods.slice(0,5).map(m=>[m.id,effective[m.id]])),inference:Object.fromEntries(mods.slice(5).map(m=>[m.id,effective[m.id]]))}}}
function yaml(){let ns=($('namespace')?.value||'rag-customer-support').trim().replace(/[^a-z0-9-]/g,'-');let reps=active.config.indexing.implementation==='Local Search (FAISS + BM25)'?1:Number($('replicas')?.value||2);reps=Math.max(1,Math.min(10,reps));let js=JSON.stringify(blueprint());return `# DEMO / DISCUSSION ONLY — not production-ready\n# External secrets, registry, network and storage must be provisioned separately.\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: rag-blueprint\n  namespace: ${ns}\ndata:\n  blueprint.json: '${js.replaceAll("'","''")}'\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: rag-inference\n  namespace: ${ns}\nspec:\n  replicas: ${reps}\n  selector:\n    matchLabels: {app: rag-inference}\n  template:\n    metadata:\n      labels: {app: rag-inference}\n    spec:\n      containers:\n        - name: rag-engine\n          image: registry.example.internal/rag-engine:1.0.0\n          ports: [{containerPort: 8080}]\n          env:\n            - name: RAG_BLUEPRINT_PATH\n              value: /etc/rag/blueprint.json\n            - name: MODEL_API_KEY\n              valueFrom:\n                secretKeyRef:\n                  name: rag-model-credentials\n                  key: api-key\n          volumeMounts:\n            - {name: blueprint, mountPath: /etc/rag, readOnly: true}\n          readinessProbe:\n            httpGet: {path: /readyz, port: 8080}\n            initialDelaySeconds: 5\n            periodSeconds: 5\n      volumes:\n        - name: blueprint\n          configMap: {name: rag-blueprint}\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: rag-inference\n  namespace: ${ns}\nspec:\n  selector: {app: rag-inference}\n  ports: [{port: 80, targetPort: 8080}]\n# Local Search: Ingestion and Inference must share one process; MongoDB restore is required after restart when enabled.\n`}
function exportSystem(id){active=systems.find(s=>s.id===id);const url=URL.createObjectURL(new Blob([yaml()],{type:'application/yaml'}));const a=document.createElement('a');a.href=url;a.download='rag-example-k8s.yaml';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已匯出示意 YAML；需實際 Engine 與環境設定才能部署。')}
// v0.3 field-driven configuration; all operations remain simulated.
mods[0].opts=['Upload + API'];mods[0].fields=[];mods[0].desc='檔案上傳與 API 同時提供；接收原始資料，不解析內容。';
mods[1].opts=['Format routing'];mods[1].fields=[];mods[1].desc='各格式選擇解析策略，映射成五個 key 的 ParsedDocument。';
mods[4].opts=['Elasticsearch','Local Search (FAISS + BM25)'];mods[4].fields=[['alias','Index collection','text','rag-demo'],['metric','Similarity','select',['cosine','dot_product']]];
mods[6].fields=[['top_k','候選 Top-K','number',5]];
const baseDefault=defaultConfig;
defaultConfig=()=>{const c=baseDefault();c.parsing.schema=[{name:'text',source:'body',type:'string'},{name:'summary',source:'summary',type:'string'},{name:'title',source:'title',type:'string'}];c.parsing.routes={pdf:'Text extraction',pptx:'Text extraction',image:'OCR',text:'Native text',records:'Row / JSON mapping'};c.parsing.metadata=['source_uri','department'];c.chunking.split='text';c.chunking.copy=['summary','title'];c.chunking.metadata=['source_uri','department'];c.embedding.mappings=[{source:'text',output:'text_vector'},{source:'summary',output:'summary_vector'}];c.indexing.persistence='Memory';c.indexing.stored=['text','summary','title'];c.indexing.vectors=['text_vector','summary_vector'];c.indexing.fulltext=['text'];c.indexing.filters=['department'];c.retrieval.vectors=['text_vector','summary_vector'];c.retrieval.fulltext=['text'];c.retrieval.fusion='RRF';c.rerank.content=['text'];c.generation.content=['text','title'];return c;};
systems.forEach(s=>s.config=defaultConfig());config=defaultConfig();
function names(){return config.parsing.schema.map(x=>x.name)}
function chunkFields(){return [...new Set([config.chunking.split,...config.chunking.copy])]}
function vectorNames(){return config.embedding.mappings.map(x=>x.output)}
function pick(label,id,key,options,prefix=''){const current=config[id][key];return `<div class="label">${esc(label)}</div>`+[...new Set([...options,...current])].map(v=>{const ok=options.includes(v);return `<label style="display:block;font-size:12px;margin:6px 0"><input type="checkbox" ${current.includes(v)?'checked':''} onchange="togglePick('${id}','${key}',this.value,this.checked)" value="${esc(v)}"> ${esc(prefix+v)}${ok?'':' <span style="color:#b54b3e">（上游已移除，請取消）</span>'}</label>`}).join('')}
function togglePick(id,key,v,on){config[id][key]=on?[...new Set([...config[id][key],v])]:config[id][key].filter(x=>x!==v);selectMod(selected)}
function choices(values,value){return [...new Set([...values,value])].map(v=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(v)}${values.includes(v)?'':'（已失效）'}</option>`).join('')}
function redraw(){selectMod(selected)}
const originalSelect=selectMod;
selectMod=function(id){originalSelect(id);const d=$('dynamicfields');if(id==='import')d.innerHTML='<div class="notice">✓ 文件上傳　✓ Ingestion API<br>原始輸入 → SourceAsset<br>內容解析由 Parsing 負責。API 呼叫僅作示意。</div>';
if(id==='parsing'){d.innerHTML='<h4>依格式路由</h4>'+Object.entries(config.parsing.routes).map(([k,v])=>`<label class="label">${esc(k)}</label><select class="control" onchange="config.parsing.routes['${k}']=this.value;valid()">${choices(k==='pdf'?['Text extraction','OCR']:k==='image'?['OCR']: [v],v)}</select>`).join('')+'<h4>Content Schema / 欄位映射</h4><p class="rule">JSON／表格使用來源欄名；文件 Parser 的 body 映射為文字。第一版內容欄位為 string。</p>'+config.parsing.schema.map((f,i)=>`<div style="display:flex;gap:5px;margin:8px 0"><input aria-label="來源欄位 ${i}" class="control" value="${esc(f.source)}" onchange="config.parsing.schema[${i}].source=this.value;valid()"><span>→</span><input aria-label="目標欄位 ${i}" class="control" value="${esc(f.name)}" onchange="config.parsing.schema[${i}].name=this.value;redraw()"><button aria-label="刪除欄位 ${i}" onclick="config.parsing.schema.splice(${i},1);redraw()">×</button></div>`).join('')+'<button class="btn" onclick="config.parsing.schema.push({name:\'field_\'+config.parsing.schema.length,source:\'source\',type:\'string\'});redraw()">＋ 新增欄位</button><p class="rule">metadata：source_uri、department；ID、版本、權限由平台保留。ParsedDocument.structure 保存頁码與區塊。</p>';}
if(id==='chunking')d.innerHTML+=`<label class="label">主要切分欄位</label><select class="control" onchange="config.chunking.split=this.value;redraw()">${choices(names(),config.chunking.split)}</select>`+pick('複製至每個 Chunk',id,'copy',names().filter(x=>x!==config.chunking.split),'fields.')+pick('繼承 metadata',id,'metadata',config.parsing.metadata,'metadata.')+'<p class="rule">文件摘要直接複製，不生成片段摘要。locations 自動產生。</p>';
if(id==='embedding')d.innerHTML+='<h4>fields → vectors</h4>'+config.embedding.mappings.map((m,i)=>`<div style="display:flex;gap:5px;margin:8px 0"><select aria-label="Embedding source ${i}" class="control" onchange="config.embedding.mappings[${i}].source=this.value;redraw()">${choices(chunkFields(),m.source)}</select><span>→</span><input aria-label="Vector name ${i}" class="control" value="${esc(m.output)}" onchange="config.embedding.mappings[${i}].output=this.value;redraw()"><button aria-label="刪除向量 ${i}" onclick="config.embedding.mappings.splice(${i},1);redraw()">×</button></div>`).join('')+'<button class="btn" onclick="config.embedding.mappings.push({source:chunkFields()[0],output:\'vector_\'+config.embedding.mappings.length});redraw()">＋ 向量映射</button><p class="rule">此版所有映射共用上方模型／維度。向量名稱改動後，下游失效選擇會保留並提示。</p>';
if(id==='indexing')d.innerHTML+=(config.indexing.implementation.startsWith('Local')?`<label class="label">資料保存方式</label><select class="control" onchange="config.indexing.persistence=this.value;redraw()">${choices(['Memory','MongoDB'],config.indexing.persistence)}</select><p class="rule">${config.indexing.persistence==='Memory'?'程序重啟後需重新 Ingestion。':'保存 Chunk 含 vectors；重啟由既有資料重建索引。MongoDB 連線由部署環境提供。'} 單程序示意。</p>`:'<p class="rule">資料與索引由 ES 保存；連線由部署環境提供。</p>')+pick('儲存內容',id,'stored',chunkFields(),'fields.')+pick('向量索引',id,'vectors',vectorNames(),'vectors.')+pick('全文索引',id,'fulltext',chunkFields(),'fields.')+pick('過濾欄位',id,'filters',config.chunking.metadata,'metadata.')+'<p class="rule">document_id 固定支援分組；必要 ID、版本、權限固定保留。</p>';
if(id==='retrieval')d.innerHTML+=pick('向量搜尋欄位',id,'vectors',config.indexing.vectors,'vectors.')+pick('全文搜尋欄位',id,'fulltext',config.indexing.fulltext,'fields.')+`<label class="label">融合方式</label><select class="control" ${config.retrieval.implementation==='Hybrid Search'?'':'disabled'}><option>RRF</option><option disabled>加權分數融合（後續）</option></select><p class="rule">依 chunk_id 合併排名；同文件的不同 Chunk 不會自動刪除。</p>`;
if(id==='rerank'||id==='generation')d.innerHTML+=pick(id==='rerank'?'用來 Rerank 的內容':'Generation Context 欄位',id,'content',config.indexing.stored,'fields.');valid();};
optionReason=function(id,o){if(id!=='retrieval')return '';const dense=config.indexing.vectors.length>0,text=config.indexing.fulltext.length>0;return (o==='Hybrid Search'&&(!dense||!text))?'Hybrid 需要向量與全文索引':o==='Dense Vector Search'&&!dense?'尚未建立向量索引':o==='BM25 Search'&&!text?'尚未建立全文索引':'';};
valid=function(){const c=config,e=[];const check=(a,b,label)=>a.forEach(v=>{if(!b.includes(v))e.push(label+'：'+v+' 已不在上游，請修正。')});const unique=a=>new Set(a).size===a.length;const identifier=/^[A-Za-z_][A-Za-z0-9_]*$/;
if(!names().length||!unique(names())||names().some(n=>!identifier.test(n)))e.push('Parsing 欄位名稱必須唯一，使用英文字母、數字、底線，不能以數字開頭。');if(c.parsing.schema.some(f=>!f.source.trim()))e.push('來源欄位不可空白。');check([c.chunking.split,...c.chunking.copy],names(),'Chunking');if(c.chunking.copy.includes(c.chunking.split))e.push('切分欄位不可同時複製。');check(c.chunking.metadata,c.parsing.metadata,'Metadata');
check(c.embedding.mappings.map(x=>x.source),chunkFields(),'Embedding');if(!unique(vectorNames())||vectorNames().some(n=>!identifier.test(n)))e.push('向量名稱必須是有效且唯一的識別名稱。');check(c.indexing.stored,chunkFields(),'儲存欄位');check(c.indexing.fulltext,c.indexing.stored,'全文索引需保存內容');check(c.indexing.vectors,vectorNames(),'向量索引');check(c.indexing.filters,c.chunking.metadata,'過濾欄位');
const why=optionReason('retrieval',c.retrieval.implementation);if(why)e.push(why+'；原選擇保留，請修正。');const dense=c.retrieval.implementation!=='BM25 Search',text=c.retrieval.implementation!=='Dense Vector Search';if(dense){check(c.retrieval.vectors,c.indexing.vectors,'Retrieval 向量');if(!c.retrieval.vectors.length)e.push('請選擇至少一個向量搜尋欄位。');}if(text){check(c.retrieval.fulltext,c.indexing.fulltext,'Retrieval 全文');if(!c.retrieval.fulltext.length)e.push('請選擇至少一個全文搜尋欄位。');}
if(c.rerank.implementation!=='None'){check(c.rerank.content,c.indexing.stored,'Rerank');if(!c.rerank.content.length)e.push('請選擇 Rerank 內容。');if(!Number.isInteger(c.rerank.top_n)||c.rerank.top_n<1||c.rerank.top_n>c.retrieval.top_k)e.push('Top-N 必須介於 1 與 Top-K。');}check(c.generation.content,c.indexing.stored,'Generation');if(!c.generation.content.length)e.push('請選擇 Generation 內容。');
for(const [v,label,min] of [[c.chunking.size,'Chunk Size',1],[c.chunking.overlap,'Overlap',0],[c.embedding.dimension,'Dimension',1],[c.retrieval.top_k,'Top-K',1],[c.transform.max_queries,'Max Queries',1]])if(!Number.isInteger(v)||v<min)e.push(label+' 必須是有效整數。');if(c.chunking.overlap>=c.chunking.size)e.push('Overlap 必須小於 Chunk Size。');if(!Number.isFinite(c.generation.temperature)||c.generation.temperature<0||c.generation.temperature>2)e.push('Temperature 必須介於 0–2。');for(const [v,label] of [[c.embedding.model,'Embedding model'],[c.indexing.alias,'Index collection'],[c.generation.model,'Generation model']])if(!v.trim())e.push(label+' 不可空白。');
$('validation').textContent=e.length?e.join('\n'):'設定檢查通過 · UI 模擬，尚未連接 Parser、模型或資料庫。';$('validation').classList.toggle('error',!!e.length);$('createButton').disabled=!!e.length;
const fields=Object.fromEntries(names().map(n=>[n,n==='text'?'原文示例':n+' 示例']));const doc={document_id:'doc-001',source_revision:'v1',fields,metadata:{source_uri:'manual.pdf',department:'manufacturing'},structure:{}};const chunk={chunk_id:'doc-001:v1:c1',document_id:doc.document_id,source_revision:doc.source_revision,fields:Object.fromEntries(chunkFields().map(n=>[n,n===c.chunking.split?'切分後的內容':fields[n]??'上游欄位已失效'])),vectors:Object.fromEntries(vectorNames().map(n=>[n,'['+c.embedding.dimension+' 維向量，由 Embedding 產生]'])),metadata:{...Object.fromEntries(c.chunking.metadata.map(n=>[n,doc.metadata[n]])),locations:[]}};$('contractPreview').textContent='ParsedDocument（Parsing 後）\n'+JSON.stringify(doc,null,2)+'\n\nChunk（Embedding 後）\n'+JSON.stringify(chunk,null,2);return !e.length;};
demoCase=function(n){config=defaultConfig();if(n===1){config.indexing.fulltext=[];selectMod('retrieval')}if(n===2)selectMod('embedding');if(n===3){config.indexing.implementation='Local Search (FAISS + BM25)';selectMod('indexing')}if(n===4){config.retrieval.top_k=2;selectMod('rerank')}};
effectiveConfig=function(raw){const c=structuredClone(raw);if(c.rerank.implementation==='None'){delete c.rerank.top_n;delete c.rerank.content;}if(c.retrieval.implementation!=='Hybrid Search')delete c.retrieval.fusion;if(c.retrieval.implementation==='BM25 Search')delete c.retrieval.vectors;else c.retrieval.query_embedding={model:c.embedding.model,dimension:c.embedding.dimension};if(c.retrieval.implementation==='Dense Vector Search')delete c.retrieval.fulltext;if(c.indexing.implementation==='Elasticsearch')delete c.indexing.persistence;return c;};
