<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAG Workspace · Config Prototype</title><style>
:root{--ink:#232738;--muted:#7b8193;--line:#e8eaf0;--accent:#6555d7;--bg:#f8f9fc}*{box-sizing:border-box}body{margin:0;font:14px/1.6 Inter,"Segoe UI","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible{outline:3px solid #b8aef6;outline-offset:3px}.sidebar{width:236px;position:fixed;inset:0 auto 0 0;background:white;border-right:1px solid var(--line);padding:32px 20px}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:750;letter-spacing:-.6px;margin-bottom:50px}.mark{background:var(--accent);color:white;border-radius:10px;padding:4px 12px}.caption{font-size:10px;color:var(--muted);letter-spacing:1.5px;font-weight:700;margin:0 12px 16px}.group{border:0;background:none;color:#687083;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 12px;border-radius:8px;margin:5px 0}.group.active{background:#f0edff;color:#5a49ca;font-weight:650}.group .count{margin-left:auto;font-size:11px}.side-note{position:absolute;bottom:25px;left:32px;font-size:11px;color:#979cad}main{margin-left:236px;padding:0 48px 60px}header{height:104px;display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--line)}.crumb{color:var(--muted);font-size:12px}.btn{background:white;border:1px solid #dddfea;border-radius:8px;padding:10px 16px;color:#535a6e;font-weight:600}.primary{background:var(--accent);border-color:var(--accent);color:white;box-shadow:0 4px 10px #6555d71a}.primary:hover{background:#5747c6}.intro{margin:38px 0 28px}.intro h1{font-size:28px;letter-spacing:-.8px;margin:0 0 5px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:24px;transition:box-shadow .15s}.card:hover{box-shadow:0 6px 24px #32354b09}.cardtop{display:flex;align-items:center;justify-content:space-between}.system-icon{width:48px;height:48px;display:grid;place-items:center;background:#f0edff;color:var(--accent);border-radius:13px;font-size:24px}.status{font-size:10px;color:#7e879b;background:#f6f7fa;border-radius:20px;padding:4px 9px}.status.ready{color:#268472;background:#edf9f5}.card h2{font-size:17px;margin:21px 0 3px;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted)}.actions{display:flex;gap:7px;margin-top:25px}.actions button{flex:1;border:1px solid #e6e7f0;background:white;color:#60677d;border-radius:7px;padding:8px 2px;font-size:11px}.actions button:hover{background:#f5f3ff;color:var(--accent)}.export{background:none;border:0;padding:14px 0 0;color:#9296a4;font-size:11px}.hint{font-size:11px;color:#9a9fb0;margin-top:30px}dialog{border:1px solid var(--line);border-radius:16px;width:min(1200px,94vw);max-height:90vh;padding:0;color:var(--ink);box-shadow:0 24px 100px #18213730}dialog::backdrop{background:#1a203b65;backdrop-filter:blur(3px)}.modalhead{padding:24px 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.modalhead h2{font-size:22px;margin:0}.close{border:0;background:#f5f6fa;border-radius:8px;font-size:22px;color:#7e8594;padding:0 10px}.modalbody{padding:26px 30px;background:#fafbfe}.modalfoot{padding:18px 30px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line)}.label{display:block;font-size:12px;font-weight:600;color:#646c82;margin:12px 0 6px}.control{width:100%;border:1px solid #dfe2eb;border-radius:8px;padding:10px 12px;background:white;color:var(--ink)}.control:focus{outline:2px solid #d5ceff}.builder{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:20px;margin-top:22px}.panel{background:white;border:1px solid var(--line);border-radius:11px;padding:20px}.panel h3{font-size:14px;margin:0 0 15px}.module-line{display:flex;flex-wrap:wrap;gap:8px}.module{border:1px solid #e1e4ed;background:white;border-radius:8px;padding:14px 12px;text-align:left;flex:1;min-width:110px;color:#4d566d}.module strong{font-size:12px;display:block}.module small{display:block;font-size:10px;margin-top:8px;color:#8790a3}.module.selected{border-color:var(--accent);background:#f6f3ff;color:var(--accent)}.pipeline+.pipeline{margin-top:18px}.notice{font-size:12px;padding:12px;border-radius:8px;background:#f2f0ff;color:#64588d;white-space:pre-line;margin-top:18px}.notice.error{background:#fff1ef;color:#af4a3b}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:22px}.upload{border:1px dashed #cfd0e2;background:#faf9ff;padding:28px 20px;border-radius:9px;margin:16px 0}.result{white-space:pre-wrap;background:white;border:1px solid var(--line);padding:20px;border-radius:9px;min-height:170px;font-size:13px}.toast{position:fixed;bottom:25px;right:28px;background:#30334b;color:white;padding:12px 20px;border-radius:10px;display:none;z-index:10}.empty{padding:50px;border:1px dashed #daddE8;border-radius:12px;color:var(--muted)}@media(max-width:1250px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:850px){.sidebar{width:185px;padding:26px 12px}main{margin-left:185px;padding:0 22px}.cards,.builder,.twocol{grid-template-columns:1fr}.modalhead,.modalbody,.modalfoot{padding:20px}.brand{font-size:16px}.side-note{left:20px}}@media(max-width:550px){.sidebar{position:static;width:100%;padding:14px}.brand{margin:0 0 12px}.caption,.side-note{display:none}#groups{display:flex;overflow:auto}.group{white-space:nowrap;margin:0;width:auto}.count{display:none}main{margin:0;padding:0 16px}header{height:85px}.crumb{display:none}.intro{margin-top:24px}.modalhead h2{font-size:18px}}
.control:disabled,.control[readonly]{background:#f0f1f6;color:#858a99;cursor:not-allowed}.control option:disabled{color:#9a9eac}.rule{font-size:11px;color:#817b98;margin:6px 0 10px}.demo-cases{margin-top:18px;font-size:12px;color:#7b8193}.demo-cases button{margin:8px 5px 0 0;border:1px solid #dddbea;background:white;border-radius:6px;padding:6px 10px;color:#64588d}.locked{margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
.builder{grid-template-columns:minmax(250px,1fr) minmax(380px,1.2fr);align-items:start}.module-line{gap:8px}.module{min-width:125px}.builder>.panel{min-width:0}.module small{overflow-wrap:anywhere}.cardlinks{display:flex;justify-content:space-between;gap:8px}.mapping{display:grid;grid-template-columns:minmax(0,1fr) 20px minmax(0,1fr) 38px;gap:6px;align-items:center;margin:10px 0}.mapping .btn{padding:8px}.check{display:flex;align-items:center;gap:8px;font-size:13px;margin:8px 0}.check input{accent-color:var(--accent)}.invalid{color:#ae473b}.preview{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 ui-monospace,"Noto Sans TC","Microsoft JhengHei",monospace;background:#f5f6fa;border:1px solid var(--line);padding:14px;border-radius:8px;max-height:400px;overflow:auto}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid #ded9f7;background:#f7f4ff;color:#6555a7;border-radius:5px;padding:4px 7px;font-size:11px}.simple{width:100%;border-collapse:collapse}.simple td,.simple th{border:1px solid var(--line);padding:10px;text-align:left}h4{margin:22px 0 10px}summary{cursor:pointer;color:#665890}fieldset{border:1px solid var(--line);border-radius:9px;margin:16px 0;padding:16px}legend{font-weight:600}#createDialog{width:min(1320px,96vw)}.modalhead,.modalfoot{background:white}.modalfoot{position:sticky;bottom:0;z-index:2}.toptools{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:16px 0}.assistant-panel{background:#f8f5ff;border:1px solid #ded6fb;border-radius:12px;padding:20px;margin-top:18px}.assistant-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.assistant-panel[hidden]{display:none}.modalbody{min-width:0}.rule{line-height:1.7}input[type=file]{max-width:100%}#changeImpact{white-space:pre-line;margin-top:16px}.control{min-width:0}#helpDialog,#exportDialog{width:min(800px,94vw)}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.contract{margin-top:18px}.module.selected{box-shadow:inset 3px 0 var(--accent)}@media(max-width:850px){.builder,.assistant-layout{grid-template-columns:1fr}.toptools{align-items:flex-start;flex-direction:column}}
</style></head><body>
<aside class="sidebar"><div class="brand"><span class="mark">r</span> RAG Workspace</div><div class="caption">WORKSPACES</div><nav id="groups" aria-label="Workspace groups"></nav><div class="side-note">UI Prototype · 示意資料<br>重新整理會重設所有操作</div></aside>
<main><header><div class="crumb">Workspaces / <span id="crumb"></span></div><button class="btn primary" onclick="openCreate()">＋ Create RAG System</button></header><div class="intro"><h1 id="groupTitle"></h1><div class="muted" id="groupDesc"></div></div><div class="cards" id="cards"></div><p class="hint">Build → Ingest → Inference → Evaluation → Export YAML；可隨時 Edit Config。</p></main>
<dialog id="createDialog" aria-labelledby="createTitle"><div class="modalhead"><div><h2 id="createTitle">Create RAG System</h2><div class="muted" id="createGroup"></div></div><button class="close" aria-label="關閉" onclick="$('createDialog').close()">×</button></div><div class="modalbody"><label class="label" for="systemName">RAG System 名稱</label><input class="control" id="systemName" placeholder="例如：Maintenance RAG" maxlength="80"><div class="toptools"><details class="demo-cases"><summary>套用設定示範（重設草稿，保留名稱）</summary><button onclick="demoCase(1)">缺少全文索引</button><button onclick="demoCase(2)">Prompt 模板</button><button onclick="demoCase(3)">Local / Memory</button><button onclick="demoCase(4)">Top-K 卡控</button></details><button class="btn" onclick="toggleHelper()">✦ AI 設定助手（模擬）</button></div>
<aside class="assistant-panel" id="helperPanel" hidden><h3>AI 設定助手 · 模擬版</h3><div class="assistant-layout"><div><p id="helperChat" class="rule" role="status"></p><label class="label" for="helperSample">資料樣本（JSON／CSV／TXT／MD，≤ 1 MB）</label><input type="file" id="helperSample" accept=".json,.csv,.txt,.md" onchange="readSample()"><label class="label" for="helperRequest">描述你想調整的設定</label><textarea class="control" id="helperRequest" rows="4" placeholder="這份資料的 content 是原文、abstract 是摘要；改用 Local Search"></textarea><button class="btn" style="margin-top:12px" onclick="propose()">產生建議（模擬）</button></div><div><h4>套用前確認變更</h4><pre class="preview" id="helperChanges"></pre><button class="btn primary" id="applySuggestion" disabled onclick="applySuggestion()">套用到草稿</button><p class="rule">本機規則示範，無 LLM 連線；樣本不會上傳或自動 Ingestion。</p></div></div></aside>
<div class="builder"><div><div class="panel pipeline"><h3>Ingestion</h3><div id="ingestnodes" class="module-line"></div></div><div class="panel pipeline"><h3>Inference</h3><div id="querynodes" class="module-line"></div></div><div class="notice" id="changeImpact"></div></div><div class="panel"><h3 id="modtitle"></h3><div class="muted" id="moddesc"></div><div id="dynamicfields"></div></div></div><details class="panel contract"><summary>資料契約預覽 · 示意內容</summary><pre class="preview" id="contractPreview"></pre></details><div class="notice" id="validation" role="status"></div></div><div class="modalfoot"><button class="btn" onclick="$('createDialog').close()">Cancel</button><button class="btn primary" id="createButton" onclick="createSystem()">Create RAG System</button></div></dialog>
<dialog id="operationDialog" aria-labelledby="operationTitle"><div class="modalhead"><div><h2 id="operationTitle"></h2><div class="muted" id="operationSystem"></div></div><button class="close" aria-label="關閉" onclick="$('operationDialog').close()">×</button></div><div class="modalbody" id="operationBody"></div></dialog>
<dialog id="helpDialog" aria-labelledby="helpTitle"><div class="modalhead"><h2 id="helpTitle"></h2><button class="close" aria-label="關閉說明" onclick="$('helpDialog').close()">×</button></div><div class="modalbody" id="helpBody"></div></dialog>
<dialog id="exportDialog" aria-labelledby="exportTitle"><div class="modalhead"><div><h2 id="exportTitle">Export YAML</h2><div class="muted" id="exportSystemName"></div></div><button class="close" aria-label="關閉匯出" onclick="$('exportDialog').close()">×</button></div><div class="modalbody" id="exportBody"></div><div class="modalfoot"><button class="btn" onclick="downloadExport(true)">下載待設定草稿</button><button class="btn primary" id="exportReady" onclick="downloadExport(false)">匯出已填妥設定</button></div></dialog>
<div id="toast" class="toast" role="status"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),clone=x=>structuredClone(x),esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const groups=['Customer Support','Engineering','Operations'];
const modules=[['import','Import','上傳與 API 共用入口'],['parsing','Parsing','格式路由與欄位映射'],['chunking','Chunking','Token 邊界與欄位繼承'],['embedding','Embedding','fields → vectors'],['indexing','Indexing','儲存與搜尋索引'],['transform','Query Transformation','產生檢索問題'],['retrieval','Retrieval','選擇搜尋欄位'],['rerank','Rerank','候選內容重新排序'],['generation','Generation','參考資料格式與回答 Prompt']];
const exampleChunk='[{{citation_id}}] {{fields.title}}\n{{fields.text}}';
const examplePrompt='請根據以下參考資料回答問題，並標示來源編號。若資料不足，請明確說明。\n\n參考資料：\n{{context}}\n\n問題：{{query}}';
const service=(model='')=>({mode:'DEV test use',url:'',auth:'None',secret_ref:'',header:'X-API-Key',model,timeout:30});
function defaults(){return {import:{entries:['upload','api']},parsing:{routes:{pdf:'文字擷取',pptx:'文字擷取',image:'OCR',text:'Native text',records:'Row / JSON mapping'},headings:true,schema:[{source:'body',name:'text'},{source:'summary',name:'summary'},{source:'title',name:'title'}],metadata:['source_uri','department']},chunking:{method:'Recursive',unit:'tokens',size:512,overlap:64,tokenizer_mode:'沿用 Embedding',tokenizer:'BAAI/bge-m3',tokenizer_revision:'main',separators:['\n\n','\n','。','！','？','；',' ',''],keep_separator:true,levels:[1,2,3],split:'text',copy:['summary','title'],metadata:['source_uri','department']},embedding:{...service('bge-m3'),dimension:1024,tokenizer:'BAAI/bge-m3',tokenizer_revision:'main',max_tokens:8192,batch_size:16,mappings:[{source:'text',output:'text_vector'},{source:'summary',output:'summary_vector'}]},indexing:{backend:'Elasticsearch',es:service(),persistence:'Memory',mongo:{...service(),database:'rag',collection:'chunks'},metric:'cosine',stored:['text','summary','title'],vectors:['text_vector','summary_vector'],fulltext:['text'],filters:['department']},transform:{method:'None',include_original:true,count:3,service:service('demo-chat')},retrieval:{vectors:['text_vector','summary_vector'],fulltext:['text'],per_route_k:10,top_k:5,fusion:'RRF',rrf_k:60},rerank:{...service('demo-reranker'),top_n:3,content:['text']},generation:{...service('demo-chat'),temperature:0.2,max_output_tokens:1024,context_budget:4000,chunk_template:exampleChunk,prompt:examplePrompt}};}
let group=0,config=defaults(),selected='chunking',editId=null,draftId='',active=null,helperProposal=null,sample=null,exportDraft=null;
const systems=[{id:'a1b2c3',group:0,name:'Customer Support RAG',docs:12},{id:'d4e5f6',group:0,name:'Product FAQ',docs:8},{id:'h7j8k9',group:0,name:'Service Handbook',docs:0},{id:'m1n2p3',group:1,name:'Engineering Knowledge',docs:0}].map(s=>({...s,config:defaults(),collection:collectionName(s.group,s.name,s.id),needsIngest:!s.docs,revision:1,files:[],result:'',answer:'',qa:''}));
function collectionName(g,name,id){const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,45)||'system';return `${slug(groups[g])}-${slug(name)}-${id}`;}
function collection(){return editId?systems.find(s=>s.id===editId).collection:collectionName(group,$('systemName').value.trim()||'new-system',draftId);}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').style.display='none',3500);}
function render(){$('groups').innerHTML=groups.map((g,i)=>`<button class="group ${i===group?'active':''}" onclick="switchGroup(${i})" aria-pressed="${i===group}">▦ ${esc(g)}<span class="count">${systems.filter(s=>s.group===i).length}</span></button>`).join('');$('crumb').textContent=groups[group];$('groupTitle').textContent=groups[group];const list=systems.filter(s=>s.group===group);$('groupDesc').textContent=`${list.length} RAG systems`; $('cards').innerHTML=list.length?list.map(s=>`<article class="card"><div class="cardtop"><span class="system-icon">▧</span><span class="status ${!s.needsIngest?'ready':''}">${s.needsIngest?'需 Ingestion':'可測試 · Demo'}</span></div><h2>${esc(s.name)}</h2><div class="meta">${s.docs} documents · ${esc(mode(s.config))} · v${s.revision}</div><div class="actions"><button onclick="openOperation('${s.id}','ingest')">↑ Ingest</button><button onclick="openOperation('${s.id}','inference')">◇ Inference</button><button onclick="openOperation('${s.id}','evaluation')">◎ Evaluation</button></div><div class="cardlinks"><button class="export" onclick="openEdit('${s.id}')">⚙ Edit Config</button><button class="export" onclick="exportSystem('${s.id}')">↗ Export YAML</button></div></article>`).join(''):'<div class="empty">此 Group 尚無 RAG System。點選 Create RAG System 開始建立。</div>';}
function switchGroup(i){group=i;render();}
function resetHelper(){separatorsError='';helperProposal=null;sample=null;$('helperChat').textContent='模擬助手：可輸入「摘要不要切分」「改用 Local Search」「只用原文搜尋」，或上傳 JSON／CSV 樣本。此版使用本機規則示範，不呼叫 AI。';$('helperChanges').textContent='尚未產生建議。';$('applySuggestion').disabled=true;$('helperRequest').value='';$('helperSample').value='';$('helperPanel').hidden=true;}
function openCreate(){editId=null;draftId=crypto.randomUUID().slice(0,8);config=defaults();$('systemName').value='';$('createTitle').textContent='Create RAG System';$('createButton').textContent='Create RAG System';$('createGroup').textContent=groups[group];resetHelper();selectMod('chunking');$('createDialog').showModal();}
function openEdit(id){const s=systems.find(x=>x.id===id);editId=id;draftId=id;config=clone(s.config);$('systemName').value=s.name;$('createTitle').textContent='Edit Config';$('createButton').textContent='Save Changes';$('createGroup').textContent=groups[s.group]+' / v'+s.revision;resetHelper();selectMod('chunking');$('createDialog').showModal();}
function nodes(){for(const [id,items] of [['ingestnodes',modules.slice(0,5)],['querynodes',modules.slice(5)]])$(id).innerHTML=items.map(m=>`<button class="module ${selected===m[0]?'selected':''}" onclick="selectMod('${m[0]}')"><strong>${m[1]}</strong><small>${esc(summary(m[0]))}</small></button>`).join('');}
function summary(id){return ({import:'Upload + API',parsing:'Format routing',chunking:config.chunking.method,embedding:config.embedding.mode,indexing:config.indexing.backend,transform:config.transform.method,retrieval:mode(config),rerank:config.rerank.mode,generation:config.generation.mode})[id];}
function mode(c){return c.retrieval.vectors.length&&c.retrieval.fulltext.length?'Hybrid':c.retrieval.vectors.length?'Vector':c.retrieval.fulltext.length?'Full-text':'未選搜尋欄位';}
function get(path,c=config){return path.split('.').reduce((v,k)=>v[k],c);}
function put(path,v,c=config){const a=path.split('.'),k=a.pop();a.reduce((v,k)=>v[k],c)[k]=v;}
const label=(t,html,hint='')=>`<label class="label">${t}</label>${html}${hint?`<p class="rule">${hint}</p>`:''}`;
function input(path,title,type='text',hint='',readonly=false){return label(title,`<input class="control" aria-label="${esc(title)}" data-path="${path}" type="${type}" ${type==='number'?'step="any"':''} value="${esc(get(path))}" ${readonly?'readonly':''}>`,hint);}
function select(path,title,options,hint=''){const v=get(path);return label(title,`<select class="control" aria-label="${esc(title)}" data-path="${path}">${[...new Set([...options,v])].map(o=>`<option value="${esc(o)}" ${o===v?'selected':''}>${esc(o)}${options.includes(o)?'':'（已失效）'}</option>`).join('')}</select>`,hint);}
function textarea(path,title,hint=''){return label(title,`<textarea class="control" rows="5" aria-label="${esc(title)}" data-path="${path}">${esc(get(path))}</textarea>`,hint);}
function flag(path,title){return `<label class="check"><input type="checkbox" data-path="${path}" ${get(path)?'checked':''}>${title}</label>`;}
function pick(path,title,options,prefix=''){const vals=get(path);return `<div class="label">${title}</div>`+[...new Set([...options,...vals])].map(v=>`<label class="check"><input type="checkbox" data-pick="${path}" value="${esc(v)}" ${vals.includes(v)?'checked':''}>${esc(prefix+v)}${options.includes(v)?'':' <span class="invalid">上游已移除，請取消</span>'}</label>`).join('');}
function serviceForm(path,kind,{mode=true,model=true,choices=null}={}){let c=get(path),opts=choices||['DEV test use',kind];let html=mode?select(path+'.mode','服務來源',opts):'';if(c.mode==='None')return html;if(c.mode==='DEV test use')return html+`<div class="notice">平台測試資源（示意）${model?'<br>Model：'+esc(c.model):''}<br>匯出正式部署前需提供自己的服務。</div>`;
html+=input(path+'.url',kind.includes('Mongo')?'MongoDB URI（不含帳密）':kind==='Elasticsearch'?'Elasticsearch URL':'API Base URL','text',kind==='Rerank API'?'固定 POST /rerank；下方可查看本平台契約。':kind==='Embedding API'?'OpenAI-compatible embeddings：POST /embeddings。':kind==='OpenAI-compatible API'?'Chat Completions：POST /chat/completions。':'');

function effectiveConfig(raw){const c=clone(raw);c.chunking.resolved_tokenizer=tokenizer(c);if(c.chunking.method!=='Header-aware')delete c.chunking.levels;if(c.chunking.tokenizer_mode==='沿用 Embedding'){delete c.chunking.tokenizer;delete c.chunking.tokenizer_revision;}if(c.indexing.backend==='Elasticsearch'){delete c.indexing.mongo;delete c.indexing.persistence;}else {delete c.indexing.es;if(c.indexing.persistence==='Memory')delete c.indexing.mongo;}if(c.transform.method==='None')c.transform={method:'None'};else if(c.transform.method==='Rewrite')delete c.transform.count;if(c.rerank.mode==='None')c.rerank={mode:'None'};if(routeCount(raw)<=1){delete c.retrieval.fusion;delete c.retrieval.rrf_k;}c.retrieval.mode=mode(raw);if(!c.embedding.mappings.length)c.embedding={mappings:[],skipped:true};function clean(o){if(!o||typeof o!=='object')return;if(o.mode==='DEV test use'){delete o.url;delete o.auth;delete o.secret_ref;delete o.header;delete o.timeout;}else if(o.auth==='None'){delete o.secret_ref;delete o.header;}else if(o.auth!=='API Key')delete o.header;for(const v of Object.values(o))clean(v);}clean(c);return c;}

function substitute(t,values){return t.replace(/{{\s*([^{}]+?)\s*}}/g,(_,k)=>Object.hasOwn(values,k)?String(values[k]):'[未定義：'+k+']');}

function csvRows(text){let rows=[],row=[],value='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){value+='"';i++;}else quoted=!quoted;}else if(!quoted&&(ch===','||ch==='\n')){row.push(value.replace(/\r$/,''));value='';if(ch==='\n'){rows.push(row);row=[];}}else value+=ch;}if(quoted)throw Error('CSV 引號未閉合');if(value||row.length){row.push(value.replace(/\r$/,''));rows.push(row);}return rows;}
async function readSample(){const f=$('helperSample').files[0];sample=null;helperProposal=null;$('applySuggestion').disabled=true;if(!f)return;try{if(f.size>1024*1024)throw Error('樣本上限 1 MB');const ext=f.name.split('.').at(-1).toLowerCase();if(!['json','csv','txt','md'].includes(ext))throw Error('模擬版僅讀取 JSON／CSV／TXT／MD；Excel／PDF／PPTX 尚未解析');const text=(await f.text()).replace(/^\uFEFF/,'');let keys=[];if(ext==='json'){const obj=JSON.parse(text),first=Array.isArray(obj)?obj[0]:Array.isArray(obj.records)?obj.records[0]:obj;if(!first||typeof first!=='object'||Array.isArray(first))throw Error('需 JSON 物件或物件陣列');keys=Object.keys(first).filter(k=>typeof first[k]==='string');}else if(ext==='csv'){const rows=csvRows(text);keys=(rows[0]||[]).map(x=>x.trim());if(new Set(keys).size!==keys.length||keys.some(k=>!k))throw Error('CSV 欄名需非空且唯一');}else keys=['body'];if(!keys.length)throw Error('沒有可用文字欄位');sample={name:f.name,keys};$('helperChat').textContent='已在瀏覽器讀取樣本欄位（未上傳）：'+keys.join(', ')+'。\n請描述需求，或直接產生建議。';}catch(e){$('helperChat').textContent='樣本未載入：'+e.message;}}
function diffs(a,b,path=''){const rows=[];for(const k of new Set([...Object.keys(a||{}),...Object.keys(b||{})])){const x=a?.[k],y=b?.[k],p=path?path+'.'+k:k;if(JSON.stringify(x)===JSON.stringify(y))continue;if(x&&y&&typeof x==='object'&&typeof y==='object'&&!Array.isArray(x)&&!Array.isArray(y))rows.push(...diffs(x,y,p));else rows.push({path:p,before:x,after:y});}return rows;}

function yaml(c,draft){const b=blueprint(c,draft),name='rag-'+active.id,local=c.indexing.backend==='Local Search';const refs=resources(c).map(r=>get(r.path,c)).filter(s=>s.mode!=='DEV test use'&&s.auth!=='None').map(s=>s.secret_ref.split('/')[0]);return `# PROTOTYPE ONLY: example engine image and API contract; not a working deployment.\n# ${draft?'DRAFT: unresolved DEV resources must be replaced.':'Settings validated syntactically; services and models have NOT been contacted.'}\n# ${local?'Local Search requires Ingestion and Inference in one process; replicas=1.':'Target ES data is not included. Prepare indexes or run Ingestion in the target environment.'}\n# Secret references are resolved by the planned engine from /etc/rag/secrets/<name>/<key>.\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: ${name}-config\ndata:\n  blueprint.json: |\n${JSON.stringify(b,null,2).split('\n').map(x=>'    '+x).join('\n')}\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: ${name}\nspec:\n  replicas: ${local?1:2}\n  selector:\n    matchLabels: {app: ${name}}\n  template:\n    metadata:\n      labels: {app: ${name}}\n    spec:\n      containers:\n        - name: rag-engine\n          image: registry.example.internal/rag-engine:prototype\n          env:\n            - {name: RAG_BLUEPRINT_PATH, value: /etc/rag/blueprint.json}\n            - {name: RAG_RUN_MODE, value: ${local?'combined':'api'}}\n          ports: [{containerPort: 8080}]\n          volumeMounts:\n            - {name: blueprint, mountPath: /etc/rag/blueprint.json, subPath: blueprint.json, readOnly: true}\n${[...new Set(refs)].map((n,i)=>`            - {name: credential-${i}, mountPath: /etc/rag/secrets/${n}, readOnly: true}\n`).join('')}      volumes:\n        - name: blueprint\n          configMap: {name: ${name}-config}\n${[...new Set(refs)].map((n,i)=>`        - name: credential-${i}\n          secret: {secretName: ${n}}\n`).join('')}---\napiVersion: v1\nkind: Service\nmetadata:\n  name: ${name}\nspec:\n  selector: {app: ${name}}\n  ports: [{port: 80, targetPort: 8080}]\n`;}
function downloadExport(draft){if(!draft&&exportErrors().length)return;const c=draft?active.config:deploymentConfig();const url=URL.createObjectURL(new Blob([yaml(c,draft)],{type:'application/yaml'})),a=document.createElement('a');a.href=url;a.download='rag-'+active.id+(draft?'-draft':'-configured')+'.yaml';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已下載示意 YAML；未部署服務。');}
render();

</script></body></html>
