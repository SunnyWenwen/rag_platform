      <div class="toolbar"><button class="btn small" ${enabled ? '' : 'disabled'}>查詢工作</button></div></form>
    <form id="document-lookup"><label class="field">文件 ID<input class="control code" name="document_id" required ${enabled ? '' : 'disabled'}></label>
      <div class="toolbar"><button class="btn small" ${enabled ? '' : 'disabled'}>查最近 Run</button></div></form>
    ${enabled && system.runs.length ? system.runs.map(item => `<div class="summary-row"><button class="quiet" data-action="run" data-value="${item.run_id}">${item.run_id}</button>${runBadge(item.status)}</div>`).join('') : '<p class="muted">無可查詢的匯入紀錄</p>'}</aside></div>`;
}

const apiRoot = system => '/internal/systems/' + escapeHTML(encodeURIComponent(system.id)) + '/v1';
const runBadge = value => badge(status[value], value === 'completed' ? 'good' : ['failed','unknown'].includes(value) ? 'bad' : 'warn');

function renderRun(run) {
  if (!run.documents) return `<section class="panel" aria-label="匯入結果"><div class="bar"><h2>工作結果</h2>${runBadge(run.status)}</div>
    <p class="muted">找不到工作 ${escapeHTML(run.run_id)}，或紀錄已到期。</p></section>`;
  const counts = Object.fromEntries(Object.keys(status).map(state => [state,run.documents.filter(item => item.status === state).length]));
  return `<section class="panel" aria-label="匯入結果"><div class="bar"><h2>工作結果</h2>${runBadge(run.status)}</div>
    <p class="muted">${run.run_id} · ${run.config_revision} · ${run.documents.length} 份文件</p>
    <p class="muted">成功 ${counts.completed} · 取消 ${counts.cancelled} · 失敗 ${counts.failed}</p>
    <div class="table-wrap"><table><thead><tr><th>選取</th><th>文件 ID</th><th>狀態</th><th>詳細</th></tr></thead><tbody>${run.documents.map(item => `<tr><td><input class="check" type="checkbox" data-run-document="${escapeHTML(item.document_id)}" aria-label="選取 ${escapeHTML(item.document_id)}"
    ${selectedDocuments.has(item.document_id) ? 'checked' : ''} ${['queued','running'].includes(item.status) ? '' : 'disabled'}></td><td>${escapeHTML(item.document_id)}</td>
    <td>${runBadge(item.status)}</td><td>${escapeHTML(item.error ? item.error.code + ' · ' + item.error.message : item.module ?? '—')}</td></tr>`).join('')}</tbody></table></div>
    <div class="run-selection"><button class="btn small" data-action="cancel-run-documents" data-value="${run.run_id}" ${run.documents.some(item => selectedDocuments.has(item.document_id) && ['queued','running'].includes(item.status)) ? '' : 'disabled'}>取消選取文件</button></div></section>`;
}

function parseCSV(text) {
  const rows = [];
  let row = [], value = '', state = 'start';
  const pushCell = () => { row.push(value); value = ''; state = 'start'; };
  const pushRow = () => { pushCell(); rows.push(row); row = []; };
  text = text.replace(/^\uFEFF/, '');
  for (let index=0; index<text.length; index++) {
    const char = text[index];
    if (state === 'quoted') {
      if (char === '"' && text[index+1] === '"') { value += '"'; index++; }
      else if (char === '"') state = 'closed';
      else value += char;
    } else if (char === ',') pushCell();
    else if (char === '\n' || char === '\r') {
      if (char === '\r' && text[index+1] === '\n') index++;
      pushRow();
    } else if (char === '"' && state === 'start') state = 'quoted';
    else if (char === '"' || state === 'closed') throw Error('CSV 引號格式錯誤。');
    else { value += char; state = 'unquoted'; }
  }
  if (state === 'quoted') throw Error('CSV 含未結束的引號。');
  if (state !== 'start' || row.length) pushRow();
  const headers = (rows.shift() ?? []).map(value => value.trim());
  if (!headers.length || headers.some(value => !value) || new Set(headers).size !== headers.length) throw Error('CSV 欄名須為非空且不得重複。');
  if (!rows.length) throw Error('CSV 沒有資料列。');
  for (const [index,values] of rows.entries()) if (values.length !== headers.length) throw Error('CSV 第 ' + (index+2) + ' 列的欄位數不符。');
  return {headers,rows};
}

function mapTargets(config) {
  return [['document_id',{type:'string',required:true}],['source_revision',{type:'string',required:false}],['metadata',{type:'object',required:false}],
    ...Object.entries(params(config,'import').structdata).map(([key,field]) => ['structdata.' + key,field])];
}

function mapForm(system) {
  if (!system.active) return '<p class="info warn">發布設定後即可映射 CSV。</p>';
  return `<div class="field"><strong>CSV 欄位映射 · ${csv.rows.length} 列</strong><div class="table-wrap"><table><thead><tr><th>Document 欄位</th><th>CSV 欄位</th></tr></thead><tbody>
    ${mapTargets(system.active).map(([target,spec]) => `<tr><td>${escapeHTML(target)}${spec.required ? ' *' : ''}</td><td><select class="control" data-mapping="${escapeHTML(target)}" aria-label="${escapeHTML(target)} CSV 欄位">
    ${option('', target === 'document_id' ? '請選主鍵欄位' : '未映射', !mapping[target])}${csv.headers.map(header => option(header,header,mapping[target] === header)).join('')}</select></td></tr>`).join('')}
    </tbody></table></div>
    <label class="field">組合主鍵（選至少兩欄）
      <select class="control" id="csv-document-key" multiple>
        ${csv.headers.map(header => option(header,header,mapping.document_id_columns?.includes(header))).join('')}
      </select></label>
    ${makeButton('改用 JSON 輸入','use-json','small')}</div>`;
}

async function mapCSV(config, source, columnMapping) {
  const targets = mapTargets(config);
  const composite = [...(columnMapping.document_id_columns ?? [])].sort();
  if (composite.length === 1) throw Error('組合主鍵至少需要兩個欄位。');
  for (const [target,spec] of targets) {
    if (target === 'document_id' && composite.length) continue;
    if (spec.required && !columnMapping[target]) throw Error('請映射必填欄位 ' + target + '。');
  }
  const documents = await Promise.all(source.rows.map(async (row,index) => {
    const entries = [];
    const fields = [];
    for (const [target,spec] of targets) {
      const column = columnMapping[target];
      if (!column || target === 'document_id' && composite.length) continue;
      const text = row[source.headers.indexOf(column)];
      if (target === 'document_id' && !text.trim()) throw Error('CSV 第 ' + (index+2) + ' 列的主鍵欄位為空。');
      if (!text.trim() && !spec.required && target !== 'source_revision') continue;
      let value = text;
      if (['number','integer','boolean','string_array','object'].includes(spec.type)) {
        try { value = JSON.parse(text); }
        catch { throw Error('CSV 第 ' + (index+2) + ' 列的 ' + target + ' 需符合 ' + spec.type + '。'); }
      }
      if (!(spec.type === 'object' ? object(value) : fitsType(value,spec.type))) throw Error('CSV 第 ' + (index+2) + ' 列的 ' + target + ' 需符合 ' + spec.type + '。');
      if (target.startsWith('structdata.')) fields.push([target.slice(11),value]);
      else entries.push([target,value]);
    }
    if (composite.length) {
      const key = composite.map(column => [column,row[source.headers.indexOf(column)]]);
      if (key.some(([,value]) => !value.trim())) throw Error('CSV 第 ' + (index+2) + ' 列的組合主鍵有空值。');
      const bytes = new TextEncoder().encode(JSON.stringify(key));
      const digest = new Uint8Array(await crypto.subtle.digest('SHA-256',bytes));
      entries.push(['document_id','csv:' + Array.from(digest,value => value.toString(16).padStart(2,'0')).join('')]);
    }
    return {...Object.fromEntries(entries),structdata:Object.fromEntries(fields)};
  }));
  return {documents};
}

function checkBatch(batch, config) {
  record(batch,'Ingestion Request');
  if (Object.keys(batch).some(key => !['documents','parameters'].includes(key))) throw Error('Ingestion Request 僅接受 documents 和 parameters。');
  if (!Array.isArray(batch.documents) || !batch.documents.length) throw Error('documents 須包含至少一份文件。');
  if (Object.hasOwn(batch,'parameters')) record(batch.parameters,'parameters');
  const specs = params(config,'import').structdata;
  const seen = new Set();
  for (const [index,doc] of batch.documents.entries()) {
    const name = '第 ' + (index+1) + ' 份文件';
    record(doc,name);
    if (typeof doc.document_id !== 'string' || !doc.document_id) throw Error(name + '缺少 document_id。');
    const definition = fixture.schemas.document.$defs.document_id;
    if (!new RegExp(definition.pattern,'u').test(doc.document_id)
      || /[\uD800-\uDFFF]/u.test(doc.document_id)
      || new TextEncoder().encode(doc.document_id).length > definition.maxLength) {
      throw Error(name + '的 document_id 須為有效 UTF-8、最多 ' + definition.maxLength + ' bytes，且不得含控制字元。');
    }
    const display = '文件 ' + doc.document_id;
    if (seen.has(doc.document_id)) throw Error(display + '重複。');
    seen.add(doc.document_id);
    if (Object.keys(doc).some(key => !['document_id','source_revision','structdata','metadata'].includes(key))) throw Error(display + '含此 JSON 入口未支援的欄位。');
    if (Object.hasOwn(doc,'source_revision') && doc.source_revision !== null && typeof doc.source_revision !== 'string') throw Error(display + '的 source_revision 須為字串或 null。');
    if (Object.hasOwn(doc,'metadata')) record(doc.metadata,'metadata');
    const fields = record(doc.structdata,display + '的 structdata');
    for (const key of Object.keys(fields)) if (!Object.hasOwn(specs,key)) throw Error(display + '的 ' + key + ' 未在 Import 宣告。');
    for (const [key,spec] of Object.entries(specs)) {
      if (!Object.hasOwn(fields,key) && spec.required) throw Error(display + '缺少必填欄位 ' + key + '。');
      if (Object.hasOwn(fields,key) && !fitsType(fields[key],spec.type)) throw Error(display + '的 ' + key + ' 須符合 ' + spec.type + '。');
    }
  }
}

async function previewBatch(system) {
  const source = csv;
  const active = system.active;
  const selectedMapping = json(mapping);
  const stillCurrent = () => screen === 'ingest' && current() === system && system.active === active
    && csv === source && json(mapping) === selectedMapping;
  try {
    const batch = source ? await mapCSV(active,source,JSON.parse(selectedMapping)) : JSON.parse(ingestText);
    if (source && !stillCurrent()) return;
    checkBatch(batch,system.active);
    batchPreview = batch;
    ingestError = '';
  } catch (error) {
    if (source && !stillCurrent()) return;
    batchPreview = null;
    ingestError = error instanceof SyntaxError ? '請輸入有效的 JSON。' : error.message;
  }
  render();
}

function startRun(system) {
  if (!batchPreview || !pipelineReady(system,'ingestion')) return;
  const occupied = new Set(system.runs.flatMap(run => run.documents.filter(documentOccupied).map(item => item.document_id)));
  const conflicts = batchPreview.documents.map(doc => doc.document_id).filter(id => occupied.has(id));
  if (conflicts.length || csv && occupied.size) {
    ingestError = conflicts.length ? '409 DOCUMENT_BUSY · ' + conflicts.join('、') : '409 SYSTEM_BUSY · CSV 整批替換須等現有工作結案。';
    render();
    return;
  }
  if (csv && system.documents.length && !confirm('這次 CSV 匯入會替換目前索引中的所有文件。繼續？')) return;
  if (csv) { system.documents = []; system.initialized = false; delete system.initialDocuments; }
  if (!system.initialized) {
    system.initialDocuments = [...new Set([...(system.initialDocuments ?? []),...batchPreview.documents.map(doc => doc.document_id)])];
  }
  system.runSequence ??= Math.max(0,...system.runs.map(run => Number(run.run_id.replace(/^ing-/,'')) || 0));
  system.runSequence++;
  const run = {
    run_id:'ing-' + system.runSequence.toString().padStart(3,'0'), status:'queued',
    config_revision:activeRevision(system), started:Date.now(), payload:clone(batchPreview.documents),
    timeoutDocument:bulkTimeout ? batchPreview.documents[0].document_id : null,
    documents:batchPreview.documents.map(doc => ({document_id:doc.document_id,status:'queued',module:null,error:null}))
  };
  system.runs.unshift(run);
  if (csv) system.mapping = clone(mapping);
  viewRun = run.run_id;
  selectedDocuments.clear(); bulkTimeout = false; ingestError = '';
  batchPreview = null;
  if(!system.initialized) queryResult = null;
  persist();
  render();
  notify('已接受匯入工作 ' + run.run_id);
  pollRuns();
}

const documentOccupied = item => ['queued','running'].includes(item.status) || item.status === 'cancelled' && item.startedAt != null;
const hasActiveWork = system => system.runs.some(run => run.documents.some(documentOccupied));
const indexingDelay = 1000;
const jobDuration = 2800;

function rollupRun(run,now) {
  const states = run.documents.map(item => item.status);
  if (states.every(state => state === 'queued')) run.status = 'queued';
  else if (states.some(state => state === 'queued' || state === 'running')) run.status = 'running';
  else if (states.includes('unknown')) run.status = 'unknown';
  else if (states.every(state => state === 'completed')) run.status = 'completed';
  else if (states.every(state => state === 'cancelled')) run.status = 'cancelled';
  else run.status = states.includes('completed') ? 'partial' : 'failed';
  if (!run.documents.some(documentOccupied)) {
    run.finishedAt ??= now;
    delete run.payload;
  }
}

function updateInitialReadiness(system,run) {
  if (system.initialized || !run.finishedAt) return;
  const expected = system.initialDocuments ?? run.documents.map(item => item.document_id);
  const indexed = new Set(system.documents.map(doc => doc.document_id));
  if (expected.every(documentId => indexed.has(documentId))) {
    system.initialized = true;
    delete system.initialDocuments;
  }
}

function cancelDocuments(system,runId) {
  if (!pipelineReady(system,'ingestion')) return;
  const run = system.runs.find(item => item.run_id === runId);
  if (!run) return;
  const now = Date.now();
  for (const item of run.documents) {
    if (!selectedDocuments.has(item.document_id) || !['queued','running'].includes(item.status)) continue;
    if (item.status === 'running' && now - (item.startedAt ?? run.started) >= indexingDelay) {
      item.startedAt ??= run.started;
      item.module = 'indexing';
    } else delete item.startedAt;
    item.status = 'cancelled';
  }
  rollupRun(run,now);
  updateInitialReadiness(system,run);
  selectedDocuments.clear(); persist(); render(); pollRuns();
}

function advanceRuns(system,now) {
  const pending = system.runs.slice().reverse();
  const workerRun = pending.find(run => run.documents.some(item => item.status !== 'queued' && documentOccupied(item)));
  const item = workerRun?.documents.find(item => item.status !== 'queued' && documentOccupied(item));
  if (item) {
    const elapsed = now - (item.startedAt ?? workerRun.started);
    if (elapsed < indexingDelay) return false;
    if (elapsed < jobDuration) {
      if (item.module === 'indexing') return false;
      item.module = 'indexing';
      return true;
    }
    if (workerRun.timeoutDocument === item.document_id) {
      if (item.status !== 'cancelled') {
        item.status = 'failed';
        item.module = 'indexing';
        item.error = {code:'ES_BULK_TIMEOUT',module:'indexing',message:'等待 Elasticsearch Bulk 回應逾時，可重新匯入。'};
      }
    } else {
      const document = workerRun.payload.find(doc => doc.document_id === item.document_id);
      system.documents = [...system.documents.filter(doc => doc.document_id !== document.document_id),document];
      item.status = 'completed';
      item.module = null;
    }
    delete item.startedAt;
    rollupRun(workerRun,now);
    updateInitialReadiness(system,workerRun);
    return true;
  }
  const run = pending.find(item => now - item.started >= 400 && item.documents.some(doc => doc.status === 'queued'));
  if (!run) return false;
  const queued = run.documents.find(item => item.status === 'queued');
  Object.assign(queued,{status:'running',module:'embedding',startedAt:now});
  rollupRun(run,now);
  return true;
}

function pruneRuns(system,now) {
  let completedDocuments = 0;
  const remaining = system.runs.filter(run => {
    if (run.documents.some(documentOccupied)) return true;
    if (now - (run.finishedAt ?? run.started) >= 259200000) return false;
    completedDocuments += run.documents.length;
    return completedDocuments <= 10000;
  });
  if (remaining.length === system.runs.length) return false;
  system.runs = remaining;
  return true;
}

function pollRuns() {
  if (polling) return;
  polling = true;
  const tick = () => {
    let changed = false, pending = false;
    const now = Date.now();
    for (const system of model.systems) {
      if (advanceRuns(system,now)) changed = true;
      if (pruneRuns(system,now)) changed = true;
      if (hasActiveWork(system)) pending = true;
    }
    if (changed) {
      persist();
      if (!current() || screen === 'ingest') {
        const focus = document.activeElement;
        if (!focus || !focus.matches('input,textarea,select')) render();
        else if (viewRun) {
          const run = current()?.runs.find(item => item.run_id === viewRun);
          const panel = $('page').querySelector('[aria-label="匯入結果"]');
          if (panel && run) panel.outerHTML = renderRun(run);
        }
      }
    }
    if (pending) setTimeout(tick,250);
    else polling = false;
  };
  tick();
}

function inference(system) {
  const message = pipelineMessage(system,'inference') || (system.initialized ? '' : '完成初次匯入後即可查詢。');
  const available = !message;
  const fixed = system.active?.pipelines.inference.fixed_filters ?? [];
  const fields = system.active ? Object.entries(derive(system.active).indexed).filter(([,spec]) => spec.filterable) : [];
  const items = queryResult?.contexts.flatMap(context => context.result_sets.flatMap(set => set.items)) ?? [];
  return `<div class="operation"><div class="stack"><section class="panel">
    <div class="bar"><h2>查詢測試</h2>${makeButton('載入範例','query-sample','small')}</div>
    ${message ? `<div class="info warn">${escapeHTML(message)}</div>` : ''}
    <label class="field">問題<textarea class="control" id="query-text" rows="3" placeholder="輸入要搜尋的問題">${escapeHTML(queryText)}</textarea></label>
    ${filterEditor('query',system.active)}
    ${queryError ? `<div class="info bad" role="alert">${escapeHTML(queryError)}</div>` : ''}
    <div class="toolbar"><button class="btn primary" data-action="query" ${available ? '' : 'disabled'}>執行查詢</button></div>
    <details><summary>API 端點</summary><pre>POST ${apiRoot(system)}/queries</pre></details></section>
    ${queryResult ? `<section class="panel" aria-label="查詢結果"><div class="bar"><h2>檢索結果</h2><small>${queryResult.config_revision} · ${queryResult.index_generation ?? '無平台索引'} · ${items.length} 筆結果</small></div>
      ${items.length ? items.map(({data,score},index) => `<article class="result"><div class="bar"><h3>${index+1}. ${escapeHTML(data.structdata.title ?? data.document_id)}</h3>
        ${score === undefined ? '' : badge(score.toFixed(3))}</div><p>${escapeHTML(data.structdata[params(system.active,'embedding').source_field])}</p>
        <small>來源 ${escapeHTML(data.document_id)}${data.source_revision ? ' · ' + escapeHTML(data.source_revision) : ''}</small></article>`).join('') : '<p class="empty">沒有符合條件的結果。</p>'}
      ${analysisPanel('查看回應 JSON',queryResult)}</section>` : ''}</div>
    <aside class="panel"><h2>篩選設定</h2>
      ${fixed.length ? analysisPanel('固定 Filter · ' + fixed.length + ' 組',fixed) : '<p class="empty">尚無固定 Filter</p>'}
      ${fields.length ? `<hr><h3>可篩選欄位</h3>${fields.map(([name,spec]) => `<div class="summary-row"><code>${escapeHTML(name)}</code><small>${spec.type}</small></div>`).join('')}` : ''}
    </aside></div>`;
}

function matchFilters(fields, filters, config) {
  const {indexed} = derive(config);
  const match = ({field,operator,value}) => {
    const key = field.slice(11);
    if (!Object.hasOwn(fields,key)) return false;
    const actual = fields[key];
    if (operator === 'eq' || operator === 'in') {
      const candidates = operator === 'eq' ? [value] : value;
      return (Array.isArray(actual) ? actual : [actual]).some(item => candidates.some(candidate => normalize(item) === normalize(candidate)));
    }
    const left = normalize(actual), right = normalize(value);
    return {lt:left < right,lte:left <= right,gt:left > right,gte:left >= right}[operator];

    function normalize(item) {
      return indexed[key].type === 'datetime' ? Date.parse(item) : item;
    }
  };
  return filters.every(clause => Object.hasOwn(clause,'any') ? clause.any.some(match) : match(clause));
}

function tokens(text) {
  const chunks = String(text ?? '').toLowerCase().match(/\p{Script=Han}+|[\p{L}\p{N}]+/gu) ?? [];
  return new Set(chunks.flatMap(chunk => {
    const characters = Array.from(chunk);
    return characters.length > 1 && /^\p{Script=Han}+$/u.test(chunk)
      ? characters.slice(1).map((char,index) => characters[index] + char)
      : [chunk];
  }));
}

function query(system) {
  try {
    const question = queryText.trim();
    if (!question) throw Error('請輸入查詢問題。');
    const dynamic = JSON.parse(filterText.trim() || '[]');
    validateFilters(dynamic,system.active);
    const filters = [...(system.active.pipelines.inference.fixed_filters ?? []),...dynamic];
    const chunk = params(system.active,'chunking');
    const retrieve = params(system.active,'retrieval');
    const vectorName = retrieve.vector_fields?.[0] ?? retrieve.vector_name;
    const binding = derive(system.active).vectorBindings[vectorName];
    if (!binding) throw Error('查詢向量欄位缺少索引綁定。');
    const terms = tokens(question);
    const candidates = system.documents.flatMap(doc => {
      const source = doc.structdata[chunk.split_field];
      const fields = Object.fromEntries([[chunk.output_field,source],...chunk.copy_fields.filter(row => Object.hasOwn(doc.structdata,row.source_field)).map(row => [row.output_field,doc.structdata[row.source_field]])]);
      if (!matchFilters(fields,filters,system.active)) return [];
      const words = tokens(fields[binding.source_field]);
      const hits = [...terms].filter(term => words.has(term)).length;
      if (!hits) return [];
      const data = {document_id:doc.document_id,data_id:doc.document_id + '-1',structdata:fields};
      if (Object.hasOwn(doc,'source_revision')) data.source_revision = doc.source_revision;
      if (doc.metadata) data.metadata = doc.metadata;
      return [{data,score:hits/terms.size}];
    }).sort((left,right) => right.score - left.score).slice(0,retrieve.per_route_k);
    const seen = new Set();
    const items = candidates.filter(({data}) => {
      if (!retrieve.group_by?.length) return true;
      const values = retrieve.group_by.map(field => field === 'document_id' ? data.document_id : data.structdata[field.slice(11)]);
      if (values.some(value => value == null)) return true;
      const key = json(values);
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    }).slice(0,retrieve.top_n);
    queryResult = {config_revision:activeRevision(system),index_generation:indexGeneration(system) ?? null,contexts:[{ori_query:question,query:question,filters,result_sets:[{key:'retrieval',items}],metadata:{}}]};
    queryError = '';
  } catch (error) {
    queryResult = null;
    queryError = error instanceof SyntaxError ? '本次 Filter 請輸入有效的 JSON。' : error.message;
  }
  render();
}

let uploadRevision = 0;

async function readUpload(file) {
  const readRevision = ++uploadRevision;
  const systemId = id;
  batchPreview = null; ingestError = '';
  try {
    if (file.size > 1024 * 1024) throw Error('檔案大小超過 1 MB。');
    const text = await file.text();
    if (readRevision !== uploadRevision || systemId !== id || screen !== 'ingest') return;
    if (/\.csv$/i.test(file.name)) {
      csv = parseCSV(text);
      mapping = Object.fromEntries(mapTargets(current().active ?? current().draft).flatMap(([target]) => {
        const previous = current().mapping?.[target];
        const best = [previous,target,target.replace(/^structdata\./,'')].find(value => csv.headers.includes(value));
        return best ? [[target,best]] : [];
      }));
      const composite = current().mapping?.document_id_columns ?? [];
      if (composite.length && composite.every(column => csv.headers.includes(column))) {
        mapping.document_id_columns = composite;
        delete mapping.document_id;
      }
    } else { ingestText = text.replace(/^\uFEFF/,''); csv = null; }
  } catch (error) {
    if (readRevision !== uploadRevision || systemId !== id || screen !== 'ingest') return;
    ingestError = error.message;
  }
  render();
}

function download(system) {
  const file = new Blob([json({system_id:system.id,config_revision:activeRevision(system),config:deploymentConfig(system.active)}) + '\n'],{type:'application/json'});
  const url = URL.createObjectURL(file);
  const link = document.createElement('a');
  link.href = url;
  link.download = system.id + '.json';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url),1000);
}

const systemDialog = $('system-dialog');

function canCloseSystem() {
  return !draftDirty || confirm('捨棄尚未保存的設定？');
}

systemDialog.addEventListener('cancel',event => {
  if (!canCloseSystem()) event.preventDefault();
});

systemDialog.addEventListener('close',() => {
  pendingSystem = null;
  draftDirty = false;
  id = null;
  uploadRevision++;
  renderWorkspace();
});

document.addEventListener('submit',event => {
  if (!['run-lookup','document-lookup'].includes(event.target.id)) return;
  event.preventDefault();
  const system = current();
  if (!pipelineReady(system,'ingestion')) return;
  if (event.target.id === 'run-lookup') viewRun = event.target.elements.run_id.value.trim() || null;
  else {
    const documentId = event.target.elements.document_id.value.trim();
    const recent = system.runs.find(run => run.documents.some(item => item.document_id === documentId));
    if (!recent) { notify('查無此文件的 Run 紀錄。'); return; }
    viewRun = recent.run_id;
  }
  selectedDocuments.clear();
  render();
});

document.addEventListener('click',event => {
  const button = event.target.closest('button[data-action]');
  if (!button || button.disabled) return;
  const {action,value,index} = button.dataset;
  const system = current();
  switch(action) {
    case 'workspace': workspace = Number(value); renderWorkspace(); return;
    case 'system': openSystem(value,button.dataset.view); return;
    case 'open-create':
      pendingSystem = makeSystem('',workspace);
      openSystem(pendingSystem.id);
      $('system-name').focus();
      return;
    case 'close-dialog': {
      const dialog = button.closest('dialog');
      if (dialog !== systemDialog || canCloseSystem()) dialog.close();
      return;
    }
    case 'module': selected = value; render(); return;
    case 'save':
      if (!hasDraftName()) return;
      saveDraft(system);
      render();
      notify('已保存草稿');
      return;
    case 'validate': checkPublish(system); return;
    case 'publish': applyPublish(system); return;
    case 'download': download(system); return;
    case 'load-module-template': loadModuleTemplate(selectedTemplate); return;
    case 'sync-runtime':
      reconcileRuntime(system); persist(); render(); return;
    case 'restart-runtime': {
      if (hasActiveWork(system)) return;
      const target = deployment(system);
      for (const pipeline of runtimePipelines) target.loaded[pipeline] = null;
      persist(); render(); scheduleRuntimeReconcile(system); return;
    }
    case 'detach-pipeline': {
      if (value === 'ingestion' && hasActiveWork(system)) return;
      const target = deployment(system);
      target.desired[value] = false;
      target.loaded[value] = null;
      persist(); render(); return;
    }
    case 'reload-pipeline': {
      if (!system.indexReady) return;
      deployment(system).desired[value] = true;
      reconcileRuntime(system); persist(); render(); return;
    }
    case 'lose-index':
      if (!system.indexReady || hasActiveWork(system)) return;
      system.indexReady = false; system.initialized = false; system.documents = [];
      delete system.initialDocuments;
      persist(); render(); return;
    case 'recover-index': {
      if (!system.active || system.indexReady || !confirm('以原 Config Revision 建立新的空索引。恢復後須重新匯入資料。繼續？')) return;
      system.indexGeneration = uuid();
      system.indexReady = true;
      const target = deployment(system);
      if (target.desired.ingestion) target.loaded.ingestion = snapshot(system);
      persist(); render(); scheduleRuntimeReconcile(system); return;
    }
    case 'add-system-setting': {
      const values = draft[value] ??= {};
      const prefix = value.toUpperCase() + '_';
      let number = 1;
      while (hasSystemSetting(draft,prefix + number)) number++;
      values[prefix + number] = null;
      break;
    }
    case 'remove-system-setting': delete draft[button.dataset.settingScope][value]; break;
    case 'add-field': {
      const fields = params(draft,selected)[button.dataset.editorParam] ??= {};
      let number = 1;
      while (Object.hasOwn(fields,'field_' + number)) number++;
      fields['field_' + number] = {type:'string',required:false};
      break;
    }
    case 'remove-field': delete params(draft,selected)[button.dataset.editorParam][value]; break;
    case 'add-filter': {
      const fields = filterFields(value === 'fixed' ? draft : system.active);
      const field = Object.keys(fields)[0];
      const filters = editableFilters(value);
      if (!field || !Array.isArray(filters)) { render(); return; }
      const today = new Date().toISOString().slice(0,10);
      const fallback = {integer:0,number:0,boolean:false,date:today,datetime:today + 'T00:00:00Z'};
      writeFilters(value,[...filters,{field,operator:'eq',value:fallback[fields[field].type] ?? ''}],true);
      return;
    }
    case 'remove-filter': {
      const filters = editableFilters(value);
      if (!Array.isArray(filters)) { render(); return; }
      filters.splice(Number(index),1);
      writeFilters(value,filters,true);
      return;
    }
    case 'add-item': {
      const parameters = params(draft,selected);
      const shape = descriptor(selected,draft).parameters_schema.properties[value].items;
      const initial = field => field.const ?? field.default ?? field.enum?.[0]
        ?? (field.type === 'boolean' ? false : field.minimum ?? '');
      (parameters[value] ??= []).push(shape.type === 'object'
        ? Object.fromEntries(Object.entries(shape.properties).map(([key,field]) => [key,initial(field)]))
        : initial(shape));
      break;
    }
    case 'remove-item': {
      const parameters = params(draft,selected);
      const schema = descriptor(selected,draft).parameters_schema;
      if (schema.required.includes(value) && parameters[value].length <= (schema.properties[value].minItems ?? 0)) return;
      parameters[value].splice(Number(index),1);
      if (!parameters[value].length && !schema.required.includes(value)) delete parameters[value];
      break;
    }
    case 'ingest-sample': uploadRevision++; csv = null; ingestText = json(fixture.ingestion); ingestError = ''; batchPreview = null; render(); return;
    case 'use-json': uploadRevision++; csv = null; batchPreview = null; ingestError = ''; render(); return;
    case 'preview-batch': previewBatch(system); return;
    case 'start-run': startRun(system); return;
    case 'run': viewRun = value; selectedDocuments.clear(); render(); return;
    case 'cancel-run-documents': cancelDocuments(system,value); return;
    case 'query-sample': queryText = fixture.query.query; filterText = json(fixture.query.filters ?? []); queryError = ''; queryResult = null; render(); return;
    case 'query': if (pipelineReady(system,'inference') && system.initialized) query(system); return;
    default: return;
  }
  markDirty();
  render();
});

function changeParameter(input) {
  if (input.readOnly) return;
  const {param,row,column} = input.dataset;
  const values = params(draft,selected);
  let value = input.value;
  if (input.hasAttribute('data-secret-password')) {
    let key = secretKeyFromReference(values[param]);
    if (!key && !value) return;
    if (!key) key = availableSystemSettingKey(draft,esConnection.properties.password['x-deployment-secret-key']);
    (draft.secret ??= {})[key] = value;
    value = '{{' + key + '}}';
  }
  if (input.type === 'checkbox') value = input.checked;
  if (input.type === 'number') value = Number.isFinite(input.valueAsNumber) ? input.valueAsNumber : null;
  if (input.hasAttribute('data-typed-option')) value = input.value === '' ? undefined : JSON.parse(input.value);
  if (selected === 'retrieval' && param === 'top_n' && value === null) delete values[param];
  else if (row === undefined) values[param] = value;
  else if (column) values[param][Number(row)][column] = value;
  else values[param][Number(row)] = value;
  if (param === 'compose_text' && value) {
    const properties = descriptor('embedding',draft).parameters_schema.properties;
    for (const name of ['composition_field','composition_template']) values[name] ??= properties[name].default;
  }
  markDirty();
}

function changeRemote(input) {
  const key = input.dataset.remote;
  const currentNode = node(draft,selected);
  if (key === 'service_ref' || key === 'through') currentNode[key] = input.value;
  else if (key === 'bearer_token') {
    if (input.value) currentNode.auth = {bearer_token:input.value};
    else delete currentNode.auth;
  } else if (key === 'parameters' || key === 'structdata' || key === 'vectors') {
    let value;
    try { value = JSON.parse(input.value); }
    catch { value = input.value; }
    if (key === 'parameters') currentNode.parameters = value;
    else currentNode.output[key] = value;
  } else currentNode.connection[key] = input.type === 'number' ? (input.value ? Number(input.value) : null) : input.value;
  markDirty();
}

document.addEventListener('input',event => {
  const input = event.target;
  if (input.id === 'system-name') {
    draftName = input.value;
    markDirty();
  }
  if (input.dataset.settingValue !== undefined) {
    draft[input.dataset.settingScope][input.dataset.settingValue] = input.value;
    markDirty();
  }
  if (input.dataset.param !== undefined) changeParameter(input);
  if (input.dataset.remote && input.dataset.remote !== 'through') changeRemote(input);
  if (input.id === 'fixed-filters') {
    try { draft.pipelines.inference.fixed_filters = JSON.parse(input.value); }
    catch { draft.pipelines.inference.fixed_filters = input.value; }
    markDirty();
  }
  if (input.id === 'ingest-json') {
    ingestText = input.value;
    batchPreview = null;
    $('batch-summary')?.remove();
    $('page').querySelector('[data-action="start-run"]').disabled = true;
  }
  if (input.id === 'query-text') queryText = input.value;
  if (input.id === 'filter-text') filterText = input.value;
});

document.addEventListener('change',event => {
  const input = event.target;
  if (input.id === 'module-template') {
    selectedTemplate = input.value;
    render();
    $('module-template')?.focus();
    $('module-template').focus();
    return;
  }
  if (input.id === 'runtime-layout') {
    deployment(current()).layout = input.value;
    persist(); render(); return;
  }
  if (input.id === 'bulk-timeout') bulkTimeout = input.checked;
  if (input.dataset.runDocument !== undefined) {
    if (input.checked) selectedDocuments.add(input.dataset.runDocument);
    else selectedDocuments.delete(input.dataset.runDocument);
    const button = $('page').querySelector('[data-action="cancel-run-documents"]');
    button.disabled = !$('page').querySelector('[data-run-document]:checked:not(:disabled)');
  }
  if (input.dataset.settingKey !== undefined) {
    const scope = input.dataset.settingScope;
    const previous = input.dataset.settingKey;
    const next = input.value.trim();
    if (previous === next) return;
    if (!systemSettingKey.test(next) || hasSystemSetting(draft,next)) {
      input.value = previous;
      notify('Key 格式不符，或已存在於 Secret／Variable。');
      return;
    }
    draft[scope] = Object.fromEntries(Object.entries(draft[scope]).map(([key,value]) => [key === previous ? next : key,value]));
    markDirty();
    render();
    return;
  }
  if (input.id === 'component-picker') {
    chooseComponent(input.value);
    return;
  }
  if (input.dataset.remote === 'through') {
    changeRemote(input);
    render();
    return;
  }
  if (input.dataset.param !== undefined) {
    const target = '/' + input.dataset.param;
    const rules = Object.values(descriptor(selected,draft).ui_hints?.visible_when ?? {});
    const affectsVisibility = rules.some(rule => (rule.all ?? rule.any ?? [])
      .some(condition => condition.path === target || condition.paths?.includes(target)));
    if (affectsVisibility || selected === 'import' && target === '/source') render();
  }
  if (input.dataset.filter) {
    const {filter,filterKey,index} = input.dataset;
    const filters = editableFilters(filter);
    const condition = Array.isArray(filters) ? filters[Number(index)] : null;
    if (!object(condition) || Object.hasOwn(condition,'any')) { render(); return; }
    if (filterKey === 'value') {
      const type = filterFields(filter === 'fixed' ? draft : current().active)[condition.field]?.type;
      if (condition.operator === 'in' || ['number','integer','boolean'].includes(type)) {
        try { condition.value = JSON.parse(input.value); }
        catch { condition.value = input.value; }
      } else condition.value = input.value;
    } else {
      condition[filterKey] = input.value;
      if (filterKey === 'field') condition.operator = 'eq';
      if (filterKey === 'operator' && input.value === 'in') condition.value = Array.isArray(condition.value) ? condition.value : [condition.value];
      else if (Array.isArray(condition.value)) condition.value = condition.value[0] ?? '';
    }
    writeFilters(filter,filters,filterKey !== 'value');
    return;
  }
  const {field,indexField,property,editorParam} = input.dataset;
  if (field !== undefined) {
    const fields = params(draft,selected)[editorParam];
    if (property === 'name') {
      const name = input.value.trim();
      if (name === field) return;
      if (!fieldName.test(name) || Object.hasOwn(fields,name)) {
        input.value = field;
        notify('欄位名稱須合法且不可重複。');
        return;
      }
      params(draft,selected)[editorParam] = Object.fromEntries(Object.entries(fields).map(([key,entry]) => [key === field ? name : key,entry]));
      input.dataset.field = name;
      const row = input.closest('tr');
      row.querySelectorAll('[data-field]').forEach(element => { element.dataset.field = name; });
      row.querySelector('[data-action="remove-field"]').dataset.value = name;
    } else fields[field][property] = input.type === 'checkbox' ? input.checked : input.value;
    markDirty();
  }
  if (indexField !== undefined) {
    const overrides = params(draft,selected)[editorParam] ??= {};
    const value = {...(Object.hasOwn(overrides,indexField) ? overrides[indexField] : {})};
    if (input.value === '') delete value[property];
    else value[property] = input.value === 'true';
    if (Object.keys(value).length) Object.defineProperty(overrides,indexField,{value,enumerable:true,writable:true,configurable:true});
    else delete overrides[indexField];
    markDirty();
  }
  if (input.id === 'upload' && input.files.length) readUpload(input.files[0]);
  if (input.dataset.indexVector !== undefined) {
    const name = input.dataset.indexVector;
    const values = indexVectorNames(draft).filter(value => value !== name);
    if (input.checked) values.push(name);
    const index = params(draft,'indexing');
    delete index.vector_name;
    index.vector_fields = values;
    markDirty();
    refreshContractPreviews();
  }
  if (input.id === 'csv-document-key' || input.dataset.mapping !== undefined) {
    if (input.id === 'csv-document-key') {
      mapping.document_id_columns = Array.from(input.selectedOptions,selectedOption => selectedOption.value);
      if (mapping.document_id_columns.length) delete mapping.document_id;
    } else {
      mapping[input.dataset.mapping] = input.value;
      if (input.dataset.mapping === 'document_id' && input.value) delete mapping.document_id_columns;
    }
    batchPreview = null;
    ingestError = '';
    render();
    if (input.id === 'csv-document-key') $('csv-document-key')?.focus();
  }
});

document.addEventListener('toggle',event => {
  if (event.target.id === 'advanced') detailOpen = event.target.open;
},true);

window.addEventListener('beforeunload',event => {
  if (!draftDirty) return;
  event.preventDefault();
  event.returnValue = true;
});

if (!stored) {
  const samples = [
    ['Customer Support Retrieval',0,'customer-support',true],
    ['Product FAQ',0,'product-faq',true],
    ['Service Handbook',0,'service-handbook',false],
    ['Engineering Knowledge',1,'engineering-knowledge',false]
  ];
  for (const [name,group,systemId,ready] of samples) {
    const system = makeSystem(name,group,sampleSystemIds[systemId]);
    system.active = clone(fixture.config);
    system.revision = 1;
    system.indexGeneration = uuid();
    system.indexReady = true;
    system.initialized = ready;
    system.documents = ready ? clone(fixture.ingestion.documents) : [];
    model.systems.push(system);
  }
}
persist();
for (const system of model.systems) {
  if (runtimePipelines.some(pipeline => deployment(system).desired[pipeline] && !pipelineReady(system,pipeline))) {
    scheduleRuntimeReconcile(system);
  }
}
render();
pollRuns();
</script>
</body>
</html>
