<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retrieval Builder</title>
<style>
:root{--ink:#232738;--muted:#7b8193;--line:#e8eaf0;--accent:#6555d7;--bg:#f8f9fc}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 Inter,"Segoe UI","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible{outline:3px solid #b8aef6;outline-offset:3px}
.sidebar{width:236px;position:fixed;inset:0 auto 0 0;background:white;border-right:1px solid var(--line);padding:32px 20px}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:750;letter-spacing:-.6px;margin-bottom:50px}
.mark{background:var(--accent);color:white;border-radius:10px;padding:4px 12px}
.caption{font-size:10px;color:var(--muted);letter-spacing:1.5px;font-weight:700;margin:0 12px 16px}
.group{border:0;background:none;color:#687083;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 12px;border-radius:8px;margin:5px 0}
.group.active{background:#f0edff;color:#5a49ca;font-weight:650}
.group .count{margin-left:auto;font-size:11px}
.side-note{position:absolute;bottom:25px;left:32px;font-size:11px;color:#979cad}
main{margin-left:236px;padding:0 48px 60px}
header{height:104px;display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--line)}
.crumb{color:var(--muted);font-size:12px}
.btn{background:white;border:1px solid #dddfea;border-radius:8px;padding:10px 16px;color:#535a6e;font-weight:600}
.primary{background:var(--accent);border-color:var(--accent);color:white;box-shadow:0 4px 10px #6555d71a}
.primary:hover{background:#5747c6}
.intro{margin:38px 0 28px}
.intro h1{font-size:28px;letter-spacing:-.8px;margin:0 0 5px}
.muted{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.card{background:white;border:1px solid var(--line);border-radius:13px;padding:24px;transition:box-shadow .15s}
.card:hover{box-shadow:0 6px 24px #32354b09}
.cardtop{display:flex;align-items:center;justify-content:space-between}
.system-icon{width:48px;height:48px;display:grid;place-items:center;background:#f0edff;color:var(--accent);border-radius:13px;font-size:24px}
.status{font-size:10px;color:#7e879b;background:#f6f7fa;border-radius:20px;padding:4px 9px}
.status.ready{color:#268472;background:#edf9f5}
.card h2{font-size:17px;margin:21px 0 3px;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:7px;margin-top:25px}
.actions button{flex:1;border:1px solid #e6e7f0;background:white;color:#60677d;border-radius:7px;padding:8px 2px;font-size:11px}
.actions button:hover{background:#f5f3ff;color:var(--accent)}
.export{background:none;border:0;padding:14px 0 0;color:#9296a4;font-size:11px}
.hint{font-size:11px;color:#9a9fb0;margin-top:30px}
dialog{border:1px solid var(--line);border-radius:16px;width:min(1200px,94vw);max-height:90vh;padding:0;color:var(--ink);box-shadow:0 24px 100px #18213730}
dialog::backdrop{background:#1a203b65;backdrop-filter:blur(3px)}
.modalhead{padding:24px 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.modalhead h2{font-size:22px;margin:0}
.close{border:0;background:#f5f6fa;border-radius:8px;font-size:22px;color:#7e8594;padding:0 10px}
.modalbody{padding:26px 30px;background:#fafbfe}
.modalfoot{padding:18px 30px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line)}
.label{display:block;font-size:12px;font-weight:600;color:#646c82;margin:12px 0 6px}
.control{width:100%;border:1px solid #dfe2eb;border-radius:8px;padding:10px 12px;background:white;color:var(--ink)}
.control:focus{outline:2px solid #d5ceff}
.builder{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:20px;margin-top:22px}
.panel{background:white;border:1px solid var(--line);border-radius:11px;padding:20px}
.panel h3{font-size:14px;margin:0 0 15px}
.module-line{display:flex;flex-wrap:wrap;gap:8px}
.module{border:1px solid #e1e4ed;background:white;border-radius:8px;padding:14px 12px;text-align:left;flex:1;min-width:110px;color:#4d566d}
.module strong{font-size:12px;display:block}
.module small{display:block;font-size:10px;margin-top:8px;color:#8790a3}
.module.selected{border-color:var(--accent);background:#f6f3ff;color:var(--accent)}
.pipeline+.pipeline{margin-top:18px}
.notice{font-size:12px;padding:12px;border-radius:8px;background:#f2f0ff;color:#64588d;white-space:pre-line;margin-top:18px}
.notice.error{background:#fff1ef;color:#af4a3b}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.upload{border:1px dashed #cfd0e2;background:#faf9ff;padding:28px 20px;border-radius:9px;margin:16px 0}
.result{white-space:pre-wrap;background:white;border:1px solid var(--line);padding:20px;border-radius:9px;min-height:170px;font-size:13px}
.toast{position:fixed;bottom:25px;right:28px;background:#30334b;color:white;padding:12px 20px;border-radius:10px;z-index:10}
.empty{padding:50px;border:1px dashed #daddE8;border-radius:12px;color:var(--muted)}
@media(max-width:1250px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:850px){.sidebar{width:185px;padding:26px 12px}
main{margin-left:185px;padding:0 22px}
.cards,.builder,.twocol{grid-template-columns:1fr}
.modalhead,.modalbody,.modalfoot{padding:20px}
.brand{font-size:16px}
.side-note{left:20px}
}
@media(max-width:550px){.sidebar{position:static;width:100%;padding:14px}
.brand{margin:0 0 12px}
.caption,.side-note{display:none}
#groups{display:flex;overflow:auto}
.group{white-space:nowrap;margin:0;width:auto}
.count{display:none}
main{margin:0;padding:0 16px}
header{height:85px}
.crumb{display:none}
.intro{margin-top:24px}
.modalhead h2{font-size:18px}
}

:root{--error:#a1323b;--warn:#835017}
h3,p{margin:0}
[hidden]{display:none!important}
pre{max-height:320px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f6fa;border:1px solid var(--line);padding:14px;border-radius:8px;font:12px/1.7 ui-monospace,monospace}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #a093f1;outline-offset:2px}
.card{min-width:0}
.cardlinks,.bar,.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.cardlinks,.bar{justify-content:space-between}
.toolbar{margin-top:14px}
.card .export:enabled:hover,.quiet:hover{text-decoration:underline}
.status{white-space:nowrap}
.status.warn,.badge.warn{background:#fff4e4;color:var(--warn)}
.status.bad,.badge.bad{background:#fff1ef;color:var(--error)}
.badge{display:inline-flex;align-items:center;white-space:nowrap;border-radius:20px;padding:4px 9px;background:#f6f7fa;color:#657087;font-size:11px}
.badge.good{background:#edf9f5;color:#268472}
.btn.small{font-size:12px;padding:5px 9px}
.btn.danger{background:#a1323b;border-color:#a1323b;color:white}
.quiet{border:0;background:none;color:var(--accent);font-weight:650;padding:4px 0}
#publish{width:min(480px,94vw)}
.modalhead .muted{font-size:12px;overflow-wrap:anywhere}
.editor-meta{margin-bottom:14px}
.builder{grid-template-columns:minmax(0,.95fr) minmax(0,1.2fr);align-items:start}
.builder>.panel,.operation>.stack,.operation>aside{min-width:0}
.module{min-width:125px}
.module small{margin-top:4px;overflow-wrap:anywhere}
.module.selected small{color:#6555a7}
.flow-title h3{margin:0}
.operation{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(220px,1fr);gap:20px;align-items:start}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:grid;gap:5px;align-content:start;margin-top:11px;min-width:0;font-size:12px;font-weight:600;color:#646c82}
.wide{grid-column:1/-1}
.control{font-size:13px;min-width:0}
.control[aria-invalid=true]{border-color:var(--error)}
textarea.control{min-height:90px;resize:vertical}
.code{font:12px/1.55 ui-monospace,monospace}
.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;text-align:left;font-size:12px}
td,th{border-bottom:1px solid var(--line);padding:7px;vertical-align:middle}
th{color:var(--muted);font-weight:650;white-space:nowrap}
td .control{padding:5px 7px}
.check{width:16px;height:16px;accent-color:var(--accent)}
.summary-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.stack{display:grid;gap:14px}
.info{padding:11px 13px;border-radius:8px;background:#f2f0ff;color:#64588d;margin-top:12px;overflow-wrap:anywhere;font-size:12px}
.info.bad{background:#fff1ef;color:var(--error)}
.info.warn{background:#fff4e4;color:var(--warn)}
.inline-error{font-size:12px;color:var(--error);font-weight:500}
.result{min-height:0;margin-top:12px}
.result h3{margin:0}
.result p{margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
details{margin-top:14px}
fieldset.field{margin-inline:0;min-width:0;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
fieldset.field legend{color:var(--ink);padding-inline:4px}
summary{cursor:pointer;color:var(--accent);font-weight:650}
.modalfoot{flex-wrap:wrap}
.runtime-facts{display:flex;flex-wrap:wrap;gap:10px 24px;margin:12px 0}
.runtime-facts div{min-width:120px}
.runtime-facts dt{color:var(--muted);font-size:12px}
.runtime-facts dd{margin:2px 0 0;font-weight:650;overflow-wrap:anywhere}
.run-selection{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.check-label{display:flex;align-items:center;gap:7px;margin-top:12px;font-size:12px;color:#646c82}
.template-picker{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
.template-picker .btn{white-space:nowrap}
@media(max-width:850px){.builder,.operation{grid-template-columns:1fr}}
@media(max-width:550px){.form-grid{grid-template-columns:1fr}.modalhead,.modalbody,.modalfoot{padding:16px}.card{padding:18px}}
</style>
</head>
<body>
<aside class="sidebar" aria-label="工作區導覽">
  <div class="brand"><span class="mark" aria-hidden="true">r</span> Retrieval Builder</div>
  <div class="caption">WORKSPACES</div>
  <nav id="groups" aria-label="Workspace groups"></nav>
  <div class="side-note">DEV · 本機模擬</div>
</aside>
<main>
  <header>
    <div class="crumb">Workspaces / <span id="breadcrumb"></span></div>
    <button class="btn primary" data-action="open-create">＋ Create Retrieval System</button>
  </header>
  <div class="intro"><h1 id="group-title"></h1><div class="muted" id="group-description"></div></div>
  <div class="cards" id="cards"></div>
</main>
<dialog id="system-dialog" aria-labelledby="dialog-title">
  <div class="modalhead">
    <div><h2 id="dialog-title"></h2><div class="muted" id="dialog-subtitle"></div></div>
    <button class="close" aria-label="關閉" data-action="close-dialog">×</button>
  </div>
  <div class="modalbody" id="page"></div>
  <div class="modalfoot" id="editor-actions" hidden></div>
</dialog>
<dialog id="publish" aria-labelledby="publish-title">
  <div class="modalhead"><h2 id="publish-title">發布設定</h2></div>
  <div class="modalbody" id="publish-impact"></div>
  <div class="modalfoot"><button class="btn" data-action="close-dialog">返回</button><button class="btn primary" data-action="publish" id="publish-confirm">發布</button></div>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>

    : Object.fromEntries([

  const fields = composed ? {...chunkFields,[embedding.composition_field]:{type:'string',required:true}} : chunkFields;
  const vectorBindings = embedNode.component_id === 'remote_api' ? declaredFields(embedNode.output?.vectors)
    : Object.fromEntries(embeddingMappings(embedding)
      .filter(entry => entry.vector_name && fields[entry.source_field]?.type === 'string' && fields[entry.source_field].required)
      .map(entry => [entry.vector_name, {

      }]));

  const index = params(config,'indexing');
  const indexed = Object.fromEntries(Object.entries(fields).map(([key,data]) => [key,{...data,...index.structdata_overrides?.[key]}]));

function compositionProblem(embedding,fields) {
  if (!fieldName.test(embedding.composition_field ?? '')) return '請輸入有效的組合輸出欄位名稱。';
  if (Object.hasOwn(fields,embedding.composition_field)) return '組合輸出欄位名稱已存在。';
  const template = embedding.composition_template ?? '';
  const tokens = /\{\{\s*structdata\.([^{}]+?)\s*\}\}/g;
  if (!template.trim() || /\{\{|\}\}/.test(template.replace(tokens,''))) return '請使用 {{structdata.欄位}} 引用文字欄位。';
  const missing = [...template.matchAll(tokens)].map(match => match[1]).find(name => fields[name]?.type !== 'string' || !fields[name]?.required);
  return missing ? '模板須引用有效且必填的文字欄位：' + missing : '';

function optionValues(config, module, path) {

  const data = derive(config);
  const chooseFields = fields => Object.entries(fields).filter(([,field]) =>
    (!spec.types || spec.types.includes(field.type)) && (!spec.required || field.required)).map(([key]) => key);
  return ({
    'input.structdata': () => chooseFields(module === 'chunking' ? data.parsed : data.fields),
    'input.vectors': () => data.vector,
    'index_plan.vectors': () => data.vector.filter(value => indexVectorNames(config).includes(value)),
    'index_plan.fulltext': () => Object.keys(data.indexed).filter(key => data.indexed[key].searchable).map(key => 'structdata.' + key),
    'candidate.structdata': () => chooseFields(data.indexed),

      if (laneOf(selected) === 'ingestion') next.output = {structdata:{},vectors:{}};
    }
  } else if (selected === 'embedding') normalizeEmbeddingDraft(next);
  if (componentId === 'remote_api') next.contract_version ??= remoteApiVersion;
  if (selected === 'retrieval') normalizeRetrievalDraft(next);
  if (selected === 'indexing') normalizeIndexDraft(next);
  draft.pipelines[laneOf(selected)][selected] = next;
  detailOpen = false;
  markDirty();
  render();
  $('component-picker')?.focus();
}

function loadModuleTemplate(templateKey) {
  const entry = moduleTemplates[templateKey];
  if (!entry) return;
  const saved = normalizeDraft(clone(current().draft));
  const pipelineJSON = config => JSON.stringify(orderedJSON(config.pipelines));
  if (pipelineJSON(draft) !== pipelineJSON(saved) &&
      !confirm('載入模板會替換目前尚未保存的模組設定。繼續？')) return;
  const template = clone(fixture.config);
  if (templateKey === 'faq') {
    Object.assign(params(template,'chunking'),{max_tokens:192,overlap_tokens:24});
    Object.assign(params(template,'retrieval'),{per_route_k:6});
    delete template.pipelines.inference.fixed_filters;
  }
  draft.pipelines = normalizeDraft(template).pipelines;
  componentDrafts = {};
  selected = 'import';
  detailOpen = false;
  markDirty();
  render();
  notify('已載入模組設定：' + entry.label);
}

function fieldVisible(item,key,values) {
  const rule = item.ui_hints?.visible_when?.['/' + key];
  if (rule === undefined || typeof rule === 'boolean') return rule ?? true;
  const valueAt = path => {
    const name = path.slice(1).replace(/~1/g,'/').replace(/~0/g,'~');
    return values[name] ?? item.parameters_schema.properties[name].default;
  };
  const matches = condition => {
    if (condition.paths) {
      const count = condition.paths.reduce((total,path) => total + selectedItemCount(valueAt(path)),0);
      return count >= condition.minimum_selected;
    }
    const value = valueAt(condition.path);
    return Object.hasOwn(condition,'equals') ? value === condition.equals
      : typeof value === 'number' && value >= condition.minimum;
  };
  return rule.all ? rule.all.every(matches) : rule.any.some(matches);
}

function selectField(value, values, attrs, entries = {}) {

    ${values.map(item => option(item, entries[item]?.label ?? (Object.hasOwn(displayNames,item) ? displayNames[item] : item), item === value)).join('')}</select>`;

function objectShape(properties, required = []) {
  return {type:'object', properties, required, additionalProperties:false};
}

function fieldValueSchema(type) {
  if (type === 'string_array') return {type:'array',items:{type:'string'}};
  return fixture.schemas.data_meta.$defs[type] ?? {type};
}

function documentSchema(fields, {source, mediaTypes, chunk, vectors = {}} = {}) {
  const shared = fixture.schemas.document;
  const properties = {
    document_id:shared.$defs.document_id, source_revision:shared.properties.source_revision,
    structdata:objectShape(
      Object.fromEntries(Object.entries(fields).map(([name,field]) => [name,fieldValueSchema(field.type)])),
      Object.keys(fields).filter(name => fields[name].required)
    ),
    metadata:shared.properties.metadata
  };
  const required = ['document_id'];
  if (source === 'content') {
    properties.content = clone(shared.properties.content);
    if (mediaTypes?.length) properties.content.properties.media_type.enum = mediaTypes;
    required.push('content');
  }
  if (source !== 'content' || properties.structdata.required.length) required.push('structdata');
  if (chunk) {
    properties.data_id = shared.properties.data_id;
    required.push('data_id');
  }
  properties.vectors = objectShape(Object.fromEntries(Object.entries(vectors).map(([name,vector]) => {
    const shape = clone(shared.$defs.denseVector);
    if (vector.source_field) shape.properties.source_field.const = vector.source_field;
    if (vector.embedding_profile_id) shape.properties.embedding_profile_id.const = vector.embedding_profile_id;
    if (Number.isInteger(vector.dimensions) && vector.dimensions > 0) {
      shape.properties.values.minItems = shape.properties.values.maxItems = vector.dimensions;
    }
    return [name,shape];
  })),Object.keys(vectors));
  if (Object.keys(vectors).length) required.push('vectors');
  return objectShape(properties,required);
}

function parameterPreview(config,module) {
  const rows = (params(config,module).request_parameters ?? []).filter(row => row.name && row.type);
  const properties = {};
  const required = [];
  for (const row of rows) {
    const shape = {type:row.type};
    if (row.default_value?.trim()) {
      try { shape.default = JSON.parse(row.default_value); }
      catch { /* Invalid draft values are kept in the editor. */ }
    }
    Object.defineProperty(properties,row.name,{value:shape,enumerable:true,configurable:true});
    if (row.required) required.push(row.name);
  }
  return rows.length ? objectShape(properties,[...new Set(required)]) : {type:'object'};
}

function ingestionRequestSchema(config, document) {
  const schema = clone(fixture.schemas.ingestion_request);
  delete schema.$id;
  schema.properties.documents.items = document;
  schema.properties.parameters = parameterPreview(config,'import');
  if (schema.properties.parameters.required?.length) schema.required.push('parameters');
  return schema;
}

function exampleForType(schema, sample) {
  if (Object.hasOwn(schema,'default') && fitsType(schema.default,schema.type)) return schema.default;
  if (schema.enum?.length) return schema.enum[0];
  if (schema.format === 'date') return '2026-11-17';
  if (schema.format === 'date-time') return '2026-11-17T11:00:00+08:00';
  if (schema.type === 'object') return {};
  if (schema.type === 'array') return schema.items?.type === 'string' ? ['sample'] : [];
  if (fitsType(sample,schema.type)) return sample;
  return {string:'範例文字',integer:1,number:1,boolean:false}[schema.type];
}

function ingestionExample(schema) {
  const shape = schema.properties.documents.items;
  const sample = fixture.ingestion.documents[0].structdata;
  const document = {document_id:'doc-001'};
  const fields = shape.properties.structdata.properties;
  if (Object.keys(fields).length || shape.required.includes('structdata')) {
    document.structdata = Object.fromEntries(Object.entries(fields).map(([name,field]) => [name,exampleForType(field,sample[name])]));
  }
  if (shape.properties.content) {
    document.content = {
      media_type:shape.properties.content.properties.media_type.enum?.[0] ?? 'application/octet-stream',
      uri:'https://example.invalid/document'
    };
  }
  const request = {documents:[document]};
  const parameters = schema.properties.parameters.properties;
  if (parameters && Object.keys(parameters).length) {
    request.parameters = Object.fromEntries(Object.entries(parameters).map(([name,field]) => [name,exampleForType(field)]));
  }
  return request;
}

function effectiveContracts(config) {
  const data = derive(config);
  const source = importSource(config);
  const document = documentSchema(data.input,{source,mediaTypes:parserMediaTypes(config)});
  const request = ingestionRequestSchema(config,document);
  const listOf = items => ({type:'array',items});
  const parsed = listOf(documentSchema(data.parsed));
  const chunks = listOf(documentSchema(data.chunkFields,{chunk:true}));
  const embedded = listOf(documentSchema(data.fields,{chunk:true,vectors:data.vectorBindings}));
  const binding = clone(fixture.schemas.index_binding);
  delete binding.$id;
  const selected = indexVectorNames(config).filter(name => Object.hasOwn(data.vectorBindings,name));
  const bindingEntry = binding.$defs.VectorIndexBinding;
  binding.properties.vector_bindings = objectShape(Object.fromEntries(selected.map(name => {
    const shape = clone(bindingEntry);
    for (const [key,value] of Object.entries(data.vectorBindings[name])) {
      if (value !== undefined && shape.properties[key]) shape.properties[key].const = value;
    }
    return [name,shape];
  })),selected);
  for (const [key,flag] of [['fulltext_fields','searchable'],['filter_fields','filterable']]) {
    const names = Object.entries(data.indexed).filter(([,field]) => field[flag]).map(([name]) => 'structdata.' + name);
    binding.properties[key].items = names.length ? {enum:names} : false;
  }
  const contexts = clone(fixture.schemas.query_context);
  delete contexts.$id;
  contexts.items.properties.result_sets.items.properties.items.items.properties.data =
    documentSchema(data.indexed,{chunk:true});
  // Retrieved candidates may carry vectors; when present they use the effective declarations.
  const candidate = contexts.items.properties.result_sets.items.properties.items.items.properties.data;
  candidate.properties.vectors = clone(embedded.items.properties.vectors);
  candidate.properties.vectors.required = [];
  const inference = clone(fixture.schemas.inference_request);
  delete inference.$id;
  inference.$defs = contexts.$defs;
  inference.properties.filters.$ref = '#/$defs/filters';
  inference.properties.parameters = parameterPreview(config,'inference_input');
  if (inference.properties.parameters.required?.length) inference.required.push('parameters');

  return {
    import:[request,document], parsing:[document,parsed], chunking:[parsed,chunks],
    embedding:[chunks,embedded], indexing:[embedded,binding],
    inference_input:[inference,contexts], query_transformation:[contexts,contexts],
    retrieval:[contexts,contexts], rerank:[contexts,contexts]
  };
}

function contractPreview(module,owner,item) {

function refreshContractPreviews() {
  const elements = $('page').querySelectorAll('[data-contract-preview]');
  if (!elements.length) return;
  const contracts = effectiveContracts(draft);
  const composition = $('page').querySelector('[data-composition-error]');
  if (composition) composition.textContent = compositionProblem(params(draft,'embedding'),derive(draft).chunkFields);
  for (const element of elements) {
    const kind = element.dataset.contractPreview;
    if (kind === 'request') {
      element.textContent = json(ingestionExample(contracts.import[0]));
      continue;
    }
    const schema = contracts[element.dataset.module][kind === 'input' ? 0 : 1];
    const module = element.dataset.remoteModule;
    if (!module) {
      element.textContent = json(schema);
      continue;
    }
    const definition = fixture.schemas.remote_api.$defs[kind === 'input' ? 'request' : 'success'];
    const envelope = clone(definition);
    const { $defs, ...payload } = schema;
    if ($defs) envelope.$defs = $defs;
    if (kind === 'input') {
      const remote = node(draft,module);
      envelope.properties.contract_version = {const:remote.contract_version};
      envelope.properties.segment = {const:{module,through:remote.through}};
      envelope.properties.input = payload;
    } else {
      envelope.properties.output = payload;
    }
    element.textContent = json(envelope);
  }
}

function retrievalMode(values) {
  const vector = values.vector_name || values.vector_fields?.some(Boolean);
  const fulltext = values.fulltext_fields?.some(Boolean);
  return fulltext && vector ? 'Hybrid' : fulltext ? '全文檢索' : vector ? '向量檢索' : '尚未選擇檢索欄位';
}

function searchRouteCount(values) {
  return selectedItemCount([values.vector_name,...(values.vector_fields ?? [])]) + selectedItemCount(values.fulltext_fields);
}

function selectedItemCount(values) {
  return new Set((values ?? []).filter(value => typeof value === 'string' && value.trim())).size;
}

function renderField(key, schema, value) {
  const title = schema.title || labels[key] || key;
  const path = prefix(selected) + '/' + key;
  const error = issues.find(issue => issue.path === path);
  const feedback = error ? `<span class="inline-error">${escapeHTML(error.message)}</span>` : '';
  const item = descriptor(selected,draft);
  const editor = item.ui_hints?.controls?.['/' + key];
  if (editor === 'structdata_editor') return importFields(key,value ?? {});
  if (editor === 'structdata_overrides_editor') return indexFields(key,value ?? {});
  if (editor === 'vector_checklist') return indexVectorFields();
  if (editor === 'secret_password') {
    const secretKey = secretKeyFromReference(value);
    return `<label class="field">${escapeHTML(title)}<input type="password" class="control"
      data-param="${escapeHTML(key)}" data-secret-password aria-label="${escapeHTML(title)}"
      autocomplete="new-password" value="${escapeHTML(draft.secret?.[secretKey])}">${feedback}</label>`;
  }
  if (schema.type === 'array') {
    const canRemove = !item.parameters_schema.required.includes(key) || (value?.length ?? 0) > (schema.minItems ?? 0);
    const rows = (value ?? []).map((entry,index) => `<tr>${schema.items.type === 'object' ? Object.entries(schema.items.properties).map(([sub,shape]) => {
      const attrs = `data-param="${key}" data-row="${index}" data-column="${sub}" aria-label="${title} ${index+1}：${shape.title || labels[sub] || sub}"`;
      return `<td>${renderControl(shape,entry[sub],attrs,'/' + key + '/*/' + sub)}</td>`;
    }).join('') : `<td>${renderControl(schema.items,entry,`data-param="${key}" data-row="${index}" aria-label="${title}"`,'/' + key + '/*')}</td>`}
    <td><button class="btn small" data-action="remove-item" data-value="${key}" data-index="${index}" aria-label="移除此項" ${canRemove ? '' : 'disabled'}>移除</button></td></tr>`).join('');
    const headings = schema.items.type === 'object' ? Object.entries(schema.items.properties).map(([sub,shape]) => `<th>${shape.title || labels[sub] || sub}</th>`).join('') : '<th>欄位</th>';
    return `<div class="field wide"><strong>${title}</strong>${rows ? `<div class="table-wrap"><table><thead><tr>${headings}<th></th></tr></thead><tbody>${rows}</tbody></table></div>` : ''}
      ${feedback}<div><button class="btn small" data-action="add-item" data-value="${key}">＋ 新增</button></div></div>`;
  }
  const attrs = `data-param="${key}" aria-label="${title}"`;
  const description = schema.description ? `<small class="muted">${escapeHTML(schema.description)}</small>` : '';
  const control = renderControl(schema,value,attrs,'/' + key,Boolean(error));
  return `<label class="field ${editor === 'textarea' ? 'wide' : ''}">${title}${control}${description}${feedback}</label>`;
}

function renderControl(schema,value,attrs,path,invalid = false) {
  if (Object.hasOwn(schema,'const')) {
    const fixed = typeof schema.const === 'string' ? schema.const : JSON.stringify(schema.const);
    return `<input class="control" ${attrs} value="${escapeHTML(fixed)}" readonly>`;
  }
  value ??= schema.default;
  const choices = optionValues(draft,selected,path);
  if (choices) {
    const source = descriptor(selected,draft).option_sources[path].source;
    const available = schema.enum ? choices.filter(choice => schema.enum.includes(choice)) : choices;
    return selectField(value,available,attrs,resources[source]);
  }
  if (schema.enum) {
    const typed = schema.enum.some(choice => typeof choice !== 'string');
    const encode = choice => typed ? JSON.stringify(choice) : choice;
    const available = schema.enum.includes(value);
    return `<select class="control" ${attrs} ${typed ? 'data-typed-option' : ''}
      aria-invalid="${value != null && !available}">
      ${available ? '' : option('',value == null ? '請選擇' : value + '（已失效）',true)}
      ${schema.enum.map(choice => option(encode(choice),schema['x-enum-labels']?.[choice]
        ?? (Object.hasOwn(displayNames,choice) ? displayNames[choice] : choice),choice === value)).join('')}</select>`;
  }
  if (schema.type === 'boolean') return `<input type="checkbox" class="check" ${attrs} ${value ? 'checked' : ''}>`;
  if (descriptor(selected,draft).ui_hints?.controls?.[path] === 'textarea') {
    return `<textarea class="control" ${attrs} rows="4">${escapeHTML(value)}</textarea>`;
  }
  const numeric = schema.type === 'integer' || schema.type === 'number';
  const bounds = numeric
    ? [['min',schema.minimum],['max',schema.maximum],['step',schema.type === 'integer' ? 1 : 'any']]
    : [['minlength',schema.minLength],['maxlength',schema.maxLength]];
  const limits = bounds.filter(([,limit]) => limit !== undefined)
    .map(([name,limit]) => `${name}="${escapeHTML(limit)}"`).join(' ');
  return `<input ${attrs} class="control" type="${numeric ? 'number' : 'text'}" ${limits} value="${escapeHTML(value)}" aria-invalid="${invalid}">`;
}

function importFields(key,fields) {
  return `<div class="field wide"><strong>文件欄位</strong><div class="table-wrap"><table><thead><tr><th>欄位</th><th>型別</th><th>必填</th><th>全文</th><th>Filter</th><th></th></tr></thead><tbody>${Object.entries(fields).map(([name,data]) => {

    const flag = (key, label) => `<input type="checkbox" class="check" ${attrs} data-property="${key}" aria-label="${escapeHTML(name)} ${label}" ${data[key] ? 'checked' : ''}>`;
    return `<tr><td><input class="control" ${attrs} data-property="name" aria-label="${escapeHTML(name)} 欄位名稱" value="${escapeHTML(name)}"></td>
      <td><select class="control" ${attrs} data-property="type" aria-label="${escapeHTML(name)} 型別">${types.map(type => option(type,type,data.type === type)).join('')}</select></td>
      <td>${flag('required','必填')}</td><td>${flag('searchable','全文')}</td><td>${flag('filterable','Filter')}</td>
      <td><button class="btn small" data-action="remove-field" data-editor-param="${escapeHTML(key)}" data-value="${escapeHTML(name)}" aria-label="移除 ${escapeHTML(name)}">移除</button></td></tr>`;
  }).join('')}</tbody></table></div><div><button class="btn small" data-action="add-field" data-editor-param="${escapeHTML(key)}">＋ 新增欄位</button></div></div>`;

function indexFields(parameter,overrides) {

function markDirty() {
  draftDirty = true;
  checked = null;
  issues = [];
  const revision = $('page').querySelector('.flow-title .muted');
  if (revision) revision.textContent = '草稿 ' + current().draftRevision + ' · 未保存';
  refreshContractPreviews();
}

function saveDraft(system) {
  if (system === pendingSystem) {
    model.systems.push(system);
    pendingSystem = null;
  } else if (draftDirty) system.draftRevision++;
  if (!draftDirty) return;
  system.name = draftName.trim();
  system.draft = clone(draft);
  system.componentDrafts = clone(componentDrafts);
  draftDirty = false;
  persist();
}

function hasDraftName() {
  const input = $('system-name');
  if (draftName.trim()) return true;
  input.value = '';
  input.reportValidity();
  return false;
}

function fitsType(value, type) {
  if (type === 'number') return typeof value === 'number' && Number.isFinite(value);
  if (type === 'integer') return Number.isSafeInteger(value);
  if (type === 'string_array') return Array.isArray(value) && value.every(entry => typeof entry === 'string');
  if (type === 'date') return typeof value === 'string' && /^\d{4}-\d\d-\d\d$/.test(value) && validDate(value);
  if (type === 'datetime') return typeof value === 'string' && /^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?(?:Z|[+-]\d\d:\d\d)$/.test(value) && validDate(value.slice(0,10)) && Number.isFinite(Date.parse(value));
  return typeof value === type;
}

function validDate(value) {
  const time = new Date(value + 'T00:00:00Z');
  return Number.isFinite(time.getTime()) && time.toISOString().slice(0,10) === value;
}

function validateFilters(filters, config) {
  if (!Array.isArray(filters)) throw Error('Filter 須為陣列。');
  const {indexed} = derive(config);
  for (const [index,clause] of filters.entries()) {
    const where = '第 ' + (index + 1) + ' 組 Filter';
    record(clause,where);
    const group = Object.hasOwn(clause,'any');
    const conditions = group ? clause.any : [clause];
    if (!Array.isArray(conditions) || !conditions.length || (group && Object.keys(clause).length !== 1)) throw Error(where + '的 any 須包含至少一個條件。');
    for (const condition of conditions) {
      const {field,operator,value} = record(condition,where);
      const spec = typeof field === 'string' && field.startsWith('structdata.') ? Object.getOwnPropertyDescriptor(indexed,field.slice(11))?.value : null;
      if (!spec?.filterable) throw Error(where + '的欄位無法篩選：' + (field ?? '未指定'));
      if (Object.keys(condition).length !== 3 || !['eq','in','gt','gte','lt','lte'].includes(operator)) throw Error(where + '的操作符無效。');
      if (!['eq','in'].includes(operator) && !['integer','number','date','datetime'].includes(spec.type)) throw Error(where + '的欄位不支援範圍比對。');
      const values = operator === 'in' ? value : [value];
      if (!Array.isArray(values) || !values.length || !values.every(item => fitsType(item,spec.type === 'string_array' ? 'string' : spec.type))) {
        throw Error(where + '的值須符合 ' + spec.type + '。');
      }
    }
  }
}

function editableFilters(kind) {
  if (kind === 'fixed') return draft.pipelines.inference.fixed_filters ?? [];
  try { return JSON.parse(filterText); }
  catch { return filterText; }
}

function filterFields(config) {
  return Object.fromEntries(config ? Object.entries(derive(config).indexed)
    .filter(([,spec]) => spec.filterable).map(([name,spec]) => ['structdata.' + name,spec]) : []);
}

function filterEditor(kind, config) {
  const filters = editableFilters(kind);
  const fields = filterFields(config);
  const structured = Array.isArray(filters) && filters.every(item => object(item) && !Object.hasOwn(item,'any'));
  const title = kind === 'fixed' ? '固定 Filter' : '本次 Filter';
  return `<div class="field"><strong>${title}</strong>
    ${structured && filters.length ? `<div class="table-wrap"><table><thead><tr><th>欄位</th><th>條件</th><th>值</th><th></th></tr></thead><tbody>
      ${filters.map(({field,operator,value},index) => {
        const attrs = `data-filter="${kind}" data-index="${index}"`;
        const type = fields[field]?.type;
        const operators = ['number','integer','date','datetime'].includes(type) ? ['eq','in','gt','gte','lt','lte'] : ['eq','in'];
        const text = operator === 'in' || typeof value !== 'string' ? json(value) : value;
        return `<tr><td>${selectField(field,Object.keys(fields),attrs + ' data-filter-key="field" aria-label="Filter 欄位"')}</td>
          <td>${selectField(operator,operators,attrs + ' data-filter-key="operator" aria-label="Filter 條件"')}</td>
          <td><input class="control code" ${attrs} data-filter-key="value" aria-label="Filter 值" value="${escapeHTML(text)}" ${operator === 'in' ? 'placeholder="JSON 陣列"' : ''}></td>
          <td><button class="btn small" data-action="remove-filter" data-value="${kind}" data-index="${index}" aria-label="移除條件">移除</button></td></tr>`;
      }).join('')}</tbody></table></div>` : ''}
    ${structured && Object.keys(fields).length ? `<div><button class="btn small" data-action="add-filter" data-value="${kind}">＋ 新增條件</button></div>` : ''}
    <details ${structured ? '' : 'open'}><summary>編輯 Filter JSON</summary><label class="field">Filter 陣列<textarea class="control code" id="${kind === 'fixed' ? 'fixed-filters' : 'filter-text'}" rows="4">${escapeHTML(typeof filters === 'string' ? filters : json(filters))}</textarea></label></details></div>`;
}

function writeFilters(kind, filters, redraw) {
  if (kind === 'fixed') {
    draft.pipelines.inference.fixed_filters = filters;
    markDirty();
  } else filterText = json(filters);
  if (redraw) render();
  else {
    const editor = $(kind === 'fixed' ? 'fixed-filters' : 'filter-text');
    if (editor) editor.value = json(filters);
  }
}

function configIssues(config) {
  const result = [];
  const add = (module,key,message) => result.push({module,path:prefix(module) + '/' + key,message});
  const {input,fields} = derive(config);
  for (const module of Object.values(lanes).flat()) {
    const spec = baseline[module].parameters_schema;
    const values = params(config,module);
    for (const [key,shape] of Object.entries(spec.properties)) {
      const value = values[key];
      if (value === undefined && !spec.required.includes(key)) continue;
      const title = shape.title || labels[key] || key;
      if (shape.type === 'string' && (typeof value !== 'string' || !value.trim())) add(module,key,title + '為必填。');
      if (shape.type === 'integer' && (!Number.isSafeInteger(value) || value < shape.minimum)) add(module,key,title + '須為不小於 ' + shape.minimum + ' 的整數。');
      const selectorPath = module === 'embedding' && key === 'source_field' ? '/mappings/*/source_field' : '/' + key;
      const choices = optionValues(config,module,selectorPath);
      if (choices && value && !choices.includes(value)) add(module,key,title + '「' + value + '」已失效，請重新選擇。');
      if (shape.type === 'array' && Array.isArray(value)) {
        const allowed = optionValues(config,module,'/' + key + '/*');
        if (allowed && (new Set(value).size !== value.length || value.some(entry => !allowed.includes(entry)))) add(module,key,title + '含重複或失效選項。');
      }
    }
  }
  if (!searchRouteCount(params(config,'retrieval'))) add('retrieval','vector_fields','請至少選擇一個向量欄位或全文欄位。');
  for (const [key,value] of Object.entries(input)) {
    if (!fieldName.test(key)) add('import','structdata','欄位「' + key + '」格式無效。');
    if (value.searchable && value.type !== 'string') add('import','structdata','只有字串欄位可做全文搜尋：' + key);
  }
  const chunk = params(config,'chunking');
  const output = [chunk.output_field,...chunk.copy_fields.map(row => row.output_field)];
  if (output.some(key => !fieldName.test(key)) || new Set(output).size !== output.length) add('chunking','copy_fields','輸出欄位須為有效名稱且不可重複。');
  if (chunk.copy_fields.some(row => !Object.hasOwn(input,row.source_field))) add('chunking','copy_fields','複製來源包含失效欄位。');
  if (chunk.overlap_tokens >= chunk.max_tokens) add('chunking','overlap_tokens','重疊長度須小於切分上限。');
  for (const [key,flags] of Object.entries(params(config,'indexing').structdata_overrides)) {
    if (!Object.hasOwn(fields,key)) add('indexing','structdata_overrides','索引欄位「' + key + '」已失效，請清除覆寫。');
    else if (flags.searchable && fields[key].type !== 'string') add('indexing','structdata_overrides','只有字串欄位可做全文搜尋：' + key);
  }
  try { validateFilters(config.pipelines.inference.fixed_filters ?? [],config); }
  catch (error) { result.push({module:'inference_input',path:'/config/pipelines/inference/fixed_filters',message:error.message}); }
  return result;
}

function orderedJSON(value) {
  if (Array.isArray(value)) return value.map(orderedJSON);
  if (object(value)) return Object.fromEntries(Object.keys(value).sort().map(key => [key,orderedJSON(value[key])]));
  return value;
}

function indexImpact(system, config) {
  if (system.indexIssue || system.active && !system.indexReady) return 'blocked';
  if (!system.active) return 'create';
  const fingerprint = value => JSON.stringify(orderedJSON(value.pipelines.ingestion));
  return fingerprint(config) === fingerprint(system.active) ? 'reuse' : 'rebuild_required';
}

function checkPublish(system) {
  if (!hasDraftName()) return;
  issues = Object.values(lanes).flat().filter(module => outsideW1Preview(module,draft)).map(module => ({
    module, message:'目前 Prototype 的 W1 模擬範圍未涵蓋此 Component 或設定。可先保存草稿。'
  }));
  const effective = clone(draft);
  const indexing = node(effective,'indexing');
  if (indexing.component_id === 'elasticsearch' && indexing.parameters.service_source === 'dev_test') {
    const reference = indexing.parameters.password;
    for (const name of esConnection.then.required) delete indexing.parameters[name];
    const key = secretKeyFromReference(reference);
    if (key && effective.secret && !JSON.stringify(effective.pipelines).includes(JSON.stringify(reference))) {
      delete effective.secret[key];
    }
  }
  for (const [scope,label] of Object.entries(systemSettingLabels)) {
    for (const [key,value] of Object.entries(effective[scope] ?? {})) {
      if (value === null) issues.push({module:'other_settings',message:`請補填 ${label} 的 DEV 測試值：${key}`});
    }
  }
  for (const key of Object.keys(effective.variable ?? {})) {
    if (Object.hasOwn(effective.secret ?? {},key)) issues.push({module:'other_settings',message:'Variable 與 Secret 的 Key 重複：' + key});
  }
  if (!issues.length) {
    // Normalize single-field settings to the W1 simulation's original config shape.
    Object.assign(params(effective,'embedding'),embeddingMappings(params(draft,'embedding'))[0]);
    params(effective,'indexing').vector_name = indexVectorNames(draft)[0];
    const retrieval = params(effective,'retrieval');
    delete retrieval.fusion;
    delete retrieval.rrf_k;
    // The draft also stores inactive options so switching between methods is reversible.
    for (const module of Object.values(lanes).flat()) {
      const properties = baseline[module].parameters_schema.properties;
      for (const key of Object.keys(params(effective,module))) {
        if (!Object.hasOwn(properties,key)) delete params(effective,module)[key];
      }
    }
    issues = configIssues(effective);
  }
  if (issues.length) {
    selected = issues[0].module;
    render();
    return;
  }
  const action = indexImpact(system,effective);
  checked = {action,validated:effective,expected:activeRevision(system)};
  const messages = {
    create:['建立索引','發布後建立空索引。完成初次匯入即可查詢。'],
    reuse:['沿用索引','保留索引與資料。Inference 載入新版前會暫停查詢。'],
    rebuild_required:['重建索引','發布後目前資料會清除，查詢將暫停，須重新匯入。'],
    blocked:['無法發布',system.indexIssue?.message ?? '已發布的 Elasticsearch 索引遺失。請從 Runtime 面板恢復索引。']
  };
  const [title, description] = messages[action];
  const tone = action === 'blocked' ? 'bad' : action === 'rebuild_required' ? 'warn' : '';
  $('publish-impact').innerHTML = `<div class="info ${tone}"><strong>${title}</strong><p>${escapeHTML(description)}</p></div>`;
  $('publish-confirm').disabled = action === 'blocked';
  $('publish-confirm').textContent = action === 'rebuild_required' ? '重建並發布' : '確認發布';
  $('publish-confirm').className = action === 'rebuild_required' ? 'btn danger' : 'btn primary';
  $('publish').showModal();
}

function applyPublish(system) {
  if (!checked || checked.action === 'blocked') return;
  if (checked.expected !== activeRevision(system) || checked.action !== indexImpact(system,checked.validated)) {
    $('publish').close();
    notify('設定版本或索引狀態已變更，請重新驗證。');
    return;
  }
  if (hasActiveWork(system)) {
    $('publish').close();
    notify('資料匯入進行中。請待工作結束後重新發布。');
    return;
  }
  const firstPublish = !system.active;
  const target = deployment(system);
  saveDraft(system);
  if (checked.action !== 'reuse') {
    system.indexGeneration = uuid();
    system.initialized = false;
    system.documents = [];
    delete system.initialDocuments;
    viewRun = null;
  }
  system.revision++;
  system.active = checked.validated;
  system.indexReady = true;
  if (firstPublish) {
    for (const pipeline of runtimePipelines) {
      target.desired[pipeline] = true;
      target.loaded[pipeline] = snapshot(system);
    }
  } else {
    if (target.desired.ingestion) target.loaded.ingestion = snapshot(system);
    scheduleRuntimeReconcile(system);
  }
  batchPreview = null;
  queryResult = null;
  checked = null;
  $('publish').close();
  persist();
  render();
  notify('已發布 ' + activeRevision(system));
}

    <details><summary>API 端點</summary><pre>POST ${apiRoot(system)}/ingestions
GET  ${apiRoot(system)}/ingestions/{run_id}
POST ${apiRoot(system)}/ingestions/{run_id}/cancel
GET  ${apiRoot(system)}/documents/{document_id}/ingestion-status</pre></details>
