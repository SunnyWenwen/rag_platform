<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retrieval Builder</title>
<style>
:root{--ink:#232738;--muted:#7b8193;--line:#e8eaf0;--accent:#6555d7;--bg:#f8f9fc}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 Inter,"Segoe UI","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible{outline:3px solid #b8aef6;outline-offset:3px}
.sidebar{width:236px;position:fixed;inset:0 auto 0 0;background:white;border-right:1px solid var(--line);padding:32px 20px}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:750;letter-spacing:-.6px;margin-bottom:50px}
.mark{background:var(--accent);color:white;border-radius:10px;padding:4px 12px}
.caption{font-size:10px;color:var(--muted);letter-spacing:1.5px;font-weight:700;margin:0 12px 16px}
.group{border:0;background:none;color:#687083;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 12px;border-radius:8px;margin:5px 0}
.group.active{background:#f0edff;color:#5a49ca;font-weight:650}
.group .count{margin-left:auto;font-size:11px}
.side-note{position:absolute;bottom:25px;left:32px;font-size:11px;color:#979cad}
main{margin-left:236px;padding:0 48px 60px}
header{height:104px;display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--line)}
.crumb{color:var(--muted);font-size:12px}
.btn{background:white;border:1px solid #dddfea;border-radius:8px;padding:10px 16px;color:#535a6e;font-weight:600}
.primary{background:var(--accent);border-color:var(--accent);color:white;box-shadow:0 4px 10px #6555d71a}
.primary:hover{background:#5747c6}
.intro{margin:38px 0 28px}
.intro h1{font-size:28px;letter-spacing:-.8px;margin:0 0 5px}
.muted{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.card{background:white;border:1px solid var(--line);border-radius:13px;padding:24px;transition:box-shadow .15s}
.card:hover{box-shadow:0 6px 24px #32354b09}
.cardtop{display:flex;align-items:center;justify-content:space-between}
.system-icon{width:48px;height:48px;display:grid;place-items:center;background:#f0edff;color:var(--accent);border-radius:13px;font-size:24px}
.status{font-size:10px;color:#7e879b;background:#f6f7fa;border-radius:20px;padding:4px 9px}
.status.ready{color:#268472;background:#edf9f5}
.card h2{font-size:17px;margin:21px 0 3px;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:7px;margin-top:25px}
.actions button{flex:1;border:1px solid #e6e7f0;background:white;color:#60677d;border-radius:7px;padding:8px 2px;font-size:11px}
.actions button:hover{background:#f5f3ff;color:var(--accent)}
.export{background:none;border:0;padding:14px 0 0;color:#9296a4;font-size:11px}
.hint{font-size:11px;color:#9a9fb0;margin-top:30px}
dialog{border:1px solid var(--line);border-radius:16px;width:min(1200px,94vw);max-height:90vh;padding:0;color:var(--ink);box-shadow:0 24px 100px #18213730}
dialog::backdrop{background:#1a203b65;backdrop-filter:blur(3px)}
.modalhead{padding:24px 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.modalhead h2{font-size:22px;margin:0}
.close{border:0;background:#f5f6fa;border-radius:8px;font-size:22px;color:#7e8594;padding:0 10px}
.modalbody{padding:26px 30px;background:#fafbfe}
.modalfoot{padding:18px 30px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line)}
.label{display:block;font-size:12px;font-weight:600;color:#646c82;margin:12px 0 6px}
.control{width:100%;border:1px solid #dfe2eb;border-radius:8px;padding:10px 12px;background:white;color:var(--ink)}
.control:focus{outline:2px solid #d5ceff}
.builder{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:20px;margin-top:22px}
.panel{background:white;border:1px solid var(--line);border-radius:11px;padding:20px}
.panel h3{font-size:14px;margin:0 0 15px}
.module-line{display:flex;flex-wrap:wrap;gap:8px}
.module{border:1px solid #e1e4ed;background:white;border-radius:8px;padding:14px 12px;text-align:left;flex:1;min-width:110px;color:#4d566d}
.module strong{font-size:12px;display:block}
.module small{display:block;font-size:10px;margin-top:8px;color:#8790a3}
.module.selected{border-color:var(--accent);background:#f6f3ff;color:var(--accent)}
.pipeline+.pipeline{margin-top:18px}
.notice{font-size:12px;padding:12px;border-radius:8px;background:#f2f0ff;color:#64588d;white-space:pre-line;margin-top:18px}
.notice.error{background:#fff1ef;color:#af4a3b}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.upload{border:1px dashed #cfd0e2;background:#faf9ff;padding:28px 20px;border-radius:9px;margin:16px 0}
.result{white-space:pre-wrap;background:white;border:1px solid var(--line);padding:20px;border-radius:9px;min-height:170px;font-size:13px}
.toast{position:fixed;bottom:25px;right:28px;background:#30334b;color:white;padding:12px 20px;border-radius:10px;z-index:10}
.empty{padding:50px;border:1px dashed #daddE8;border-radius:12px;color:var(--muted)}
@media(max-width:1250px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:850px){.sidebar{width:185px;padding:26px 12px}
main{margin-left:185px;padding:0 22px}
.cards,.builder,.twocol{grid-template-columns:1fr}
.modalhead,.modalbody,.modalfoot{padding:20px}
.brand{font-size:16px}
.side-note{left:20px}
}
@media(max-width:550px){.sidebar{position:static;width:100%;padding:14px}
.brand{margin:0 0 12px}
.caption,.side-note{display:none}
#groups{display:flex;overflow:auto}
.group{white-space:nowrap;margin:0;width:auto}
.count{display:none}
main{margin:0;padding:0 16px}
header{height:85px}
.crumb{display:none}
.intro{margin-top:24px}
.modalhead h2{font-size:18px}
}

:root{--error:#a1323b;--warn:#835017}
h3,p{margin:0}
[hidden]{display:none!important}
pre{max-height:320px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f6fa;border:1px solid var(--line);padding:14px;border-radius:8px;font:12px/1.7 ui-monospace,monospace}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #a093f1;outline-offset:2px}
.card{min-width:0}
.cardlinks,.bar,.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.cardlinks,.bar{justify-content:space-between}
.toolbar{margin-top:14px}
.card .export:enabled:hover,.quiet:hover{text-decoration:underline}
.status{white-space:nowrap}
.status.warn,.badge.warn{background:#fff4e4;color:var(--warn)}
.status.bad,.badge.bad{background:#fff1ef;color:var(--error)}
.badge{display:inline-flex;align-items:center;white-space:nowrap;border-radius:20px;padding:4px 9px;background:#f6f7fa;color:#657087;font-size:11px}
.badge.good{background:#edf9f5;color:#268472}
.btn.small{font-size:12px;padding:5px 9px}
.btn.danger{background:#a1323b;border-color:#a1323b;color:white}
.quiet{border:0;background:none;color:var(--accent);font-weight:650;padding:4px 0}
#publish{width:min(480px,94vw)}
.modalhead .muted{font-size:12px;overflow-wrap:anywhere}
.editor-meta{margin-bottom:14px}
.builder{grid-template-columns:minmax(0,.95fr) minmax(0,1.2fr);align-items:start}
.builder>.panel,.operation>.stack,.operation>aside{min-width:0}
.module{min-width:125px}
.module small{margin-top:4px;overflow-wrap:anywhere}
.module.selected small{color:#6555a7}
.flow-title h3{margin:0}
.operation{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(220px,1fr);gap:20px;align-items:start}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:grid;gap:5px;align-content:start;margin-top:11px;min-width:0;font-size:12px;font-weight:600;color:#646c82}
.wide{grid-column:1/-1}
.control{font-size:13px;min-width:0}
.control[aria-invalid=true]{border-color:var(--error)}
textarea.control{min-height:90px;resize:vertical}
.code{font:12px/1.55 ui-monospace,monospace}
.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;text-align:left;font-size:12px}
td,th{border-bottom:1px solid var(--line);padding:7px;vertical-align:middle}
th{color:var(--muted);font-weight:650;white-space:nowrap}
td .control{padding:5px 7px}
.check{width:16px;height:16px;accent-color:var(--accent)}
.summary-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.stack{display:grid;gap:14px}
.info{padding:11px 13px;border-radius:8px;background:#f2f0ff;color:#64588d;margin-top:12px;overflow-wrap:anywhere;font-size:12px}
.info.bad{background:#fff1ef;color:var(--error)}
.info.warn{background:#fff4e4;color:var(--warn)}
.inline-error{font-size:12px;color:var(--error);font-weight:500}
.result{min-height:0;margin-top:12px}
.result h3{margin:0}
.result p{margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
details{margin-top:14px}
summary{cursor:pointer;color:var(--accent);font-weight:650}
.modalfoot{flex-wrap:wrap}
@media(max-width:850px){.builder,.operation{grid-template-columns:1fr}}
@media(max-width:550px){.form-grid{grid-template-columns:1fr}.modalhead,.modalbody,.modalfoot{padding:16px}.card{padding:18px}}
</style>
</head>
<body>
<aside class="sidebar" aria-label="工作區導覽">
  <div class="brand"><span class="mark" aria-hidden="true">r</span> Retrieval Builder</div>
  <div class="caption">WORKSPACES</div>
  <nav id="groups" aria-label="Workspace groups"></nav>

<main>

  <div class="modalfoot"><button class="btn" data-action="close-dialog">返回</button><button class="btn primary" data-action="publish" id="publish-confirm">發布</button></div>

};

function remoteOwnership(config, lane) {
  const modules = remoteModules[lane];
  const owners = {};
  modules.forEach((module,index) => {
    if (owners[module] || node(config,module).component_id !== 'remote_api') return;
    const end = Math.max(index,modules.indexOf(node(config,module).through));
    for (const covered of modules.slice(index+1,end+1)) owners[covered] = module;
  });
  return owners;
}

function needsMoreRuntime(module, config) {
  const item = descriptor(module, config);
  const values = params(config,module);
  if (item.planned) return true;
  if (module === 'retrieval' && values.fulltext_fields?.length) return true;
  const baseProperties = baseline[module].parameters_schema.properties;
  return Object.keys(values).some(key => !Object.hasOwn(baseProperties,key) && configuredExtension(key,values));
}

function configuredExtension(key,values) {
  const value = values[key];
  if (key === 'service_source') return Boolean(value && value !== 'DEV test use');
  if (['embedding_service_ref','embedding_model','dimensions'].includes(key)) return values.service_source === 'Embedding API' && Boolean(value);
  if (key === 'elasticsearch_service_ref') return values.service_source === '自行提供 Elasticsearch' && Boolean(value);
  if (key.startsWith('composition_')) return values.compose_text === true && Boolean(value);
  if (key === 'fusion' || key === 'rrf_k') return searchRouteCount(values) > 1 && Boolean(value);
  return Array.isArray(value) ? value.length > 0 : value !== '' && value != null && value !== false;
}

function derive(config) {
  const input = params(config,'import').structdata;
  const owners = remoteOwnership(config,'ingestion');
  const remoteAt = module => node(config,owners[module] ?? module);
  const parsing = remoteAt('parsing');
  const parsed = parsing.component_id === 'remote_api'
    ? declaredFields(parsing.output?.structdata)
    : parsing.component_id === 'passthrough' ? input : {...input,contenttext:{type:'string',required:true}};
  const chunking = params(config,'chunking');
  const chunkNode = remoteAt('chunking');
  const chunkFields = chunkNode.component_id === 'remote_api' ? declaredFields(chunkNode.output?.structdata)
    : Object.fromEntries([
      [chunking.output_field,{type:'string',required:true}],
      ...chunking.copy_fields.filter(entry => Object.hasOwn(parsed,entry.source_field)).map(entry => [entry.output_field,parsed[entry.source_field]])
    ].filter(([name]) => name));
  const embedNode = remoteAt('embedding');
  const embedding = embedNode.component_id === 'remote_api' ? {} : params(config,'embedding');
  const fields = embedding.compose_text && embedding.composition_field
    ? {...chunkFields,[embedding.composition_field]:{type:'string',required:true}} : chunkFields;
  const vector = embedNode.component_id === 'remote_api' ? Object.keys(declaredFields(embedNode.output?.vectors))
    : [...new Set([embedding,...(embedding.mappings ?? [])]
      .filter(entry => fields[entry.source_field]?.type === 'string' && fields[entry.source_field].required)
      .map(entry => entry.vector_name).filter(Boolean))];
  const index = params(config,'indexing');
  const indexed = Object.fromEntries(Object.entries(fields).map(([key,data]) => [key,{...data,...index.structdata_overrides[key]}]));
  return {input,parsed,fields,indexed,vector};
}

function declaredFields(value) {
  return object(value) ? Object.fromEntries(Object.entries(value).filter(([,field]) => object(field))) : {};
}

function optionValues(config, module, path) {
  const spec = descriptor(module,config).option_sources[path];
  if (!spec) return null;
  const data = derive(config);
  const chooseFields = fields => Object.entries(fields).filter(([,field]) =>
    (!spec.types || spec.types.includes(field.type)) && (!spec.required || field.required)).map(([key]) => key);
  return ({
    'input.structdata': () => chooseFields(module === 'chunking' ? data.parsed : data.fields),
    'input.vectors': () => data.vector,
    'index_plan.vectors': () => data.vector.filter(value => [params(config,'indexing').vector_name,...(params(config,'indexing').vector_fields ?? [])].includes(value)),
    'index_plan.fulltext': () => Object.keys(data.indexed).filter(key => data.indexed[key].searchable).map(key => 'structdata.' + key),
    'candidate.document_fields': () => ['document_id',...chooseFields(data.indexed).map(key => 'structdata.' + key)],
    tokenizer_profiles: () => ['fixture'], profiles: () => ['text-v1'], elasticsearch_services: () => ['dev-search']
  })[spec.source]();
}

    <td><button class="btn small" data-action="remove-item" data-value="${key}" data-index="${index}" aria-label="移除此項">移除</button></td></tr>`).join('');
    const headings = schema.items.type === 'object' ? Object.entries(schema.items.properties).map(([sub,shape]) => `<th>${shape.title || labels[sub] || sub}</th>`).join('') : '<th>欄位</th>';
    return `<div class="field wide"><strong>${title}</strong>${rows ? `<div class="table-wrap"><table><thead><tr>${headings}<th></th></tr></thead><tbody>${rows}</tbody></table></div>` : ''}
      ${feedback}<div><button class="btn small" data-action="add-item" data-value="${key}">＋ 新增</button></div></div>`;
  }
  const attrs = `data-param="${key}" aria-label="${title}"`;
  return `<label class="field ${schema.multiline ? 'wide' : ''}">${title}${renderControl(schema,value,attrs,'/' + key,Boolean(error))}${feedback}</label>`;
}

function renderControl(schema,value,attrs,path,invalid = false) {
  const choices = optionValues(draft,selected,path) ?? schema.enum;
  if (choices) return selectField(value,choices,attrs);
  if (schema.type === 'boolean') return `<input type="checkbox" class="check" ${attrs} ${value ? 'checked' : ''}>`;
  if (schema.multiline) return `<textarea class="control" ${attrs} rows="4">${escapeHTML(value)}</textarea>`;
  const type = schema.type === 'integer' ? 'number' : 'text';
  return `<input ${attrs} class="control" type="${type}" ${schema.minimum === undefined ? '' : 'min="' + schema.minimum + '"'} value="${escapeHTML(value)}" aria-invalid="${invalid}">`;
}

function importFields(fields) {
  return `<div class="field wide"><strong>文件欄位</strong><div class="table-wrap"><table><thead><tr><th>欄位</th><th>型別</th><th>必填</th><th>全文</th><th>Filter</th><th></th></tr></thead><tbody>${Object.entries(fields).map(([name,data]) => {
    const attrs = `data-field="${escapeHTML(name)}"`;
    const flag = (key, label) => `<input type="checkbox" class="check" ${attrs} data-property="${key}" aria-label="${escapeHTML(name)} ${label}" ${data[key] ? 'checked' : ''}>`;
    return `<tr><td><input class="control" ${attrs} data-property="name" aria-label="${escapeHTML(name)} 欄位名稱" value="${escapeHTML(name)}"></td>
      <td><select class="control" ${attrs} data-property="type" aria-label="${escapeHTML(name)} 型別">${types.map(type => option(type,type,data.type === type)).join('')}</select></td>
      <td>${flag('required','必填')}</td><td>${flag('searchable','全文')}</td><td>${flag('filterable','Filter')}</td>
      <td><button class="btn small" data-action="remove-field" data-value="${escapeHTML(name)}" aria-label="移除 ${escapeHTML(name)}">移除</button></td></tr>`;
  }).join('')}</tbody></table></div><div>${makeButton('＋ 新增欄位','add-field','small')}</div></div>`;
}

function indexFields(overrides) {
  const {fields} = derive(draft);
  const choices = [[undefined,'沿用'],[true,'啟用'],[false,'停用']];
  return `<div class="field wide"><strong>索引欄位用途</strong><div class="table-wrap"><table><thead><tr><th>欄位</th><th>型別</th><th>全文</th><th>Filter</th></tr></thead><tbody>
  ${[...new Set([...Object.keys(fields),...Object.keys(overrides)])].map(key => {
    const control = (flag, label) => `<select class="control" data-index-field="${escapeHTML(key)}" data-property="${flag}" aria-label="${escapeHTML(key)} ${label}">${choices.map(([value,title]) =>
      option(value === undefined ? '' : String(value),title + (value === undefined && fields[key]?.[flag] ? '（啟用）' : ''),overrides[key]?.[flag] === value)).join('')}</select>`;
    return `<tr><td>${escapeHTML(key)}</td><td>${fields[key]?.type ?? '<span class="inline-error">已失效</span>'}</td><td>${control('searchable','全文')}</td><td>${control('filterable','Filter')}</td></tr>`;
  }).join('')}</tbody></table></div></div>`;
}

function markDirty() {
  draftDirty = true;
  checked = null;
  issues = [];
  const revision = $('page').querySelector('.flow-title .muted');
  if (revision) revision.textContent = '草稿 ' + current().draftRevision + ' · 未保存';
}

function saveDraft(system) {
  if (system === pendingSystem) {
    model.systems.push(system);
    pendingSystem = null;
  } else if (draftDirty) system.draftRevision++;
  if (!draftDirty) return;
  system.name = draftName.trim();
  system.draft = clone(draft);
  system.componentDrafts = clone(componentDrafts);
  draftDirty = false;
  persist();
}

function hasDraftName() {
  const input = $('system-name');
  if (draftName.trim()) return true;
  input.value = '';
  input.reportValidity();
  return false;
}

function fitsType(value, type) {
  if (type === 'number') return typeof value === 'number' && Number.isFinite(value);
  if (type === 'integer') return Number.isSafeInteger(value);
  if (type === 'string_array') return Array.isArray(value) && value.every(entry => typeof entry === 'string');
  if (type === 'date') return typeof value === 'string' && /^\d{4}-\d\d-\d\d$/.test(value) && validDate(value);
  if (type === 'datetime') return typeof value === 'string' && /^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?(?:Z|[+-]\d\d:\d\d)$/.test(value) && validDate(value.slice(0,10)) && Number.isFinite(Date.parse(value));
  return typeof value === type;
}

function validDate(value) {
  const time = new Date(value + 'T00:00:00Z');
  return Number.isFinite(time.getTime()) && time.toISOString().slice(0,10) === value;
}

function validateFilters(filters, config) {
  if (!Array.isArray(filters)) throw Error('Filter 須為陣列。');
  const {indexed} = derive(config);
  for (const [index,clause] of filters.entries()) {
    const where = '第 ' + (index + 1) + ' 組 Filter';
    record(clause,where);
    const group = Object.hasOwn(clause,'any');
    const conditions = group ? clause.any : [clause];
    if (!Array.isArray(conditions) || !conditions.length || (group && Object.keys(clause).length !== 1)) throw Error(where + '的 any 須包含至少一個條件。');
    for (const condition of conditions) {
      const {field,operator,value} = record(condition,where);
      const spec = typeof field === 'string' && field.startsWith('structdata.') ? Object.getOwnPropertyDescriptor(indexed,field.slice(11))?.value : null;
      if (!spec?.filterable) throw Error(where + '的欄位無法篩選：' + (field ?? '未指定'));
      if (Object.keys(condition).length !== 3 || !['eq','in','gt','gte','lt','lte'].includes(operator)) throw Error(where + '的操作符無效。');
      if (!['eq','in'].includes(operator) && !['integer','number','date','datetime'].includes(spec.type)) throw Error(where + '的欄位不支援範圍比對。');
      const values = operator === 'in' ? value : [value];
      if (!Array.isArray(values) || !values.length || !values.every(item => fitsType(item,spec.type === 'string_array' ? 'string' : spec.type))) {
        throw Error(where + '的值須符合 ' + spec.type + '。');
      }
    }
  }
}

function editableFilters(kind) {
  if (kind === 'fixed') return draft.pipelines.inference.fixed_filters ?? [];
  try { return JSON.parse(filterText); }
  catch { return filterText; }
}

function filterFields(config) {
  return Object.fromEntries(config ? Object.entries(derive(config).indexed)
    .filter(([,spec]) => spec.filterable).map(([name,spec]) => ['structdata.' + name,spec]) : []);
}

function filterEditor(kind, config) {
  const filters = editableFilters(kind);
  const fields = filterFields(config);
  const structured = Array.isArray(filters) && filters.every(item => object(item) && !Object.hasOwn(item,'any'));
  const title = kind === 'fixed' ? '固定 Filter' : '本次 Filter';
  return `<div class="field"><strong>${title}</strong>
    ${structured && filters.length ? `<div class="table-wrap"><table><thead><tr><th>欄位</th><th>條件</th><th>值</th><th></th></tr></thead><tbody>
      ${filters.map(({field,operator,value},index) => {
        const attrs = `data-filter="${kind}" data-index="${index}"`;
        const type = fields[field]?.type;
        const operators = ['number','integer','date','datetime'].includes(type) ? ['eq','in','gt','gte','lt','lte'] : ['eq','in'];
        const text = operator === 'in' || typeof value !== 'string' ? json(value) : value;
        return `<tr><td>${selectField(field,Object.keys(fields),attrs + ' data-filter-key="field" aria-label="Filter 欄位"')}</td>
          <td>${selectField(operator,operators,attrs + ' data-filter-key="operator" aria-label="Filter 條件"')}</td>
          <td><input class="control code" ${attrs} data-filter-key="value" aria-label="Filter 值" value="${escapeHTML(text)}" ${operator === 'in' ? 'placeholder="JSON 陣列"' : ''}></td>
          <td><button class="btn small" data-action="remove-filter" data-value="${kind}" data-index="${index}" aria-label="移除條件">移除</button></td></tr>`;
      }).join('')}</tbody></table></div>` : ''}
    ${structured && Object.keys(fields).length ? `<div><button class="btn small" data-action="add-filter" data-value="${kind}">＋ 新增條件</button></div>` : ''}
    <details ${structured ? '' : 'open'}><summary>編輯 Filter JSON</summary><label class="field">Filter 陣列<textarea class="control code" id="${kind === 'fixed' ? 'fixed-filters' : 'filter-text'}" rows="4">${escapeHTML(typeof filters === 'string' ? filters : json(filters))}</textarea></label></details></div>`;
}

function writeFilters(kind, filters, redraw) {
  if (kind === 'fixed') {
    draft.pipelines.inference.fixed_filters = filters;
    markDirty();
  } else filterText = json(filters);
  if (redraw) render();
  else {
    const editor = $(kind === 'fixed' ? 'fixed-filters' : 'filter-text');
    if (editor) editor.value = json(filters);
  }
}

function configIssues(config) {
  const result = [];
  const add = (module,key,message) => result.push({module,path:prefix(module) + '/' + key,message});
  const {input,fields} = derive(config);
  for (const module of Object.values(lanes).flat()) {
    const spec = baseline[module].parameters_schema;
    const values = params(config,module);
    for (const [key,shape] of Object.entries(spec.properties)) {
      const value = values[key];
      if (value === undefined && !spec.required.includes(key)) continue;
      const title = labels[key] || key;
      if (shape.type === 'string' && (typeof value !== 'string' || !value.trim())) add(module,key,title + '為必填。');
      if (shape.type === 'integer' && (!Number.isSafeInteger(value) || value < shape.minimum)) add(module,key,title + '須為不小於 ' + shape.minimum + ' 的整數。');
      const choices = optionValues(config,module,'/' + key);
      if (choices && value && !choices.includes(value)) add(module,key,title + '「' + value + '」已失效，請重新選擇。');
      if (shape.type === 'array' && Array.isArray(value)) {
        const allowed = optionValues(config,module,'/' + key + '/*');
        if (allowed && (new Set(value).size !== value.length || value.some(entry => !allowed.includes(entry)))) add(module,key,title + '含重複或失效選項。');
      }
    }
  }
  for (const [key,value] of Object.entries(input)) {
    if (!fieldName.test(key)) add('import','structdata','欄位「' + key + '」格式無效。');
    if (value.searchable && value.type !== 'string') add('import','structdata','只有字串欄位可做全文搜尋：' + key);
  }
  const chunk = params(config,'chunking');
  const output = [chunk.output_field,...chunk.copy_fields.map(row => row.output_field)];
  if (output.some(key => !fieldName.test(key)) || new Set(output).size !== output.length) add('chunking','copy_fields','輸出欄位須為有效名稱且不可重複。');
  if (chunk.copy_fields.some(row => !Object.hasOwn(input,row.source_field))) add('chunking','copy_fields','複製來源包含失效欄位。');
  if (chunk.overlap_tokens >= chunk.max_tokens) add('chunking','overlap_tokens','重疊長度須小於切分上限。');
  for (const [key,flags] of Object.entries(params(config,'indexing').structdata_overrides)) {
    if (!Object.hasOwn(fields,key)) add('indexing','structdata_overrides','索引欄位「' + key + '」已失效，請清除覆寫。');
    else if (flags.searchable && fields[key].type !== 'string') add('indexing','structdata_overrides','只有字串欄位可做全文搜尋：' + key);
  }
  try { validateFilters(config.pipelines.inference.fixed_filters ?? [],config); }
  catch (error) { result.push({module:'inference_input',path:'/config/pipelines/inference/fixed_filters',message:error.message}); }
  return result;
}

function orderedJSON(value) {
  if (Array.isArray(value)) return value.map(orderedJSON);
  if (object(value)) return Object.fromEntries(Object.keys(value).sort().map(key => [key,orderedJSON(value[key])]));
  return value;
}

function indexImpact(system, config) {
  if (system.indexIssue) return 'blocked';
  if (!system.active || !system.indexReady) return 'create';
  const fingerprint = value => JSON.stringify(orderedJSON(value.pipelines.ingestion));
  return fingerprint(config) === fingerprint(system.active) ? 'reuse' : 'rebuild_required';
}

function checkPublish(system) {
  if (!hasDraftName()) return;
  issues = Object.values(lanes).flat().filter(module => needsMoreRuntime(module,draft)).map(module => ({
    module, message:'此 Component 或設定尚未接入 W1 Runtime，可先保存草稿。'
  }));
  const effective = clone(draft);
  if (!issues.length) {
    // The draft also stores inactive options so switching between methods is reversible.
    for (const module of Object.values(lanes).flat()) {
      const properties = baseline[module].parameters_schema.properties;
      for (const key of Object.keys(params(effective,module))) {
        if (!Object.hasOwn(properties,key)) delete params(effective,module)[key];
      }
    }
    issues = configIssues(effective);
  }
  if (issues.length) {
    selected = issues[0].module;
    render();
    return;
  }
  const action = indexImpact(system,effective);
  checked = {action,validated:effective,expected:activeRevision(system)};
  const messages = {
    create:['建立索引','發布後建立空索引。完成初次匯入即可查詢。'],
    reuse:['沿用索引','這次發布會保留現有索引與資料。'],
    rebuild_required:['重建索引','發布後目前資料會清除，查詢將暫停，須重新匯入。'],
    blocked:['無法發布',system.indexIssue?.message]
  };
  const [title, description] = messages[action];
  const tone = action === 'blocked' ? 'bad' : action === 'rebuild_required' ? 'warn' : '';
  $('publish-impact').innerHTML = `<div class="info ${tone}"><strong>${title}</strong><p>${escapeHTML(description)}</p></div>`;
  $('publish-confirm').disabled = action === 'blocked';
  $('publish-confirm').textContent = action === 'rebuild_required' ? '重建並發布' : '確認發布';
  $('publish-confirm').className = action === 'rebuild_required' ? 'btn danger' : 'btn primary';
  $('publish').showModal();
}

function applyPublish(system) {
  if (!checked || checked.action === 'blocked') return;
  if (checked.expected !== activeRevision(system) || checked.action !== indexImpact(system,checked.validated)) {
    $('publish').close();
    notify('設定版本或索引狀態已變更，請重新驗證。');
    return;
  }
  if (system.runs.some(run => ['queued','running'].includes(run.status))) {
    $('publish').close();
    notify('資料匯入進行中。請待工作結束後重新發布。');
    return;
  }
  saveDraft(system);
  if (checked.action !== 'reuse') {
    system.initialized = false;
    system.documents = [];
    viewRun = null;
  }
  system.revision++;
  system.active = checked.validated;
  system.indexReady = true;
  batchPreview = null;
  queryResult = null;
  checked = null;
  $('publish').close();
  persist();
  render();
  notify('已發布 ' + activeRevision(system));
}

function ingestion(system) {
  const enabled = system.active && system.indexReady;
  const running = system.runs.some(run => ['queued','running'].includes(run.status));
  const run = viewRun ? system.runs.find(item => item.run_id === viewRun) ?? {run_id:viewRun,status:'unknown'} : system.runs[0];
  return `<div class="operation"><div class="stack"><section class="panel">
    <div class="bar"><h2>準備匯入</h2>${makeButton('載入範例','ingest-sample','small')}</div>
    ${!enabled ? '<div class="info warn">先發布系統設定，建立索引後即可匯入資料。</div>' : ''}
    <label class="field">上傳 CSV 或 JSON<input class="control" type="file" id="upload" accept=".csv,.json"></label>
    ${csv ? mapForm(system) : `<label class="field">Ingestion Request
    <textarea class="control code" id="ingest-json" rows="9" placeholder='{"documents": [...]}'>${escapeHTML(ingestText)}</textarea></label>`}
    ${ingestError ? `<div class="info bad" role="alert">${escapeHTML(ingestError)}</div>` : ''}
    ${batchPreview ? `<div id="batch-summary"><div class="info" role="status">預檢通過 · ${batchPreview.documents.length} 份文件${csv && system.documents.length ? ' · 將替換目前索引資料' : ''}</div>
      ${analysisPanel('預覽 Request',batchPreview)}</div>` : ''}
    <div class="toolbar"><button class="btn" data-action="preview-batch" ${!enabled ? 'disabled' : ''}>預檢資料</button>
      <button class="btn primary" data-action="start-run" ${!enabled || running || !batchPreview ? 'disabled' : ''}>開始匯入</button></div>
    <details><summary>API 端點</summary><pre>POST ${apiRoot(system)}/ingestions
GET  ${apiRoot(system)}/ingestions/{run_id}</pre></details>
    </section>
    ${run ? renderRun(run) : ''}</div>
    <aside class="panel"><h2>匯入紀錄</h2>
    <form id="run-lookup"><label class="field">查詢 Run ID<input class="control code" name="run_id" placeholder="ing-001" required></label>
      <div class="toolbar"><button class="btn small">查詢工作</button></div></form>
    ${system.runs.length ? system.runs.map(item => `<div class="summary-row"><button class="quiet" data-action="run" data-value="${item.run_id}">${item.run_id}</button>${runBadge(item.status)}</div>`).join('') : '<p class="empty">尚無匯入紀錄</p>'}</aside></div>`;
}

const apiRoot = system => '/internal/systems/' + system.id + '/v1';
const runBadge = value => badge(status[value], value === 'completed' ? 'good' : ['failed','unknown'].includes(value) ? 'bad' : 'warn');

function renderRun(run) {
  if (run.status === 'unknown') return `<section class="panel" aria-label="匯入結果"><div class="bar"><h2>工作結果</h2>${runBadge(run.status)}</div>
    <p class="muted">找不到工作 ${escapeHTML(run.run_id)}，或紀錄已到期。</p></section>`;
  return `<section class="panel" aria-label="匯入結果"><div class="bar"><h2>工作結果</h2>${runBadge(run.status)}</div>
    <p class="muted">${run.run_id} · ${run.config_revision} · ${run.documents.length} 份文件</p>
    <p class="muted">成功 ${run.documents.filter(item => item.status === 'completed').length} · 失敗 ${run.documents.filter(item => item.status === 'failed').length}</p>
    <div class="table-wrap"><table><thead><tr><th>文件 ID</th><th>狀態</th><th>詳細</th></tr></thead><tbody>${run.documents.map(item => `<tr><td>${escapeHTML(item.document_id)}</td>
    <td>${runBadge(item.status)}</td><td>${escapeHTML(item.error?.message || '—')}</td></tr>`).join('')}</tbody></table></div></section>`;
}

function parseCSV(text) {
  const rows = [];
  let row = [], value = '', state = 'start';
  const pushCell = () => { row.push(value); value = ''; state = 'start'; };
  const pushRow = () => { pushCell(); rows.push(row); row = []; };
  text = text.replace(/^\uFEFF/, '');
  for (let index=0; index<text.length; index++) {
    const char = text[index];
    if (state === 'quoted') {
      if (char === '"' && text[index+1] === '"') { value += '"'; index++; }
      else if (char === '"') state = 'closed';
      else value += char;
    } else if (char === ',') pushCell();
    else if (char === '\n' || char === '\r') {
      if (char === '\r' && text[index+1] === '\n') index++;
      pushRow();
    } else if (char === '"' && state === 'start') state = 'quoted';
    else if (char === '"' || state === 'closed') throw Error('CSV 引號格式錯誤。');
    else { value += char; state = 'unquoted'; }
  }
  if (state === 'quoted') throw Error('CSV 含未結束的引號。');
  if (state !== 'start' || row.length) pushRow();
  const headers = (rows.shift() ?? []).map(value => value.trim());
  if (!headers.length || headers.some(value => !value) || new Set(headers).size !== headers.length) throw Error('CSV 欄名須為非空且不得重複。');
  if (!rows.length) throw Error('CSV 沒有資料列。');
  for (const [index,values] of rows.entries()) if (values.length !== headers.length) throw Error('CSV 第 ' + (index+2) + ' 列的欄位數不符。');
  return {headers,rows};
}

function mapTargets(config) {
  return [['document_id',{type:'string',required:false}],['source_revision',{type:'string',required:false}],['metadata',{type:'object',required:false}],
    ...Object.entries(params(config,'import').structdata).map(([key,field]) => ['structdata.' + key,field])];
}

function mapForm(system) {
  if (!system.active) return '<p class="info warn">發布設定後即可映射 CSV。</p>';
  return `<div class="field"><strong>CSV 欄位映射 · ${csv.rows.length} 列</strong><div class="table-wrap"><table><thead><tr><th>Document 欄位</th><th>CSV 欄位</th></tr></thead><tbody>
    ${mapTargets(system.active).map(([target,spec]) => `<tr><td>${escapeHTML(target)}${spec.required ? ' *' : ''}</td><td><select class="control" data-mapping="${escapeHTML(target)}" aria-label="${escapeHTML(target)} CSV 欄位">
    ${option('', target === 'document_id' ? '自動產生' : '未映射', !mapping[target])}${csv.headers.map(header => option(header,header,mapping[target] === header)).join('')}</select></td></tr>`).join('')}
    </tbody></table></div>${makeButton('改用 JSON 輸入','use-json','small')}</div>`;
}

function mapCSV(config) {
  const targets = mapTargets(config);
  for (const [target,spec] of targets) if (spec.required && !mapping[target]) throw Error('請映射必填欄位 ' + target + '。');
  const documents = csv.rows.map((row,index) => {
    const entries = [];
    const fields = [];
    for (const [target,spec] of targets) {
      if (!mapping[target]) continue;
      const text = row[csv.headers.indexOf(mapping[target])];
      if (!text.trim() && !spec.required) continue;
      let value = text;
      if (['number','integer','boolean','string_array','object'].includes(spec.type)) {
        try { value = JSON.parse(text); }
        catch { throw Error('CSV 第 ' + (index+2) + ' 列的 ' + target + ' 需符合 ' + spec.type + '。'); }
      }
      if (!(spec.type === 'object' ? object(value) : fitsType(value,spec.type))) throw Error('CSV 第 ' + (index+2) + ' 列的 ' + target + ' 需符合 ' + spec.type + '。');
      if (target.startsWith('structdata.')) fields.push([target.slice(11),value]);
      else entries.push([target,value]);
    }
    return {document_id:'row-' + (index+1),...Object.fromEntries(entries),structdata:Object.fromEntries(fields)};
  });
  return {documents};
}

function checkBatch(batch, config) {
  record(batch,'Ingestion Request');
  if (Object.keys(batch).some(key => !['documents','parameters'].includes(key))) throw Error('Ingestion Request 僅接受 documents 和 parameters。');
  if (!Array.isArray(batch.documents) || !batch.documents.length) throw Error('documents 須包含至少一份文件。');
  if (Object.hasOwn(batch,'parameters')) record(batch.parameters,'parameters');
  const specs = params(config,'import').structdata;
  const seen = new Set();
  for (const [index,doc] of batch.documents.entries()) {
    const name = '第 ' + (index+1) + ' 份文件';
    record(doc,name);
    if (typeof doc.document_id !== 'string' || !doc.document_id.trim()) throw Error(name + '缺少 document_id。');
    const display = '文件 ' + doc.document_id;
    if (seen.has(doc.document_id)) throw Error(display + '重複。');
    seen.add(doc.document_id);
    if (Object.keys(doc).some(key => !['document_id','source_revision','structdata','metadata'].includes(key))) throw Error(display + '含此 JSON 入口未支援的欄位。');
    if (Object.hasOwn(doc,'source_revision') && (typeof doc.source_revision !== 'string' || !doc.source_revision.trim())) throw Error(display + '的 source_revision 須為非空字串。');
    if (Object.hasOwn(doc,'metadata')) record(doc.metadata,'metadata');
    const fields = record(doc.structdata,display + '的 structdata');
    for (const key of Object.keys(fields)) if (!Object.hasOwn(specs,key)) throw Error(display + '的 ' + key + ' 未在 Import 宣告。');
    for (const [key,spec] of Object.entries(specs)) {
      if (!Object.hasOwn(fields,key) && spec.required) throw Error(display + '缺少必填欄位 ' + key + '。');
      if (Object.hasOwn(fields,key) && !fitsType(fields[key],spec.type)) throw Error(display + '的 ' + key + ' 須符合 ' + spec.type + '。');
    }
  }
}

function previewBatch(system) {
  try {
    const batch = csv ? mapCSV(system.active) : JSON.parse(ingestText);
    checkBatch(batch,system.active);
    batchPreview = batch;
    ingestError = '';
  } catch (error) {
    batchPreview = null;
    ingestError = error instanceof SyntaxError ? '請輸入有效的 JSON。' : error.message;
  }
  render();
}

function startRun(system) {
  if (!batchPreview || !system.active || !system.indexReady || system.runs.some(run => ['queued','running'].includes(run.status))) return;
  if (csv && system.documents.length && !confirm('這次 CSV 匯入會替換目前索引中的所有文件。繼續？')) return;
  if (csv) { system.documents = []; system.initialized = false; }
  const run = {
    run_id:'ing-' + (system.runs.length+1).toString().padStart(3,'0'), status:'queued',
    config_revision:activeRevision(system), started:Date.now(), payload:clone(batchPreview.documents),
    documents:batchPreview.documents.map(doc => ({document_id:doc.document_id,status:'queued'}))
  };
  system.runs.unshift(run);
  if (csv) system.mapping = clone(mapping);
  viewRun = run.run_id;
  batchPreview = null;
  if(!system.initialized) queryResult = null;
  persist();
  render();
  notify('已接受匯入工作 ' + run.run_id);
  pollRuns();
}

function pollRuns() {
  if (polling) return;
  polling = true;
  const tick = () => {
    let changed = false, pending = false;
    for (const system of model.systems) for (const run of system.runs) {
      if (!['queued','running'].includes(run.status)) continue;
      const age = Date.now() - run.started;
      const next = age >= 1700 ? 'completed' : age >= 550 ? 'running' : 'queued';
      if (next !== run.status) {
        run.status = next;
        for (const item of run.documents) item.status = next;
        if (next === 'completed') {
          const newDocs = new Map(system.documents.map(doc => [doc.document_id,doc]));
          for (const doc of run.payload) newDocs.set(doc.document_id,{...doc,source_revision:doc.source_revision ?? run.run_id});
          system.documents = [...newDocs.values()];
          system.initialized = true;
          delete run.payload;
        }
        changed = true;
      }
      if (next !== 'completed') pending = true;
    }
    if (changed) {
      persist();
      if (!current() || screen === 'ingest') {
        const focus = document.activeElement;
        if (!focus || !focus.matches('input,textarea,select')) render();
        else if (viewRun) {
          const run = current()?.runs.find(item => item.run_id === viewRun);
          const panel = $('page').querySelector('[aria-label="匯入結果"]');
          if (panel && run) panel.outerHTML = renderRun(run);
        }
      }
    }
    if (pending) setTimeout(tick,250);
    else polling = false;
  };
  tick();
}

function inference(system) {
  const available = system.active && system.indexReady && system.initialized;
  const fixed = system.active?.pipelines.inference.fixed_filters ?? [];
  const fields = system.active ? Object.entries(derive(system.active).indexed).filter(([,spec]) => spec.filterable) : [];
  const items = queryResult?.contexts.flatMap(context => context.result_sets.flatMap(set => set.items)) ?? [];
  return `<div class="operation"><div class="stack"><section class="panel">
    <div class="bar"><h2>查詢測試</h2>${makeButton('載入範例','query-sample','small')}</div>
    ${!available ? '<div class="info warn">完成初次匯入後即可查詢。</div>' : ''}
    <label class="field">問題<textarea class="control" id="query-text" rows="3" placeholder="輸入要搜尋的問題">${escapeHTML(queryText)}</textarea></label>
    ${filterEditor('query',system.active)}
    ${queryError ? `<div class="info bad" role="alert">${escapeHTML(queryError)}</div>` : ''}
    <div class="toolbar"><button class="btn primary" data-action="query" ${available ? '' : 'disabled'}>執行查詢</button></div>
    <details><summary>API 端點</summary><pre>POST ${apiRoot(system)}/queries</pre></details></section>
    ${queryResult ? `<section class="panel" aria-label="查詢結果"><div class="bar"><h2>檢索結果</h2><small>${queryResult.revision} · ${items.length} 筆結果</small></div>
      ${items.length ? items.map(({data,score},index) => `<article class="result"><div class="bar"><h3>${index+1}. ${escapeHTML(data.structdata.title ?? data.document_id)}</h3>
        ${score === undefined ? '' : badge(score.toFixed(3))}</div><p>${escapeHTML(data.structdata[params(system.active,'embedding').source_field])}</p>
        <small>來源 ${escapeHTML(data.document_id)} · ${escapeHTML(data.source_revision)}</small></article>`).join('') : '<p class="empty">沒有符合條件的結果。</p>'}
      ${analysisPanel('查看回應 JSON',queryResult.contexts)}</section>` : ''}</div>
    <aside class="panel"><h2>篩選設定</h2>
      ${fixed.length ? analysisPanel('固定 Filter · ' + fixed.length + ' 組',fixed) : '<p class="empty">尚無固定 Filter</p>'}
      ${fields.length ? `<hr><h3>可篩選欄位</h3>${fields.map(([name,spec]) => `<div class="summary-row"><code>${escapeHTML(name)}</code><small>${spec.type}</small></div>`).join('')}` : ''}
    </aside></div>`;
}

function matchFilters(fields, filters, config) {
  const {indexed} = derive(config);
  const match = ({field,operator,value}) => {
    const key = field.slice(11);
    if (!Object.hasOwn(fields,key)) return false;
    const actual = fields[key];
    if (operator === 'eq' || operator === 'in') {
      const candidates = operator === 'eq' ? [value] : value;
      return (Array.isArray(actual) ? actual : [actual]).some(item => candidates.some(candidate => normalize(item) === normalize(candidate)));
    }
    const left = normalize(actual), right = normalize(value);
    return {lt:left < right,lte:left <= right,gt:left > right,gte:left >= right}[operator];

    function normalize(item) {
      return indexed[key].type === 'datetime' ? Date.parse(item) : item;
    }
  };
  return filters.every(clause => Object.hasOwn(clause,'any') ? clause.any.some(match) : match(clause));
}

function tokens(text) {
  const chunks = String(text ?? '').toLowerCase().match(/\p{Script=Han}+|[\p{L}\p{N}]+/gu) ?? [];
  return new Set(chunks.flatMap(chunk => {
    const characters = Array.from(chunk);
    return characters.length > 1 && /^\p{Script=Han}+$/u.test(chunk)
      ? characters.slice(1).map((char,index) => characters[index] + char)
      : [chunk];
  }));
}

function query(system) {
  try {
    const question = queryText.trim();
    if (!question) throw Error('請輸入查詢問題。');
    const dynamic = JSON.parse(filterText.trim() || '[]');
    validateFilters(dynamic,system.active);
    const filters = [...(system.active.pipelines.inference.fixed_filters ?? []),...dynamic];
    const chunk = params(system.active,'chunking');
    const embedding = params(system.active,'embedding');
    const retrieve = params(system.active,'retrieval');
    const terms = tokens(question);
    const candidates = system.documents.flatMap(doc => {
      const source = doc.structdata[chunk.split_field];
      const fields = Object.fromEntries([[chunk.output_field,source],...chunk.copy_fields.filter(row => Object.hasOwn(doc.structdata,row.source_field)).map(row => [row.output_field,doc.structdata[row.source_field]])]);
      if (!matchFilters(fields,filters,system.active)) return [];
      const words = tokens(fields[embedding.source_field]);
      const hits = [...terms].filter(term => words.has(term)).length;
      if (!hits) return [];
      const data = {document_id:doc.document_id,source_revision:doc.source_revision,data_id:doc.document_id + '-1',structdata:fields};
      if (doc.metadata) data.metadata = doc.metadata;
      return [{data,score:hits/terms.size}];
    }).sort((left,right) => right.score - left.score);
    const seen = new Set();
    const items = candidates.filter(({data}) => {
      if (!retrieve.group_by?.length) return true;
      const key = json(retrieve.group_by.map(field => field === 'document_id' ? data.document_id : data.structdata[field.slice(11)]));
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    }).slice(0,retrieve.per_route_k);
    queryResult = {revision:activeRevision(system),contexts:[{ori_query:question,query:question,filters,result_sets:[{key:'retrieval',items}],metadata:{}}]};
    queryError = '';
  } catch (error) {
    queryResult = null;
    queryError = error instanceof SyntaxError ? '本次 Filter 請輸入有效的 JSON。' : error.message;
  }
  render();
}

let uploadRevision = 0;

async function readUpload(file) {
  const readRevision = ++uploadRevision;
  const systemId = id;
  batchPreview = null; ingestError = '';
  try {
    if (file.size > 1024 * 1024) throw Error('檔案大小超過 1 MB。');
    const text = await file.text();
    if (readRevision !== uploadRevision || systemId !== id || screen !== 'ingest') return;
    if (/\.csv$/i.test(file.name)) {
      csv = parseCSV(text);
      mapping = Object.fromEntries(mapTargets(current().active ?? current().draft).flatMap(([target]) => {
        const previous = current().mapping?.[target];
        const best = [previous,target,target.replace(/^structdata\./,'')].find(value => csv.headers.includes(value));
        return best ? [[target,best]] : [];
      }));
    } else { ingestText = text.replace(/^\uFEFF/,''); csv = null; }
  } catch (error) {
    if (readRevision !== uploadRevision || systemId !== id || screen !== 'ingest') return;
    ingestError = error.message;
  }
  render();
}

function download(system) {
  const file = new Blob([json({system_id:system.id,config_revision:activeRevision(system),config:system.active}) + '\n'],{type:'application/json'});
  const url = URL.createObjectURL(file);
  const link = document.createElement('a');
  link.href = url;
  link.download = system.id + '.json';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url),1000);
}

const systemDialog = $('system-dialog');

function canCloseSystem() {
  return !draftDirty || confirm('捨棄尚未保存的設定？');
}

systemDialog.addEventListener('cancel',event => {
  if (!canCloseSystem()) event.preventDefault();
});

systemDialog.addEventListener('close',() => {
  pendingSystem = null;
  draftDirty = false;
  id = null;
  uploadRevision++;
  renderWorkspace();
});

document.addEventListener('submit',event => {
  if (event.target.id !== 'run-lookup') return;
  event.preventDefault();
  viewRun = event.target.elements.run_id.value.trim() || null;
  render();
});

document.addEventListener('click',event => {
  const button = event.target.closest('button[data-action]');
  if (!button || button.disabled) return;
  const {action,value,index} = button.dataset;
  const system = current();
  switch(action) {
    case 'workspace': workspace = Number(value); renderWorkspace(); return;
    case 'system': openSystem(value,button.dataset.view); return;
    case 'open-create':
      pendingSystem = makeSystem('',workspace);
      openSystem(pendingSystem.id);
      $('system-name').focus();
      return;
    case 'close-dialog': {
      const dialog = button.closest('dialog');
      if (dialog !== systemDialog || canCloseSystem()) dialog.close();
      return;
    }
    case 'module': selected = value; render(); return;
    case 'save':
      if (!hasDraftName()) return;
      saveDraft(system);
      render();
      notify('已保存草稿');
      return;
    case 'validate': checkPublish(system); return;
    case 'publish': applyPublish(system); return;
    case 'download': download(system); return;
    case 'add-field': {
      const fields = params(draft,'import').structdata;
      let number = 1;
      while (Object.hasOwn(fields,'field_' + number)) number++;
      fields['field_' + number] = {type:'string',required:false};
      break;
    }
    case 'remove-field': delete params(draft,'import').structdata[value]; break;
    case 'add-filter': {
      const fields = filterFields(value === 'fixed' ? draft : system.active);
      const field = Object.keys(fields)[0];
      const filters = editableFilters(value);
      if (!field || !Array.isArray(filters)) { render(); return; }
      const today = new Date().toISOString().slice(0,10);
      const fallback = {integer:0,number:0,boolean:false,date:today,datetime:today + 'T00:00:00Z'};
      writeFilters(value,[...filters,{field,operator:'eq',value:fallback[fields[field].type] ?? ''}],true);
      return;
    }
    case 'remove-filter': {
      const filters = editableFilters(value);
      if (!Array.isArray(filters)) { render(); return; }
      filters.splice(Number(index),1);
      writeFilters(value,filters,true);
      return;
    }
    case 'add-item': {
      const parameters = params(draft,selected);
      const shape = descriptor(selected,draft).parameters_schema.properties[value].items;
      const initial = field => field.enum?.[0] ?? (field.type === 'boolean' ? false : field.minimum ?? '');
      (parameters[value] ??= []).push(shape.type === 'object'
        ? Object.fromEntries(Object.entries(shape.properties).map(([key,field]) => [key,initial(field)]))
        : initial(shape));
      break;
    }
    case 'remove-item': {
      const parameters = params(draft,selected);
      parameters[value].splice(Number(index),1);
      if (!parameters[value].length && !descriptor(selected,draft).parameters_schema.required.includes(value)) delete parameters[value];
      break;
    }
    case 'ingest-sample': uploadRevision++; csv = null; ingestText = json(fixture.ingestion); ingestError = ''; batchPreview = null; render(); return;
    case 'use-json': uploadRevision++; csv = null; batchPreview = null; ingestError = ''; render(); return;
    case 'preview-batch': previewBatch(system); return;
    case 'start-run': startRun(system); return;
    case 'run': viewRun = value; render(); return;
    case 'query-sample': queryText = fixture.query.query; filterText = json(fixture.query.filters ?? []); queryError = ''; queryResult = null; render(); return;
    case 'query': if (system.active && system.indexReady && system.initialized) query(system); return;
    default: return;
  }
  markDirty();
  render();
});

function changeParameter(input) {
  const {param,row,column} = input.dataset;
  const values = params(draft,selected);
  const value = input.type === 'checkbox' ? input.checked : input.type === 'number' ? (input.value ? Number(input.value) : null) : input.value;
  if (row === undefined) values[param] = value;
  else if (column) values[param][Number(row)][column] = value;
  else values[param][Number(row)] = value;
  markDirty();
}

function changeRemote(input) {
  const key = input.dataset.remote;
  const currentNode = node(draft,selected);
  if (key === 'service_ref' || key === 'through') currentNode[key] = input.value;
  else if (key === 'parameters' || key === 'structdata' || key === 'vectors') {
    let value;
    try { value = JSON.parse(input.value); }
    catch { value = input.value; }
    if (key === 'parameters') currentNode.parameters = value;
    else currentNode.output[key] = value;
  } else currentNode.connection[key] = input.type === 'number' ? (input.value ? Number(input.value) : null) : input.value;
  markDirty();
}

document.addEventListener('input',event => {
  const input = event.target;
  if (input.id === 'system-name') {
    draftName = input.value;
    markDirty();
  }
  if (input.dataset.param !== undefined) changeParameter(input);
  if (input.dataset.remote && input.dataset.remote !== 'through') changeRemote(input);
  if (input.id === 'fixed-filters') {
    try { draft.pipelines.inference.fixed_filters = JSON.parse(input.value); }
    catch { draft.pipelines.inference.fixed_filters = input.value; }
    markDirty();
  }
  if (input.id === 'ingest-json') {
    ingestText = input.value;
    batchPreview = null;
    $('batch-summary')?.remove();
    $('page').querySelector('[data-action="start-run"]').disabled = true;
  }
  if (input.id === 'query-text') queryText = input.value;
  if (input.id === 'filter-text') filterText = input.value;
});

document.addEventListener('change',event => {
  const input = event.target;
  if (input.id === 'component-picker') {
    chooseComponent(input.value);
    return;
  }
  if (input.dataset.remote === 'through') {
    changeRemote(input);
    render();
    return;
  }
  if (['persistence','service_source','compose_text','fusion','include_original','count','vector_name','vector_fields','fulltext_fields'].includes(input.dataset.param)) {
    if (selected === 'retrieval' || !['vector_fields','vector_name','fulltext_fields'].includes(input.dataset.param)) render();
  }
  if (input.dataset.filter) {
    const {filter,filterKey,index} = input.dataset;
    const filters = editableFilters(filter);
    const condition = Array.isArray(filters) ? filters[Number(index)] : null;
    if (!object(condition) || Object.hasOwn(condition,'any')) { render(); return; }
    if (filterKey === 'value') {
      const type = filterFields(filter === 'fixed' ? draft : current().active)[condition.field]?.type;
      if (condition.operator === 'in' || ['number','integer','boolean'].includes(type)) {
        try { condition.value = JSON.parse(input.value); }
        catch { condition.value = input.value; }
      } else condition.value = input.value;
    } else {
      condition[filterKey] = input.value;
      if (filterKey === 'field') condition.operator = 'eq';
      if (filterKey === 'operator' && input.value === 'in') condition.value = Array.isArray(condition.value) ? condition.value : [condition.value];
      else if (Array.isArray(condition.value)) condition.value = condition.value[0] ?? '';
    }
    writeFilters(filter,filters,filterKey !== 'value');
    return;
  }
  const {field,indexField,property} = input.dataset;
  if (field !== undefined) {
    const fields = params(draft,'import').structdata;
    if (property === 'name') {
      const name = input.value.trim();
      if (name === field) return;
      if (!fieldName.test(name) || Object.hasOwn(fields,name)) {
        input.value = field;
        notify('欄位名稱須合法且不可重複。');
        return;
      }
      params(draft,'import').structdata = Object.fromEntries(Object.entries(fields).map(([key,entry]) => [key === field ? name : key,entry]));
      input.dataset.field = name;
      const row = input.closest('tr');
      row.querySelectorAll('[data-field]').forEach(element => { element.dataset.field = name; });
      row.querySelector('[data-action="remove-field"]').dataset.value = name;
    } else fields[field][property] = input.type === 'checkbox' ? input.checked : input.value;
    markDirty();
  }
  if (indexField !== undefined) {
    const overrides = params(draft,'indexing').structdata_overrides;
    const value = {...(Object.hasOwn(overrides,indexField) ? overrides[indexField] : {})};
    if (input.value === '') delete value[property];
    else value[property] = input.value === 'true';
    if (Object.keys(value).length) Object.defineProperty(overrides,indexField,{value,enumerable:true,writable:true,configurable:true});
    else delete overrides[indexField];
    markDirty();
  }
  if (input.id === 'upload' && input.files.length) readUpload(input.files[0]);
  if (input.dataset.mapping !== undefined) {
    mapping[input.dataset.mapping] = input.value;
    batchPreview = null;
    ingestError = '';
    render();
  }
});

document.addEventListener('toggle',event => {
  if (event.target.id === 'advanced') detailOpen = event.target.open;
},true);

window.addEventListener('beforeunload',event => {
  if (!draftDirty) return;
  event.preventDefault();
  event.returnValue = true;
});

if (!stored) {
  const samples = [
    ['Customer Support Retrieval',0,'customer-support',true],
    ['Product FAQ',0,'product-faq',true],
    ['Service Handbook',0,'service-handbook',false],
    ['Engineering Knowledge',1,'engineering-knowledge',false]
  ];
  for (const [name,group,systemId,ready] of samples) {
    const system = makeSystem(name,group,systemId);
    system.active = clone(fixture.config);
    system.revision = 1;
    system.indexReady = true;
    system.initialized = ready;
    system.documents = ready ? fixture.ingestion.documents.map(doc => ({...doc,source_revision:'source-1'})) : [];
    model.systems.push(system);
  }
  persist();
}
render();
pollRuns();
</script>
