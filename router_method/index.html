<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Retrieval Router MVP</title>
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <aside class="sidebar" aria-label="Workspace 導覽">
    <div class="brand"><span class="brand-mark" aria-hidden="true">r</span> Retrieval Router</div>
    <h2 class="sidebar-label" id="workspace-label">Workspaces</h2>
    <nav id="workspace-list" aria-labelledby="workspace-label"></nav>
    <span class="environment">本機 MVP</span>
  </aside>

  <main class="main">
    <header class="workspace-header">
      <p class="crumb" id="breadcrumb">Workspaces</p>
      <nav class="page-nav" aria-label="模式切換">
        <button type="button" data-page="user" aria-current="page">User</button>
        <button type="button" data-page="provider">Provider</button>
      </nav>
      <button type="button" class="button primary" id="create-system" disabled>＋ Create Retrieval System</button>
      <button type="button" class="button primary" id="create-provider" hidden disabled>＋ Provide Retrieval System Template</button>
    </header>
    <p id="load-error" class="notice error" role="alert" hidden></p>
    <p id="workspace-message" class="notice" role="status" hidden></p>

    <section id="user-page">
      <div class="workspace-heading">
        <h1 id="workspace-name">Retrieval Systems</h1>
        <p id="system-count" class="muted"></p>
      </div>
      <div id="system-list" class="cards"></div>
    </section>

    <section id="provider-page" hidden>
      <div class="workspace-heading provider-heading">
        <div>
          <h1>Retrieval System Templates</h1>
          <p id="provider-count" class="muted"></p>
        </div>
        <a class="button secondary guide-link" href="/provider-guide" target="_blank" rel="noopener">使用說明 ↗</a>
      </div>
      <div id="provider-list" class="cards"></div>
    </section>
  </main>

  <dialog id="provider-dialog" class="wide-dialog" aria-labelledby="provider-dialog-title">
    <header class="dialog-header">
      <h2 id="provider-dialog-title">Provide Retrieval System Template</h2>
      <button type="button" class="icon-button" data-close aria-label="關閉">×</button>
    </header>
    <div class="provider-layout dialog-body">
        <form id="provider-form" class="panel provider-form">
          <header class="panel-heading">
            <h2>新增 Retrieval Service</h2>
            <p>System Description</p>
          </header>
          <label class="field">
            <span>System 名稱 <span class="required-mark">*</span></span>
            <input id="provider-name" name="system_name" placeholder="例如產品文件檢索" required>
          </label>
          <div id="provider-apis" class="provider-apis"></div>
          <label class="field">
            <span>Config Schema <span class="required-mark">*</span></span>
            <textarea id="config-schema" class="code-input" rows="12" spellcheck="false" required></textarea>
          </label>
          <div class="form-actions">
            <div class="form-resources">
              <a href="/provider-guide" target="_blank" rel="noopener">使用說明 ↗</a>
              <a href="/config-schema.meta.schema.json" target="_blank" rel="noopener">檢視 Meta Schema ↗</a>
            </div>
            <div class="form-buttons">
              <button type="button" class="button secondary" id="fill-demo">重載範例</button>
              <button type="submit" id="publish-provider" class="button primary">上架服務</button>
            </div>
          </div>
          <p id="provider-message" class="notice" role="status" hidden></p>
        </form>

        <aside class="provider-side">
          <section class="panel preview-panel" aria-labelledby="preview-title">
            <header class="panel-heading">
              <h2 id="preview-title">User 表單預覽</h2>
              <p>依 Config Schema 即時更新。</p>
            </header>
            <div id="schema-preview" aria-live="polite"></div>
          </section>
        </aside>
    </div>
  </dialog>

  <dialog id="operation-dialog" class="wide-dialog" aria-labelledby="operation-title">
    <header class="dialog-header">
      <div>
        <h2 id="operation-title"></h2>
        <p id="operation-subtitle"></p>
      </div>
      <button type="button" class="icon-button" data-close aria-label="關閉">×</button>
    </header>
    <section id="workbench" aria-label="System 操作區"></section>
  </dialog>

  <dialog id="create-dialog" aria-labelledby="create-dialog-title">
    <form id="system-form" class="dialog-form">
      <header class="dialog-header">
        <div>
          <h2 id="create-dialog-title">Create Retrieval System</h2>
          <p id="system-dialog-description">選擇 Provider Template 並填寫初始化設定。</p>
        </div>
        <button type="button" class="icon-button" data-close aria-label="關閉">×</button>
      </header>
      <div class="dialog-body">
        <label class="field">
          <span>Provider <span class="required-mark">*</span></span>
          <select id="system-provider"></select>
        </label>
        <label class="field">
          <span>System 名稱 <span class="required-mark">*</span></span>
          <input id="system-name" placeholder="例如產品保固知識庫" required>
        </label>
        <div id="system-config" class="dialog-config"></div>
        <p id="system-error" class="notice error" role="alert" hidden></p>
      </div>
      <footer class="dialog-footer">
        <button type="button" class="button secondary" data-close>取消</button>
        <button type="submit" class="button primary" id="publish-system">建立並初始化</button>
      </footer>
    </form>
  </dialog>
</body>
</html>
