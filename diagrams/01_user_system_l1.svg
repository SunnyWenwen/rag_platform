<svg xmlns="http://www.w3.org/2000/svg" width="2360" height="1370" viewBox="0 0 2360 1370" role="img" aria-labelledby="title desc">
<title id="title">RAG Builder 測試、共用 Engine 與四步 Component 開發流程</title>
<desc id="desc">上方為 RAG Builder User 的測試區塊，Build 產出 Config，Config 與共用 Engine 建立測試 System。框外的 YAML 部署與共用 Engine 建立 k8s System。中間為 RAG Engine，提供可選 Module／Component 的連線直接指向 Build。下方為 RAG Engine Developer 的開發區塊，依序選 Module／讀契約、開發 Component、測試與 PR 審查、發布並更新 Runtime；角色名稱標示於區塊標題。實線為操作流程與發布，虛線為設定、產出及共用能力。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#66788b"/></marker></defs>
<style>
text{font-family:'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei',sans-serif;font-weight:400;text-anchor:middle;dominant-baseline:central;fill:#143054}
.step rect{fill:#e9f2ff;stroke:#6086c8}.object rect{fill:#ecf8f2;stroke:#599d85}.object text{fill:#153f32}
.deploy rect{fill:#fff5e5;stroke:#cf9b4a}.deploy text{fill:#624516}.engine rect{fill:#eee9fa;stroke:#9380bf}.engine text{fill:#443267}
.node rect{stroke-width:1.8}.edge{fill:none;stroke:#60768e;stroke-width:2;marker-end:url(#arrow)}
.relation{stroke:#66788b;stroke-dasharray:7 7}.edge-label{fill:#485d71;stroke:white;stroke-width:11;stroke-linejoin:round;paint-order:stroke fill}
.frame-title{font-size:26;text-anchor:start;font-weight:500}.note{font-size:18;fill:#66788b}
</style><rect width="2360" height="1370" fill="white"/>
<g id="BUILDER" class="frame"><rect x="30" y="35" width="1700" height="700" rx="12" fill="#f7faff" stroke="#9aafc9" stroke-width="1.8"/><text class="frame-title" x="55" y="65">RAG Builder 測試（for RAG Builder User）</text></g>
<g id="ENGINE" class="frame"><rect x="30" y="830" width="2250" height="180" rx="12" fill="#f7f4fc" stroke="#b5a4d0" stroke-width="1.8"/><text class="frame-title" x="55" y="860">RAG Engine</text></g>
<g id="DEVELOPMENT" class="frame"><rect x="30" y="1110" width="2250" height="200" rx="12" fill="#faf8fd" stroke="#b5a4d0" stroke-width="1.8"/><text class="frame-title" x="55" y="1140">RAG Engine 開發（for RAG Engine Developer）</text></g>
