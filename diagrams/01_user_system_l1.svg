<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="926" viewBox="0 0 1800 926" role="img" aria-labelledby="title description">
<title id="title">Retrieval System 設定與部署流程</title><desc id="description">先在 Builder DEV 發布與測試，再將同版設定部署至 FTEST／ENT。</desc>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif}</style>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4065b2"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#287d6c"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9e5c1e"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6d5b9f"/></marker>
<marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52647b"/></marker>
</defs>
<rect width="1800" height="926" fill="#f7f9fd"/>
<text x="48" y="69" fill="#18294c" font-size="40" font-weight="750" text-anchor="start">Retrieval System 設定與部署流程</text>
<text x="49" y="112" fill="#52647b" font-size="21" font-weight="400" text-anchor="start">先在 Builder DEV 發布與測試，再將同版設定部署至 FTEST／ENT。</text>
<rect x="44" y="147" width="1712" height="231" rx="18" fill="#f1f4ff" stroke="#acbce6" stroke-width="1.5"/>
<text x="67" y="184" fill="#4065b2" font-size="22" font-weight="720" text-anchor="start">Builder DEV · 設定與測試</text>
<path d="M374 272H400" fill="none" stroke="#4065b2" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M713 272H739" fill="none" stroke="#4065b2" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M1052 272H1078" fill="none" stroke="#4065b2" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M1391 272H1417" fill="none" stroke="#4065b2" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="66" y="215" width="308" height="116" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="80" y="232" width="4" height="20" rx="2" fill="#52647b"/>
<text x="93" y="250" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">設定與發布</text>
<text x="93" y="280" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">選用模板或自行設定</text>
<text x="93" y="307" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">預檢 ES 索引影響</text>
<rect x="405" y="215" width="308" height="116" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="419" y="232" width="4" height="20" rx="2" fill="#52647b"/>
<text x="432" y="250" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">Ingestion</text>
<text x="432" y="280" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">提交文件並取得 run_id</text>
<text x="432" y="307" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">逐份查詢匯入結果</text>
<rect x="744" y="215" width="308" height="116" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="758" y="232" width="4" height="20" rx="2" fill="#52647b"/>
<text x="771" y="250" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">Inference</text>
<text x="771" y="280" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">完成初次匯入後可查詢</text>
<text x="771" y="307" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">檢查結果與版本</text>
<rect x="1083" y="215" width="308" height="116" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="1097" y="232" width="4" height="20" rx="2" fill="#52647b"/>
<text x="1110" y="250" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">Evaluation</text>
<text x="1110" y="280" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">批次查詢與檢索評估</text>
<text x="1110" y="307" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">依結果調整 Config</text>
<rect x="1422" y="215" width="308" height="116" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="1436" y="232" width="4" height="20" rx="2" fill="#52647b"/>
<text x="1449" y="250" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">Export</text>
<text x="1449" y="280" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">選定已發布的 Config</text>
<text x="1449" y="307" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">帶入目標環境部署設定</text>
<path d="M1237 331V353H221V333" fill="none" stroke="#4065b2" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#blue)"/>
<text x="675" y="372" fill="#4065b2" font-size="17" font-weight="660" text-anchor="start">評估後調整並重新發布</text>
<path d="M1576 331V409" fill="none" stroke="#9e5c1e" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#amber)"/>
<path d="M559 331V428" fill="none" stroke="#287d6c" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#teal)"/>
<path d="M898 331V428" fill="none" stroke="#287d6c" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#teal)"/>
<rect x="382" y="432" width="330" height="150" rx="14" fill="#ecf8f4" stroke="#a0c7b8" stroke-width="1.5"/>
<rect x="396" y="449" width="4" height="20" rx="2" fill="#287d6c"/>
<text x="409" y="467" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">逐文件工作</text>
<text x="409" y="497" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">選取排隊或執行中的文件取消</text>
<text x="409" y="524" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">原批次成功可更新為 completed</text>
<text x="409" y="551" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">Bulk 逾時可重新匯入</text>
<rect x="733" y="432" width="376" height="150" rx="14" fill="#ecf8f4" stroke="#a0c7b8" stroke-width="1.5"/>
<rect x="747" y="449" width="4" height="20" rx="2" fill="#287d6c"/>
<text x="760" y="467" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">切版與重建</text>
<text x="760" y="497" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">沿用索引：Inference 補載期間停查</text>
<text x="760" y="524" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">重建空索引：重新匯入後開放查詢</text>
<text x="760" y="551" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">版本與索引世代對齊後恢復</text>
<rect x="1170" y="412" width="586" height="170" rx="14" fill="#fff5e7" stroke="#e1b982" stroke-width="1.5"/>
<rect x="1184" y="429" width="4" height="20" rx="2" fill="#9e5c1e"/>
<text x="1197" y="447" fill="#18294c" font-size="24" font-weight="730" text-anchor="start">FTEST／ENT 部署</text>
<text x="1197" y="477" fill="#52647b" font-size="19" font-weight="400" text-anchor="start">使用單位套用部署設定並供應 ES 綁定</text>
<text x="1197" y="504" fill="#52647b" font-size="19" font-weight="400" text-anchor="start">Runtime 啟動時選擇 Ingestion／Inference，可分 Pod</text>
<text x="1197" y="531" fill="#52647b" font-size="19" font-weight="400" text-anchor="start">兩條流程使用同版 Config，連到同一 ES 索引</text>
<rect x="44" y="637" width="1712" height="231" rx="18" fill="#f6f2fe" stroke="#c9bce6" stroke-width="1.5"/>
<text x="67" y="674" fill="#6d5b9f" font-size="22" font-weight="720" text-anchor="start">Builder 設定來源及共用執行核心</text>
<rect x="66" y="703" width="518" height="119" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="80" y="720" width="4" height="20" rx="2" fill="#52647b"/>
<text x="93" y="738" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">全域模板</text>
<text x="93" y="768" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">Admin 維護並發布模板版本</text>
<text x="93" y="795" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">User 選用後複製至 System 草稿</text>
<rect x="617" y="703" width="518" height="119" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="631" y="720" width="4" height="20" rx="2" fill="#52647b"/>
<text x="644" y="738" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">自備 Remote API</text>
<text x="644" y="768" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">指定單模組或連續區段及環境綁定</text>
<text x="644" y="795" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">按有效 I/O 契約驗證輸入與輸出</text>
<rect x="1168" y="703" width="562" height="119" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="1182" y="720" width="4" height="20" rx="2" fill="#52647b"/>
<text x="1195" y="738" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">共用 Engine Library</text>
<text x="1195" y="768" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">DEV 與獨立 Runtime 均使用同一套 Library</text>
<text x="1195" y="795" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">Config 選定 Component 及執行參數</text>
</svg>
