.deploy rect{fill:#fff5e5;stroke:#cf9b4a}.deploy text{fill:#624516}.engine rect{fill:#eee9fa;stroke:#9380bf}.engine text{fill:#443267}
.node rect{stroke-width:1.8}.edge{fill:none;stroke:#60768e;stroke-width:2;marker-end:url(#arrow)}
.relation{stroke:#66788b;stroke-dasharray:7 7}.edge-label{fill:#485d71;stroke:white;stroke-width:11;stroke-linejoin:round;paint-order:stroke fill}
