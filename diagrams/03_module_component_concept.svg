<rect width="1880" height="1054" fill="#f7f9fd"/>
<text x="48" y="69" fill="#18294c" font-size="40" font-weight="750" text-anchor="start">Engine 模組、Component 與 System Config</text>
<text x="49" y="112" fill="#52647b" font-size="21" font-weight="400" text-anchor="start">System Config 固定兩條 Pipeline 的元件與版本。首版由 Elasticsearch 提供索引與檢索。</text>
