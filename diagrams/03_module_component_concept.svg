<svg xmlns="http://www.w3.org/2000/svg" width="2700" height="1830" viewBox="0 0 2700 1830" role="img" aria-labelledby="title desc">
<title id="title">RAG Engine 全模組與 Component 擴充</title>
<desc id="desc">Engine 上排為 Inference：Query Transformation、Retrieval、Rerank、Generation；下排為 Ingestion：Import、Parsing、Chunking、Embedding、Indexing。Evaluation 另標為獨立評估能力。每個 Module 列出規劃中的內建元件與泛稱自訂元件。自訂元件依同一契約完成測試及審查、交付並更新目標 Runtime，再由 RAG Builder User 從目錄選用。這是目標設計，不是目前已交付清單。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#60768e"/></marker></defs>
<style>
text{font-family:'Noto Sans CJK TC','Noto Sans TC',sans-serif;font-weight:400;text-anchor:middle;dominant-baseline:central;fill:#143054}
.frame-title{font-size:29;text-anchor:start;font-weight:500}.module-title{font-size:27;font-weight:500}.section-title{font-size:30;font-weight:500;text-anchor:start}
.builtin rect{fill:#e9f2ff;stroke:#6086c8}.custom rect{fill:#eee9fa;stroke:#9380bf}.custom text{fill:#443267}
.delivery rect{fill:#fff5e5;stroke:#cf9b4a}.delivery text{fill:#624516}.builder rect{fill:#ecf8f2;stroke:#599d85}.builder text{fill:#153f32}
.node rect{stroke-width:1.8}.edge{fill:none;stroke:#60768e;stroke-width:2.2;marker-end:url(#arrow)}.relation{stroke-dasharray:7 7}
.edge-label{fill:#485d71;stroke:white;stroke-width:10;paint-order:stroke fill;stroke-linejoin:round}.note{font-size:23;fill:#66788b}
</style><rect width="2700" height="1830" fill="white"/>
<text x="1350" y="40" font-size="34" font-weight="500">Module 定義契約，Component 提供實作</text>
