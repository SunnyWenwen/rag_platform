<text class="edge-label" x="1525" y="1600" font-size="24">納入目標 Runtime</text>
<text class="edge-label" x="2510" y="1590" font-size="23">Component 目錄</text>
<text class="edge-label" x="2510" y="1630" font-size="23">＋Config Schema</text>
<text class="note" x="1350" y="1870">每個內建選項獨立顯示；實際選用依 Config 決定，None 表示略過，不新增執行模組。</text>
<text class="note" x="1350" y="1915">DEV test use／自行提供是服務綁定；全文／向量／Hybrid 是搜尋模式，不拆成額外 Component。</text>
<text class="note" x="1350" y="1980">目標設計示意，非已實作清單；自訂元件經核可、交付及目標 Runtime 更新後，才能供使用者選用。</text>
