<text class="note" x="1350" y="1400">評估選項為目標規劃；首批指標與 Judge 契約待核定，依 M6 交付。</text>
<text class="note" x="1350" y="1490">各 Module 的內建與自訂元件遵守同一契約，由 Engine Registry 管理；Builder 依 Schema 與能力選用。</text>
