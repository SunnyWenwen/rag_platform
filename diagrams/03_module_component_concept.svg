<text x="96" y="247" fill="#18294c" font-size="22" font-weight="730" text-anchor="start">Import</text>
<text x="96" y="277" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">整批預檢，逐份派工</text>
<text x="96" y="304" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">驗證欄位及 Request 參數</text>
<rect x="421" y="212" width="326" height="116" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="435" y="229" width="4" height="20" rx="2" fill="#52647b"/>
<text x="448" y="247" fill="#18294c" font-size="22" font-weight="730" text-anchor="start">Parsing</text>
<text x="448" y="277" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">結構化直傳或檔案解析</text>
<text x="448" y="304" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">保留文件識別</text>
<rect x="773" y="212" width="326" height="116" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="787" y="229" width="4" height="20" rx="2" fill="#52647b"/>
<text x="800" y="247" fill="#18294c" font-size="22" font-weight="730" text-anchor="start">Chunking</text>
<text x="800" y="277" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">Fixed-size／Recursive</text>
<text x="800" y="304" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">Header-aware</text>
<rect x="1125" y="212" width="326" height="116" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="1139" y="229" width="4" height="20" rx="2" fill="#52647b"/>
<text x="1152" y="247" fill="#18294c" font-size="22" font-weight="730" text-anchor="start">Embedding</text>
<text x="1152" y="277" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">具名向量、Profile 與維度</text>
<text x="1152" y="304" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">共用向量空間</text>
<rect x="1477" y="212" width="326" height="116" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="1491" y="229" width="4" height="20" rx="2" fill="#52647b"/>
<text x="1504" y="247" fill="#18294c" font-size="22" font-weight="730" text-anchor="start">Indexing</text>
<text x="1504" y="277" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">Elasticsearch</text>
<text x="1504" y="304" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">資料索引與文件生命週期</text>
<rect x="69" y="484" width="326" height="116" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="83" y="501" width="4" height="20" rx="2" fill="#52647b"/>
<text x="96" y="519" fill="#18294c" font-size="22" font-weight="730" text-anchor="start">Inference Input</text>
<text x="96" y="549" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">讀取查詢參數</text>
<text x="96" y="576" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">合併固定與請求 Filter</text>
<rect x="421" y="484" width="326" height="116" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="435" y="501" width="4" height="20" rx="2" fill="#52647b"/>
<text x="448" y="519" fill="#18294c" font-size="22" font-weight="730" text-anchor="start">Query Transformation</text>
<text x="448" y="549" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">None 或 Rewrite</text>
<text x="448" y="576" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">單／多 Query 共用方法</text>
<rect x="773" y="484" width="326" height="116" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="787" y="501" width="4" height="20" rx="2" fill="#52647b"/>
<text x="800" y="519" fill="#18294c" font-size="22" font-weight="730" text-anchor="start">Retrieval</text>
<text x="800" y="549" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">ES 全文、向量或混合</text>
<text x="800" y="576" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">依索引能力查詢與融合</text>
<rect x="1125" y="484" width="326" height="116" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="1139" y="501" width="4" height="20" rx="2" fill="#52647b"/>
<text x="1152" y="519" fill="#18294c" font-size="22" font-weight="730" text-anchor="start">Rerank</text>
<text x="1152" y="549" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">None 或評分服務</text>
<text x="1152" y="576" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">依設定調整候選排序</text>
<rect x="1477" y="484" width="326" height="116" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="1491" y="501" width="4" height="20" rx="2" fill="#52647b"/>
<text x="1504" y="519" fill="#18294c" font-size="22" font-weight="730" text-anchor="start">檢索結果</text>
<text x="1504" y="549" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">QueryContext[]／ResultSet</text>
<text x="1504" y="576" fill="#52647b" font-size="17" font-weight="400" text-anchor="start">候選 Document 與分數</text>
<path d="M1640 328V391H936V480" fill="none" stroke="#287d6c" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#teal)"/>
<text x="1292" y="383" fill="#287d6c" font-size="17" font-weight="660" text-anchor="middle">共用 IndexBinding</text>
<rect x="44" y="690" width="1792" height="307" rx="18" fill="#f6f2fe" stroke="#c9bce6" stroke-width="1.5"/>
<text x="67" y="727" fill="#6d5b9f" font-size="22" font-weight="720" text-anchor="start">同一 Library 組裝不同 System</text>
<rect x="69" y="752" width="549" height="104" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="83" y="769" width="4" height="20" rx="2" fill="#52647b"/>
<text x="96" y="787" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">A · 內建元件</text>
<text x="96" y="817" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">結構化直傳 → Fixed-size → Elasticsearch</text>
<rect x="658" y="752" width="550" height="104" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="672" y="769" width="4" height="20" rx="2" fill="#52647b"/>
<text x="685" y="787" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">B · 全域模板</text>
<text x="685" y="817" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">套用到草稿 → 多 Query Rewrite → Elasticsearch</text>
<rect x="1248" y="752" width="555" height="104" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="1262" y="769" width="4" height="20" rx="2" fill="#52647b"/>
<text x="1275" y="787" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">C · 自備 Remote API</text>
<text x="1275" y="817" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">Remote Parsing → Header-aware → Elasticsearch</text>
<rect x="69" y="887" width="1734" height="80" rx="14" fill="#fff5e7" stroke="#e1b982" stroke-width="1.5"/>
<rect x="83" y="904" width="4" height="20" rx="2" fill="#9e5c1e"/>
<text x="96" y="922" fill="#18294c" font-size="21" font-weight="730" text-anchor="start">Remote API 替換範圍</text>
<text x="96" y="952" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">Ingestion：Parsing／Chunking／Embedding　　Inference：Query Transformation／Retrieval／Rerank，可替換單節點或連續區段</text>
</svg>
