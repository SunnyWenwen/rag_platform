<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1054" viewBox="0 0 1880 1054" role="img" aria-labelledby="title description">
<title id="title">Engine 模組、Component 與 System Config</title><desc id="description">System Config 固定兩條 Pipeline 的元件與版本。首版由 Elasticsearch 提供索引與檢索。</desc>
