<text class="edge-label" x="1525" y="1400" font-size="24">納入目標 Runtime</text>
<text class="edge-label" x="2510" y="1390" font-size="23">Component 目錄</text>
<text class="edge-label" x="2510" y="1430" font-size="23">＋Config Schema</text>
<text class="note" x="1350" y="1670">預設提供是內建選項，不表示全部同時執行；None／略過與相依條件仍依 Config 決定。</text>
<text class="note" x="1350" y="1715">DEV test use／自行提供是服務綁定選項；融合與 Top N 是結果處理設定，不另增加 Pipeline Module。</text>
<text class="note" x="1350" y="1780">目標設計示意，非已實作清單；自訂元件經核可、交付及目標 Runtime 更新後，才能供使用者選用。</text>
</svg>
