<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="901" viewBox="0 0 1720 901" role="img" aria-labelledby="title description">
<title id="title">Builder 啟動與 DEV Runtime 補載</title><desc id="description">Runtime 可零組 Config 啟動。Builder 依已發布的部署意圖與 Runtime 回報補載。</desc>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif}</style>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4065b2"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#287d6c"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9e5c1e"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6d5b9f"/></marker>
<marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52647b"/></marker>
</defs>
<rect width="1720" height="901" fill="#f7f9fd"/>
<text x="48" y="69" fill="#18294c" font-size="40" font-weight="750" text-anchor="start">Builder 啟動與 DEV Runtime 補載</text>
<text x="49" y="112" fill="#52647b" font-size="21" font-weight="400" text-anchor="start">Runtime 可零組 Config 啟動。Builder 依已發布的部署意圖與 Runtime 回報補載。</text>
<rect x="44" y="146" width="1632" height="186" rx="18" fill="#f6f2fe" stroke="#c9bce6" stroke-width="1.5"/>
<text x="67" y="183" fill="#6d5b9f" font-size="22" font-weight="720" text-anchor="start">B · Retrieval Engine Framework</text>
<rect x="69" y="205" width="604" height="88" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="83" y="222" width="4" height="20" rx="2" fill="#52647b"/>
<text x="96" y="240" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">B-1 · Schema 與 Component Descriptor</text>
<text x="96" y="270" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">Builder 使用契約編輯與驗證 Config</text>
<rect x="1045" y="205" width="604" height="88" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="1059" y="222" width="4" height="20" rx="2" fill="#52647b"/>
<text x="1072" y="240" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">B-2 · 共用 Engine Library</text>
<text x="1072" y="270" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">DEV Runtime 入口載入 Library</text>
<rect x="44" y="376" width="1632" height="466" rx="18" fill="#f1f4ff" stroke="#acbce6" stroke-width="1.5"/>
<text x="67" y="413" fill="#4065b2" font-size="22" font-weight="720" text-anchor="start">A · DEV 啟動與補載</text>
<path d="M371 293V436" fill="none" stroke="#6d5b9f" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#purple)"/>
<path d="M1347 293V436" fill="none" stroke="#6d5b9f" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#purple)"/>
<rect x="69" y="441" width="603" height="112" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="83" y="458" width="4" height="20" rx="2" fill="#52647b"/>
<text x="96" y="476" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">A-2 · Builder Backend</text>
<text x="96" y="506" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">讀取已發布 Config Revision 與部署意圖</text>
<text x="96" y="533" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">Builder 啟動、Runtime 恢復連線及每 60 秒查核</text>
<rect x="1045" y="441" width="604" height="112" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="1059" y="458" width="4" height="20" rx="2" fill="#52647b"/>
<text x="1072" y="476" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">A-4 · Runtime Pod</text>
<text x="1072" y="506" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">初始化 API、Registry、Executor 與 Queue</text>
<text x="1072" y="533" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">回報本機流程、版本、索引世代及就緒狀態</text>
<path d="M672 497H1040" fill="none" stroke="#4065b2" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="858" y="478" fill="#4065b2" font-size="17" font-weight="660" text-anchor="middle">GET 單一 System 狀態</text>
<path d="M371 553V600H1445" fill="none" stroke="#4065b2" stroke-width="2.3" stroke-linejoin="round"/>
<path d="M371 600H258" fill="none" stroke="#4065b2" stroke-width="2.3" stroke-linejoin="round"/>
<path d="M257 600V650" fill="none" stroke="#4065b2" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M652 600V650" fill="none" stroke="#4065b2" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M1047 600V650" fill="none" stroke="#4065b2" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M1445 600V650" fill="none" stroke="#4065b2" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="69" y="654" width="376" height="125" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="83" y="671" width="4" height="20" rx="2" fill="#52647b"/>
<text x="96" y="689" fill="#18294c" font-size="22" font-weight="730" text-anchor="start">尚無發布紀錄</text>
<text x="96" y="719" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">Runtime 保持就緒</text>
<text x="96" y="746" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">等待首次發布與建立索引</text>
<rect x="464" y="654" width="376" height="125" rx="14" fill="#ecf8f4" stroke="#a0c7b8" stroke-width="1.5"/>
<rect x="478" y="671" width="4" height="20" rx="2" fill="#287d6c"/>
<text x="491" y="689" fill="#18294c" font-size="22" font-weight="730" text-anchor="start">快照與索引相符</text>
<text x="491" y="719" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">維持既有業務 API</text>
<text x="491" y="746" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">各流程按就緒狀態受理</text>
<rect x="859" y="654" width="376" height="125" rx="14" fill="#ecf8f4" stroke="#a0c7b8" stroke-width="1.5"/>
<rect x="873" y="671" width="4" height="20" rx="2" fill="#287d6c"/>
<text x="886" y="689" fill="#18294c" font-size="22" font-weight="730" text-anchor="start">快照缺失或落後</text>
<text x="886" y="719" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">按部署意圖 reload 原發布版</text>
<text x="886" y="746" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">核對既有 ES 索引與世代</text>
<rect x="1254" y="654" width="395" height="125" rx="14" fill="#fff5e7" stroke="#e1b982" stroke-width="1.5"/>
<rect x="1268" y="671" width="4" height="20" rx="2" fill="#9e5c1e"/>
<text x="1281" y="689" fill="#18294c" font-size="22" font-weight="730" text-anchor="start">ES 索引確認遺失</text>
<text x="1281" y="719" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">暫停受影響的匯入與查詢</text>
<text x="1281" y="746" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">使用者確認後 recover_index</text>
<text x="69" y="813" fill="#52647b" font-size="18" font-weight="500" text-anchor="start">Builder 只補載預期上線的流程。Runtime 以 runtime_ref 核對管理目標。</text>
</svg>
