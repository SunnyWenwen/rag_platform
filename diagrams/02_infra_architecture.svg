<text x="1247" y="258" fill="#4b5e75" font-size="15" font-weight="520" text-anchor="start">A 匯出同版 E 及部署 Bundle</text>
<rect x="1526" y="199" width="278" height="74" rx="10" fill="#f8fafc" stroke="#dbe4ee" stroke-width="1.4"/>
<rect x="1537" y="212" width="28" height="24" rx="6" fill="#e9f1ff" stroke="none" stroke-width="1.4"/>
<text x="1551" y="230" fill="#315e9b" font-size="14" font-weight="730" text-anchor="middle">6</text>
