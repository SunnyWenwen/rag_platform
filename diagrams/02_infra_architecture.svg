<text x="109" y="285" fill="#172a45" font-size="21" font-weight="740" text-anchor="start">Frontend</text>
<text x="259" y="285" fill="#4b5e75" font-size="18" font-weight="500" text-anchor="start">依 Schema 產生設定欄位與選項</text>
<path d="M109 309 H573" stroke="#e3ebf6"/>
<text x="109" y="345" fill="#172a45" font-size="21" font-weight="740" text-anchor="start">Backend</text>
<text x="259" y="345" fill="#4b5e75" font-size="18" font-weight="500" text-anchor="start">管理版本、協調 DEV Runtime</text>
<text x="109" y="380" fill="#4b5e75" font-size="17" font-weight="500" text-anchor="start">載入相容契約與元件目錄，連接 Config Store</text>
<rect x="87" y="448" width="509" height="94" rx="13" fill="#e0ecfc" stroke="#a3bce0" stroke-width="1.4"/>
<text x="109" y="485" fill="#172a45" font-size="24" font-weight="720" text-anchor="start">E　已驗證的 System Config</text>
<text x="109" y="515" fill="#4b5e75" font-size="17" font-weight="500" text-anchor="start">Config Revision、Pipeline、資料與服務引用</text>
<rect x="87" y="627" width="509" height="180" rx="16" fill="#e8f4f4" stroke="#96bcc2" stroke-width="1.4"/>
<text x="111" y="663" fill="#172a45" font-size="24" font-weight="750" text-anchor="start">D　共用 DEV Retrieval Runtime</text>
<text x="111" y="690" fill="#4b5e75" font-size="16" font-weight="500" text-anchor="start">啟動時載入 API、Registry、Executor 與 Queue，可零組 Config</text>
<rect x="111" y="705" width="461" height="83" rx="13" fill="#d8efea" stroke="#a2ccbf" stroke-width="1.4"/>
<text x="133" y="742" fill="#1c5149" font-size="22" font-weight="720" text-anchor="start">F　測試 Retrieval System</text>
<text x="133" y="772" fill="#4b5e75" font-size="17" font-weight="500" text-anchor="start">依 E 啟用，透過 Runtime API 按 system_id 路由</text>
<rect x="466" y="717" width="92" height="24" rx="6" fill="#c6e6df" stroke="none" stroke-width="1.4"/>
<text x="512" y="734" fill="#13796f" font-size="13" font-weight="700" text-anchor="middle">發布後啟用</text>
<path d="M87 747 H111" fill="none" stroke="#13796f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
