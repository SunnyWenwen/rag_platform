<text x="359" y="1038" fill="#4b5e75" font-size="15" font-weight="580" text-anchor="start">設定與啟動</text>
<path d="M519 1032 H556" fill="none" stroke="#13796f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="568" y="1038" fill="#4b5e75" font-size="15" font-weight="580" text-anchor="start">API 與資料存取</text>
<path d="M758 1032 H795" fill="none" stroke="#a55b18" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="807" y="1038" fill="#4b5e75" font-size="15" font-weight="580" text-anchor="start">匯出至目標環境</text>
