<text x="667" y="258" fill="#4b5e75" font-size="15" font-weight="520" text-anchor="start">A 提問 → F 檢索並回傳結果</text>
<rect x="946" y="199" width="278" height="74" rx="10" fill="#f8fafc" stroke="#dbe4ee" stroke-width="1.4"/>
