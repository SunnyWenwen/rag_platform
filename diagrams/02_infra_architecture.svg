<text x="1306" y="533" fill="#4b5e75" font-size="17" font-weight="500" text-anchor="start">補齊目標環境綁定後套用</text>
<rect x="1284" y="627" width="509" height="180" rx="16" fill="#e8f4f4" stroke="#96bcc2" stroke-width="1.4"/>
<text x="1308" y="663" fill="#172a45" font-size="24" font-weight="750" text-anchor="start">D′　獨立 Retrieval Runtime</text>
<text x="1308" y="690" fill="#4b5e75" font-size="16" font-weight="500" text-anchor="start">部署時載入 E ｜ 對外提供業務 API</text>
<rect x="1308" y="705" width="461" height="83" rx="13" fill="#d8efea" stroke="#a2ccbf" stroke-width="1.4"/>
<text x="1330" y="742" fill="#1c5149" font-size="22" font-weight="720" text-anchor="start">F′　目標環境的 Retrieval System</text>
<text x="1330" y="772" fill="#4b5e75" font-size="17" font-weight="500" text-anchor="start">以同版 E 啟用，使用目標環境的資料與服務</text>
<rect x="87" y="895" width="509" height="73" rx="13" fill="#ffffff" stroke="#bad0e7" stroke-width="1.4"/>
<text x="109" y="924" fill="#172a45" font-size="18" font-weight="720" text-anchor="start">DEV 外部依賴</text>
<text x="109" y="951" fill="#4b5e75" font-size="17" font-weight="500" text-anchor="start">Elasticsearch（資料／控制索引）、模型與 Remote API</text>
<rect x="1284" y="895" width="509" height="73" rx="13" fill="#ffffff" stroke="#afccbd" stroke-width="1.4"/>
<text x="1306" y="924" fill="#172a45" font-size="18" font-weight="720" text-anchor="start">目標環境依賴</text>
<text x="1306" y="950" fill="#4b5e75" font-size="17" font-weight="500" text-anchor="start">ES（資料／控制索引）、模型／Remote API、Secret Vault、觀測</text>
<text x="667" y="304" fill="#6e5ea3" font-size="15" font-weight="680" text-anchor="middle">提供設定契約</text>
<text x="381" y="433" fill="#315e9b" font-size="15" font-weight="650" text-anchor="start">驗證並保存</text>
<text x="380" y="590" fill="#315e9b" font-size="15" font-weight="650" text-anchor="start">① 內部管理 API 下發 E</text>
<text x="94" y="586" fill="#13796f" font-size="17" font-weight="760" text-anchor="start">② Ingest／③ Inference → F</text>
<text x="94" y="610" fill="#13796f" font-size="15" font-weight="620" text-anchor="start">④ Evaluation Runner 批次 Query F</text>
<text x="957" y="525" fill="#6e5ea3" font-size="15" font-weight="640" text-anchor="start">封裝</text>
<text x="680" y="635" fill="#6e5ea3" font-size="15" font-weight="680" text-anchor="middle">啟動 D</text>
<text x="1191" y="635" fill="#6e5ea3" font-size="15" font-weight="680" text-anchor="middle">同版 Image</text>
<text x="1557" y="600" fill="#315e9b" font-size="15" font-weight="650" text-anchor="start">啟動 Image 並載入 E</text>
<text x="940" y="826" fill="#a55b18" font-size="21" font-weight="740" text-anchor="middle">⑤ Export 通過測試的 E</text>
<text x="940" y="882" fill="#4b5e75" font-size="17" font-weight="520" text-anchor="middle">共用邏輯設定，依環境分別綁定服務與資料。</text>
<text x="940" y="909" fill="#62748a" font-size="16" font-weight="500" text-anchor="middle">匯出包含部署設定及引用，部署方準備目標資料。</text>
