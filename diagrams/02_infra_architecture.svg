<text x="77" y="177" fill="#172a45" font-size="22" font-weight="750" text-anchor="start">使用者流程</text>
<text x="1803" y="176" fill="#4b5e75" font-size="16" font-weight="540" text-anchor="end">評估後可回到設定調整 E，再重測受影響的步驟。</text>
