<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1058" viewBox="0 0 1880 1058" role="img" aria-labelledby="title desc">
<title id="title">Retrieval 基礎架構與分工</title>
<desc id="desc">Engine Platform 提供 Schema 和共用 Runtime Image。Builder 在 DEV Runtime 中用 Config E 啟用測試 System，並透過 Runtime API 對其執行 Ingest 與 Inference。同版 Config E 匯出至 FTEST 或 ENT，用共用 Image 建立獨立 Runtime 和 System。</desc>
<defs>
<marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.5 L0 11Z" fill="#315e9b"/></marker>
<marker id="arrow-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.5 L0 11Z" fill="#6e5ea3"/></marker>
<marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.5 L0 11Z" fill="#13796f"/></marker>
<marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.5 L0 11Z" fill="#a55b18"/></marker>
</defs>
<style>
text{font-family:'Noto Sans CJK TC','Noto Sans CJK SC',sans-serif;text-rendering:geometricPrecision}
</style>
<rect x="0" y="0" width="1880" height="1058" rx="0" fill="#f9fbfe" stroke="none" stroke-width="1.4"/>
<text x="55" y="72" fill="#172a45" font-size="49" font-weight="800" text-anchor="start">Retrieval 基礎架構與分工</text>
<text x="57" y="113" fill="#4b5e75" font-size="21" font-weight="500" text-anchor="start">Engine Platform 交付契約與 Runtime Image，Builder 驗證設定後交付目標環境部署。</text>
<rect x="55" y="150" width="591" height="837" rx="22" fill="#edf4fd" stroke="#b8cde8" stroke-width="1.5"/>
<rect x="85" y="179" width="36" height="34" rx="8" fill="#dbe9fa" stroke="none" stroke-width="1.4"/>
<text x="103" y="204" fill="#315e9b" font-size="21" font-weight="750" text-anchor="middle">A</text>
<text x="135" y="205" fill="#172a45" font-size="29" font-weight="750" text-anchor="start">Retrieval Builder</text>
<text x="135" y="232" fill="#4b5e75" font-size="16" font-weight="500" text-anchor="start">Frontend／Backend ＋ DEV 測試環境</text>
<rect x="704" y="150" width="472" height="563" rx="22" fill="#f2eff9" stroke="#cec6e5" stroke-width="1.5"/>
<rect x="734" y="179" width="36" height="34" rx="8" fill="#e5dff4" stroke="none" stroke-width="1.4"/>
<text x="752" y="204" fill="#6e5ea3" font-size="21" font-weight="750" text-anchor="middle">B</text>
<text x="784" y="205" fill="#172a45" font-size="29" font-weight="750" text-anchor="start">Retrieval Engine Platform</text>
<text x="784" y="232" fill="#4b5e75" font-size="16" font-weight="500" text-anchor="start">Schema 與共用執行框架</text>
<rect x="1234" y="150" width="591" height="837" rx="22" fill="#ecf6f0" stroke="#b9d8ca" stroke-width="1.5"/>
<rect x="1264" y="179" width="36" height="34" rx="8" fill="#d8ece3" stroke="none" stroke-width="1.4"/>
<text x="1282" y="204" fill="#13796f" font-size="21" font-weight="750" text-anchor="middle">C</text>
<text x="1314" y="205" fill="#172a45" font-size="29" font-weight="750" text-anchor="start">部署環境</text>
<text x="1314" y="232" fill="#4b5e75" font-size="16" font-weight="500" text-anchor="start">FTEST／ENT，由使用單位管理</text>
