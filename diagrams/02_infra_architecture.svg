<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1186" viewBox="0 0 1840 1186" role="img" aria-labelledby="title description">
<title id="title">Retrieval Builder 與 Runtime 部署架構</title><desc id="description">Builder 管理 DEV 的發布與補載。FTEST／ENT 由部署設定啟動相同的 Runtime Image。</desc>
<style>text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",sans-serif}</style>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4065b2"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#287d6c"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9e5c1e"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6d5b9f"/></marker>
<marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52647b"/></marker>
</defs>
<rect width="1840" height="1186" fill="#f7f9fd"/>
<text x="48" y="69" fill="#18294c" font-size="40" font-weight="750" text-anchor="start">Retrieval Builder 與 Runtime 部署架構</text>
<text x="49" y="112" fill="#52647b" font-size="21" font-weight="400" text-anchor="start">Builder 管理 DEV 的發布與補載。FTEST／ENT 由部署設定啟動相同的 Runtime Image。</text>
<rect x="44" y="145" width="1752" height="226" rx="18" fill="#f6f2fe" stroke="#c9bce6" stroke-width="1.5"/>
<text x="67" y="182" fill="#6d5b9f" font-size="22" font-weight="720" text-anchor="start">B · Retrieval Engine Framework</text>
<rect x="69" y="213" width="514" height="114" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="83" y="230" width="4" height="20" rx="2" fill="#52647b"/>
<text x="96" y="248" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">B-1 · 設定契約</text>
<text x="96" y="278" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">System Config Schema、Component Descriptor</text>
<text x="96" y="305" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">有效欄位推導及選項來源</text>
<rect x="658" y="213" width="518" height="114" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="672" y="230" width="4" height="20" rx="2" fill="#52647b"/>
<text x="685" y="248" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">B-2 · Engine Library</text>
<text x="685" y="278" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">驗證與組裝 Config，執行兩條 Pipeline</text>
<text x="685" y="305" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">由 DEV Runtime 入口載入</text>
<rect x="1251" y="213" width="517" height="114" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="1265" y="230" width="4" height="20" rx="2" fill="#52647b"/>
<text x="1278" y="248" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">B-3 · 共用 Runtime Image</text>
<text x="1278" y="278" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">Runtime API ＋ Engine Library</text>
<text x="1278" y="305" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">供 FTEST／ENT 的 Pod 使用</text>
<path d="M1176 269H1246" fill="none" stroke="#6d5b9f" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#purple)"/>
<rect x="44" y="410" width="1038" height="720" rx="18" fill="#f1f4ff" stroke="#acbce6" stroke-width="1.5"/>
<text x="67" y="447" fill="#4065b2" font-size="22" font-weight="720" text-anchor="start">A · Builder DEV</text>
<rect x="1117" y="410" width="679" height="720" rx="18" fill="#ecf8f4" stroke="#a0c7b8" stroke-width="1.5"/>
<text x="1140" y="447" fill="#287d6c" font-size="22" font-weight="720" text-anchor="start">C · FTEST／ENT 部署</text>
<path d="M322 327V388H558V479" fill="none" stroke="#6d5b9f" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#purple)"/>
<path d="M913 327V406" fill="none" stroke="#6d5b9f" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#purple)"/>
<path d="M1510 327V406" fill="none" stroke="#6d5b9f" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#purple)"/>
<rect x="69" y="484" width="296" height="112" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="83" y="501" width="4" height="20" rx="2" fill="#52647b"/>
<text x="96" y="519" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">A-1 · Builder UI</text>
<text x="96" y="549" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">設定、測試與狀態顯示</text>
<text x="96" y="576" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">透過 Backend 操作</text>
<rect x="396" y="484" width="323" height="112" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="410" y="501" width="4" height="20" rx="2" fill="#52647b"/>
<text x="423" y="519" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">A-2 · Builder Backend</text>
<text x="423" y="549" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">查 Catalog、預檢與發布</text>
<text x="423" y="576" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">每 60 秒查核 System</text>
<rect x="750" y="484" width="307" height="112" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="764" y="501" width="4" height="20" rx="2" fill="#52647b"/>
<text x="777" y="519" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">A-3 · 部署紀錄</text>
<text x="777" y="549" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">Config Revision、部署意圖</text>
<text x="777" y="576" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">最近觀測與待確認操作</text>
<path d="M365 540H392" fill="none" stroke="#4065b2" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M719 540H746" fill="none" stroke="#4065b2" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M1057 539H1140" fill="none" stroke="#9e5c1e" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#amber)"/>
<text x="1096" y="521" fill="#9e5c1e" font-size="17" font-weight="660" text-anchor="middle">Export</text>
<path d="M558 596V635H305V681" fill="none" stroke="#4065b2" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M558 635H825V681" fill="none" stroke="#4065b2" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="97" y="657" fill="#4065b2" font-size="17" font-weight="660" text-anchor="start">管理：initialize／update／recover_index</text>
<text x="686" y="657" fill="#4065b2" font-size="17" font-weight="660" text-anchor="start">管理：reload</text>
<rect x="69" y="685" width="465" height="122" rx="14" fill="#ecf8f4" stroke="#a0c7b8" stroke-width="1.5"/>
<rect x="83" y="702" width="4" height="20" rx="2" fill="#287d6c"/>
<text x="96" y="720" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">A-4 · Ingestion</text>
<text x="96" y="750" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">依 runtime_ref 對應管理目標</text>
<text x="96" y="777" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">匯入、取消及文件管理</text>
<rect x="593" y="685" width="464" height="122" rx="14" fill="#ecf8f4" stroke="#a0c7b8" stroke-width="1.5"/>
<rect x="607" y="702" width="4" height="20" rx="2" fill="#287d6c"/>
<text x="620" y="720" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">A-4 · Inference</text>
<text x="620" y="750" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">載入時核對版本與索引世代</text>
<text x="620" y="777" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">提供查詢 API</text>
<text x="77" y="844" fill="#287d6c" font-size="17" font-weight="660" text-anchor="start">同一 Runtime Pod 可啟用兩條流程，也可各自部署。</text>
<path d="M302 807V825H49V925H67" fill="none" stroke="#287d6c" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#teal)"/>
<path d="M825 807V825H1073V925H1059" fill="none" stroke="#287d6c" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#teal)"/>
<rect x="69" y="875" width="988" height="158" rx="14" fill="#ecf8f4" stroke="#a0c7b8" stroke-width="1.5"/>
<rect x="83" y="892" width="4" height="20" rx="2" fill="#287d6c"/>
<text x="96" y="910" fill="#18294c" font-size="24" font-weight="730" text-anchor="start">A-6 · 共用 Elasticsearch</text>
<text x="96" y="940" fill="#52647b" font-size="19" font-weight="400" text-anchor="start">同一 System 的檢索資料索引與索引世代</text>
<text x="96" y="967" fill="#52647b" font-size="19" font-weight="400" text-anchor="start">rag-&lt;env&gt;-runtime-control-v1 保存占用、Run 與寫入批次</text>
<text x="96" y="994" fill="#52647b" font-size="19" font-weight="400" text-anchor="start">模型及 Remote API 由 DEV 環境綁定提供</text>
<rect x="1144" y="484" width="626" height="112" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="1158" y="501" width="4" height="20" rx="2" fill="#52647b"/>
<text x="1171" y="519" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">C-1 · Export Bundle</text>
<text x="1171" y="549" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">同版 Config、Runtime Image 版本、目標環境綁定</text>
<text x="1171" y="576" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">Secret Key 由目標環境注入</text>
<path d="M1458 596V625" fill="none" stroke="#287d6c" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="1144" y="629" width="626" height="112" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="1158" y="646" width="4" height="20" rx="2" fill="#52647b"/>
<text x="1171" y="664" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">C-2 · 使用單位部署</text>
<text x="1171" y="694" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">以 pipeline 選擇啟動流程</text>
<text x="1171" y="721" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">選擇 Ingestion、Inference 或兩條皆開啟</text>
<path d="M1458 741V776" fill="none" stroke="#287d6c" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="1144" y="780" width="626" height="110" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="1158" y="797" width="4" height="20" rx="2" fill="#52647b"/>
<text x="1171" y="815" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">C-3 · 獨立 Runtime</text>
<text x="1171" y="845" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">分 Pod 時共享同一 ES 綁定與 Config Revision</text>
<text x="1171" y="872" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">只受理已啟用的業務 API</text>
<path d="M1458 890V925" fill="none" stroke="#287d6c" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="1144" y="929" width="626" height="104" rx="14" fill="#ffffff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="1158" y="946" width="4" height="20" rx="2" fill="#52647b"/>
<text x="1171" y="964" fill="#18294c" font-size="23" font-weight="730" text-anchor="start">C-5 · 目標環境依賴</text>
<text x="1171" y="994" fill="#52647b" font-size="18" font-weight="400" text-anchor="start">Elasticsearch、模型、Remote API、Secret 與觀測</text>
<text x="69" y="1081" fill="#52647b" font-size="18" font-weight="500" text-anchor="start">業務路由以 System 和已啟用流程決定。切版後由 Builder 補載 Inference。</text>
<text x="69" y="1108" fill="#52647b" font-size="18" font-weight="500" text-anchor="start">逐流程卸載保留索引。System DELETE 清除受管索引。</text>
<text x="1144" y="1081" fill="#52647b" font-size="18" font-weight="500" text-anchor="start">索引建立入口與部署接線依 Q-021。</text>
</svg>
