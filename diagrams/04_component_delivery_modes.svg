<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1670" viewBox="0 0 2400 1670" role="img" aria-labelledby="title desc"><title id="title">Retrieval Component 的三種交付模式</title><desc id="desc">Local Component 提供原始碼，整合至 Library 並於 Runtime 內執行。Remote API Image Deployment 提供 Image 及部署描述，由使用單位透過匯出 YAML 部署獨立 API。Remote API External Endpoint 只提供連線與契約，由 Developer 自行部署。三者遵守相同 Module I/O Contract，差異在交付與部署方式。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#607186"/></marker></defs><rect width="2400" height="1670" fill="#f6f8fc"/><style>text{font-family:'Noto Sans CJK TC',sans-serif;dominant-baseline:central;fill:#1e3048}.arrow{fill:none;stroke:#607186;stroke-width:2.6;marker-end:url(#arrow)}</style><text x="70" y="70" style="font-size:46px;fill:#1e3048;text-anchor:start;font-weight:500">Retrieval Component 的三種交付模式</text><text x="72" y="133" style="font-size:29px;fill:#586b81;text-anchor:start;font-weight:400">同一套 Module I/O Contract，三種程式交付與服務部署方式</text><rect x="826" y="185" width="1504" height="49" rx="8" fill="#eaf0fa" stroke="none" stroke-width="2" /><text x="1578" y="209" style="font-size:25px;fill:#365a8c;text-anchor:middle;font-weight:400">Remote API Component｜透過 HTTP 傳入 Module Input、驗證並回傳 Module Output</text><text x="425" y="209" style="font-size:25px;fill:#2b7166;text-anchor:middle;font-weight:400">程序內執行</text><rect x="70" y="255" width="748" height="1265" rx="18" fill="#fff" stroke="#dce3ed" stroke-width="2" /><rect x="70" y="255" width="748" height="9" rx="0" fill="#2d7d70" stroke="none" stroke-width="2" /><text x="100" y="310" style="font-size:29px;fill:#2d7d70;text-anchor:start;font-weight:500">01</text><text x="162" y="310" style="font-size:28px;fill:#2d7d70;text-anchor:start;font-weight:500">Local Component</text><text x="100" y="366" style="font-size:29px;fill:#1e3048;text-anchor:start;font-weight:500">提供 Component 原始碼</text><text x="100" y="432" style="font-size:23px;fill:#617187;text-anchor:start;font-weight:400">執行位置</text><rect x="98" y="478" width="692" height="480" rx="12" fill="#f7fcf9" stroke="#8bb4a6" stroke-width="2" /><text x="120" y="508" style="font-size:23px;fill:#2d6d61;text-anchor:start;font-weight:400">使用單位部署環境</text><rect x="128" y="549" width="632" height="345" rx="10" fill="#e9f5f0" stroke="#89b7aa" stroke-width="2" /><text x="444.0" y="581" style="font-size:26px;fill:#2d7d70;text-anchor:middle;font-weight:400">Retrieval Runtime</text><rect x="170" y="625" width="548" height="84" rx="10" fill="#fff" stroke="#89b7aa" stroke-width="2" /><text x="444.0" y="667.0" style="font-size:26px;fill:#1e3048;text-anchor:middle;font-weight:400">Retrieval Engine Library</text><path class="arrow" d="M444.0 709 L444.0 755"/><rect x="170" y="755" width="548" height="94" rx="10" fill="#e9f5f0" stroke="#89b7aa" stroke-width="2" /><text x="444.0" y="784.5" style="font-size:25px;fill:#1e3048;text-anchor:middle;font-weight:400">Local Component</text><text x="444.0" y="819.5" style="font-size:25px;fill:#1e3048;text-anchor:middle;font-weight:400">與 Library 同程序執行</text><text x="444.0" y="929" style="font-size:24px;fill:#526b62;text-anchor:middle;font-weight:400">沒有額外的 Remote API 服務</text><path d="M100 996 L788 996" stroke="#e1e7ef"/><text x="100" y="1036" style="font-size:23px;fill:#617187;text-anchor:start;font-weight:400">誰部署／維護方法</text><text x="100" y="1074" style="font-size:26px;fill:#2d7d70;text-anchor:start;font-weight:400">使用單位隨 Runtime 部署</text><text x="100" y="1108" style="font-size:26px;fill:#2d7d70;text-anchor:start;font-weight:400">開發者透過 PR／Image 版本交付</text><text x="100" y="1187" style="font-size:23px;fill:#617187;text-anchor:start;font-weight:400">Export YAML 包含</text><text x="100" y="1225" style="font-size:26px;fill:#2d7d70;text-anchor:start;font-weight:400">Runtime＋Config</text><text x="100" y="1259" style="font-size:26px;fill:#2d7d70;text-anchor:start;font-weight:400">Component 已包入 Runtime Image</text><text x="100" y="1338" style="font-size:23px;fill:#617187;text-anchor:start;font-weight:400">Developer 交付物</text><text x="100" y="1376" style="font-size:26px;fill:#2d7d70;text-anchor:start;font-weight:400">Component 原始碼＋設定／契約描述</text><rect x="826" y="255" width="748" height="1265" rx="18" fill="#fff" stroke="#dce3ed" stroke-width="2" /><rect x="826" y="255" width="748" height="9" rx="0" fill="#3e68a2" stroke="none" stroke-width="2" /><text x="856" y="310" style="font-size:29px;fill:#3e68a2;text-anchor:start;font-weight:500">02</text><text x="918" y="310" style="font-size:28px;fill:#3e68a2;text-anchor:start;font-weight:500">Remote API · Image Deployment</text><text x="856" y="366" style="font-size:29px;fill:#1e3048;text-anchor:start;font-weight:500">提供 API Image＋部署描述</text><text x="856" y="432" style="font-size:23px;fill:#617187;text-anchor:start;font-weight:400">執行位置</text><rect x="854" y="478" width="692" height="480" rx="12" fill="#f6f9fe" stroke="#9eb5d5" stroke-width="2" /><text x="876" y="508" style="font-size:23px;fill:#365a8c;text-anchor:start;font-weight:400">使用單位部署環境</text><rect x="884" y="549" width="632" height="155" rx="10" fill="#edf2fb" stroke="#a4b9d7" stroke-width="2" /><text x="1200.0" y="578" style="font-size:26px;fill:#365a8c;text-anchor:middle;font-weight:400">Retrieval Runtime</text><text x="1200.0" y="633" style="font-size:26px;fill:#365a8c;text-anchor:middle;font-weight:400">Library → Remote API Adapter</text><path class="arrow" d="M1200.0 704 L1200.0 819"/><text x="1290.0" y="768" style="font-size:23px;fill:#52647a;text-anchor:middle;font-weight:400">HTTP API</text><rect x="926" y="819" width="548" height="99" rx="10" fill="#eaf0fa" stroke="#91add1" stroke-width="2" /><text x="1200.0" y="851.0" style="font-size:25px;fill:#1e3048;text-anchor:middle;font-weight:400">Remote API Service</text><text x="1200.0" y="886.0" style="font-size:25px;fill:#1e3048;text-anchor:middle;font-weight:400">從 Developer 的 Image 啟動</text><text x="1200.0" y="939" style="font-size:23px;fill:#52647a;text-anchor:middle;font-weight:400">同環境、獨立服務／程序</text><path d="M856 996 L1544 996" stroke="#e1e7ef"/><text x="856" y="1036" style="font-size:23px;fill:#617187;text-anchor:start;font-weight:400">誰部署／維護 API</text><text x="856" y="1074" style="font-size:26px;fill:#3e68a2;text-anchor:start;font-weight:400">使用單位用匯出的 YAML 部署</text><text x="856" y="1108" style="font-size:26px;fill:#3e68a2;text-anchor:start;font-weight:400">Developer 交付服務 Image 版本</text><text x="856" y="1187" style="font-size:23px;fill:#617187;text-anchor:start;font-weight:400">Export YAML 包含</text><text x="856" y="1225" style="font-size:26px;fill:#3e68a2;text-anchor:start;font-weight:400">Runtime＋Config＋Remote API 部署</text><text x="856" y="1259" style="font-size:26px;fill:#3e68a2;text-anchor:start;font-weight:400">含 Service、資源與 Secret 引用</text><text x="856" y="1338" style="font-size:23px;fill:#617187;text-anchor:start;font-weight:400">Developer 交付物</text><text x="856" y="1376" style="font-size:26px;fill:#3e68a2;text-anchor:start;font-weight:400">API Image＋部署描述＋契約資訊</text><text x="856" y="1410" style="font-size:26px;fill:#3e68a2;text-anchor:start;font-weight:400">不需要提供 Component 原始碼</text><rect x="1582" y="255" width="748" height="1265" rx="18" fill="#fff" stroke="#dce3ed" stroke-width="2" /><rect x="1582" y="255" width="748" height="9" rx="0" fill="#93652c" stroke="none" stroke-width="2" /><text x="1612" y="310" style="font-size:29px;fill:#93652c;text-anchor:start;font-weight:500">03</text><text x="1674" y="310" style="font-size:28px;fill:#93652c;text-anchor:start;font-weight:500">Remote API · External Endpoint</text><text x="1612" y="366" style="font-size:29px;fill:#1e3048;text-anchor:start;font-weight:500">提供 API 連線與契約資訊</text><text x="1612" y="432" style="font-size:23px;fill:#617187;text-anchor:start;font-weight:400">執行位置</text><rect x="1610" y="478" width="692" height="273" rx="12" fill="#fbfcff" stroke="#c3cddd" stroke-width="2" /><text x="1632" y="508" style="font-size:23px;fill:#52647a;text-anchor:start;font-weight:400">使用單位部署環境</text><rect x="1640" y="549" width="632" height="155" rx="10" fill="#edf2fb" stroke="#a4b9d7" stroke-width="2" /><text x="1956.0" y="578" style="font-size:26px;fill:#365a8c;text-anchor:middle;font-weight:400">Retrieval Runtime</text><text x="1956.0" y="633" style="font-size:26px;fill:#365a8c;text-anchor:middle;font-weight:400">Library → Remote API Adapter</text><path class="arrow" d="M1956.0 704 L1956.0 802"/><text x="2046.0" y="768" style="font-size:23px;fill:#52647a;text-anchor:middle;font-weight:400">HTTP API</text><rect x="1610" y="802" width="692" height="156" rx="12" fill="#fbf1e4" stroke="#c6a277" stroke-width="2" stroke-dasharray="9 7"/><text x="1956.0" y="854" style="font-size:27px;fill:#93652c;text-anchor:middle;font-weight:400">Developer 自行部署的服務</text><text x="1956.0" y="910" style="font-size:25px;fill:#93652c;text-anchor:middle;font-weight:400">以 URL＋認證連線</text><path d="M1612 996 L2300 996" stroke="#e1e7ef"/><text x="1612" y="1036" style="font-size:23px;fill:#617187;text-anchor:start;font-weight:400">誰部署／維護 API</text><text x="1612" y="1074" style="font-size:26px;fill:#93652c;text-anchor:start;font-weight:400">Developer 自行部署與維運</text><text x="1612" y="1108" style="font-size:26px;fill:#93652c;text-anchor:start;font-weight:400">使用單位只綁定連線</text><text x="1612" y="1187" style="font-size:23px;fill:#617187;text-anchor:start;font-weight:400">Export YAML 包含</text><text x="1612" y="1225" style="font-size:26px;fill:#93652c;text-anchor:start;font-weight:400">Runtime＋Config＋API 連線設定</text><text x="1612" y="1259" style="font-size:26px;fill:#93652c;text-anchor:start;font-weight:400">不產生遠端 API 的部署 YAML</text><text x="1612" y="1338" style="font-size:23px;fill:#617187;text-anchor:start;font-weight:400">Developer 交付物</text><text x="1612" y="1376" style="font-size:26px;fill:#93652c;text-anchor:start;font-weight:400">Endpoint＋認證方式＋契約資訊</text><text x="1612" y="1410" style="font-size:26px;fill:#93652c;text-anchor:start;font-weight:400">不需要交付原始碼或 Image</text><rect x="70" y="1545" width="2260" height="72" rx="10" fill="#eaf0f8" stroke="none" stroke-width="2" /><text x="1200" y="1580" style="font-size:26px;fill:#365170;text-anchor:middle;font-weight:400">共同規則：遵守相同 I/O Contract；演算法參數放 Config；URL／Image／Secret／資源放部署設定。</text><text x="72" y="1642" style="font-size:21px;fill:#708197;text-anchor:start;font-weight:400">討論方案示意｜Remote API 與部署描述尚待正式規格／實作；DEV 測試與 FTEST／ENT 使用相同契約。</text></svg>