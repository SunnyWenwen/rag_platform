# Example pipeline. Adapt the image, runner tags and registry to the company CI.
stages: [check, image]

check:
  stage: check
  image: python:3.12-slim
  variables:
    UV_CACHE_DIR: .uv-cache
  before_script:
    - pip install uv==0.11.*
  script:
    - uv sync --frozen
    - uv run ruff check src tests
    - uv run ruff format --check src tests
    - uv run mypy
    - uv run lint-imports
    - uv run pytest -q

image:
  stage: image
  needs: [check]
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/rag-runtime:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/rag-runtime:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
