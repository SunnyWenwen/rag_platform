# Example pipeline. Adapt the image, runner tags and registry to the company CI.
stages: [check, image]

check:
  stage: check
  image: python:3.12.13-slim-bookworm
  variables:
    UV_CACHE_DIR: .uv-cache
  before_script:
    - pip install uv==0.11.*
  script:
    - uv sync --frozen
    # Same steps as `make check` (the slim image has no make). No external service is needed:
    # tests marked `es` / `embedding` skip themselves unless RAG_TEST_* variables are set.
    - uv run ruff check src tests scripts
    - uv run ruff format --check src tests scripts
    - uv run mypy
    - uv run mypy scripts
    - uv run lint-imports
    - uv run pytest -q --junitxml=pytest-report.xml
  artifacts:
    when: always
    reports:
      junit: pytest-report.xml

image:
  stage: image
  needs: [check]
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/rag-runtime:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/rag-runtime:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
