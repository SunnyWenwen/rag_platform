# Runtime resources for the DEV Runtime. Mounted into the container and selected with
# RAG_RESOURCES_FILE. Changing model_revision, tokenizer revision or text_analysis changes
# the index fingerprint and forces affected Systems to rebuild.
text_analysis: zh_ik

profiles:
  bge-m3:
    label: BGE-M3 (1024)
    dimensions: 1024
    model_id: BAAI/bge-m3
    # Fill in the Hugging Face commit you deploy, e.g. the snapshot hash under models--BAAI--bge-m3.
    model_revision: "REPLACE_WITH_MODEL_COMMIT"
    # OpenAI-compatible embeddings endpoint serving bge-m3 (for example Text Embeddings Inference).
    endpoint: http://bge-m3-embedding/v1
    request_model: BAAI/bge-m3
    max_input_tokens: 8192
    batch_size: 32
    timeout_seconds: 30
    tokenizer_profile_id: bge-m3
    index_options:
      type: int8_hnsw
    # If the service needs a token: name the environment variable that holds it. The Runtime
    # sends "Authorization: Bearer <value>" and refuses to start when the variable is empty.
    # api_key_env: RAG_EMBEDDING_API_KEY

tokenizer_profiles:
  bge-m3:
    label: BGE-M3 tokenizer
    kind: huggingface
    # tokenizer.json from BAAI/bge-m3, baked into the image (no network at runtime).
    path: /opt/models/bge-m3/tokenizer.json
    revision: "bge-m3@REPLACE_WITH_MODEL_COMMIT"

# LLMs of the company LLM service that the built-in Rewrite may use (06#llm-service-deployment).
# Users only pick the ID in the Builder (llm_ref); "default-llm" matches the Descriptor default.
models:
  default-llm:
    label: 公司 LLM
    endpoint: http://REPLACE_WITH_LLM_SERVICE/v1
    request_model: REPLACE_WITH_MODEL_NAME
    timeout_seconds: 20
    temperature: 0
    # If the service needs a token (the Runtime refuses to start when the variable is empty):
    # api_key_env: RAG_LLM_API_KEY
